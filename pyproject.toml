[project]
name = "surrey-biome-pipeline"
version = "0.1.0"
description = "Data acquisition + spatial merging pipeline for forecasting water stress in Surrey's Green Infrastructure Network corridors"
requires-python = ">=3.11"
dependencies = [
    # --- Vector ---
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyogrio>=0.9",        # fast vector I/O (GeoPackage/GeoJSON), replaces fiona
    "pyproj>=3.6",         # CRS transforms
    # --- Raster ---
    "rasterio>=1.3",
    "rioxarray>=0.15",
    "xarray>=2024.0",
    "numpy>=1.26",
    # --- Zonal stats (raster x polygon aggregation) ---
    "exactextract>=0.2",   # exact-fraction zonal stats; preferred over rasterstats
    # --- STAC / satellite acquisition ---
    "pystac-client>=0.8",
    "planetary-computer>=1.0",
    "odc-stac>=0.3",       # STAC items -> analysis-ready xarray (lazy, dask-backed)
    # --- HTTP / API fetching ---
    "httpx>=0.27",
    "requests>=2.32",
    # --- ML baseline (Phase 3) ---
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "pyarrow>=16.0",       # parquet I/O for the Phase 3 feature table
]

[project.optional-dependencies]
# Google Earth Engine path (alternative to Planetary Computer)
gee = ["earthengine-api>=1.0", "geemap>=0.32"]
dev = ["jupyterlab", "notebook", "ipykernel", "nbformat", "ruff", "pytest", "matplotlib", "mapclassify", "folium"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The import root is literally `src`, not `pipeline` — every module, notebook
# and CLI invocation already says `src.pipeline.<name>`, and renaming it would
# break the Phase 2 notebook for no gain. Declaring it here is what makes
# `pip install -e .` register the package, so imports resolve from any working
# directory instead of only from the repo root.
[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
