<!--
  A study centre for AP English Language and Composition, built for a May 2027
  exam.

  Same engine as the other centres: no framework, no build step, no CDN, no
  network. It opens from file:// and keeps every byte of progress in
  localStorage under its own key.

  WHERE THE CONTENT COMES FROM. Everything traces to the College Board Course
  and Exam Description, version V.1, effective Fall 2024 — the edition
  governing a May 2027 exam. A single extract of that document was made once
  and every writer worked from that one copy, so no two of them could end up
  believing different things about the rubric. Every concept carries the skill
  code or rubric row it came from, and selfCheck() refuses a concept that does
  not.

  THE RUBRICS ARE QUOTED, NOT PARAPHRASED. On that one page fidelity beats
  voice: a student practises against those exact sentences and is scored
  against them. Every descriptor, decision rule and note in RUBRICS was
  transcribed from the CED and checked back against it as an exact substring.
  The surrounding "how you earn it" and "how you lose it" commentary is this
  site's own.

  NO REAL EXAM MATERIAL. Every essay prompt, drill passage and practice
  question here is original and says so. Released College Board questions are
  cited, never reproduced.

  WHY THERE IS NO DEPENDENCY MAP. The other centre has one because physics has
  real prerequisite structure — you cannot do energy before dynamics. These
  concepts are mostly lateral: you do not have to master exigence before
  audience, and a diagram implying you did would be a diagram of nothing. The
  prerequisite chains that do exist are short and live inside a single strand,
  and the concept list already shows them in order.

  This centre is NOT affiliated with, endorsed by, or produced by the College
  Board. AP is their trademark.
-->
