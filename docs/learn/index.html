<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Learning Centres</title>

<!--
  The hub. One card per centre, and nothing else.

  This is deliberately NOT a fourth app: it carries no router, no scheduler, no
  content model and no copy of the machinery. It links to the centres and reads
  each one's own localStorage blob to say how far in you are.

  Adding a centre is two things: a directory next to this file, and an entry in
  CENTRES below. When an unbuilt one is built, flip `built` to true.
-->

<link rel="stylesheet" href="shared/centre.css" />
<style>
/* Hub-only layout. Everything visual comes from the shared tokens; this is the
   handful of rules for a page that has no rail and no scroll container. */
.hub{max-width:980px;margin:0 auto;padding:56px 32px 96px}
.hubfoot{margin-top:40px;font-size:12px;color:var(--ink-faint);line-height:1.7}
.ccard{display:block;color:inherit;padding:18px 20px}
.chead{display:flex;gap:14px;align-items:flex-start}
.chead .emo{font-size:34px;line-height:1;flex:0 0 auto}
.cname{font-weight:600;font-size:17px;letter-spacing:-.01em}
.cdesc{color:var(--ink-soft);font-size:13.5px;line-height:1.55;margin:4px 0 0}
.chonest{font-size:12.5px;color:var(--ink-faint);line-height:1.55;margin:10px 0 0}
.cstats{display:flex;gap:22px;margin:14px 0 0;flex-wrap:wrap}
.cstat .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);font-weight:600}
.cstat .v{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cnote{margin:14px 0 0;font-size:12.5px;color:var(--ink-faint)}
</style>
</head>

<body>
<div class="hub">
  <div class="title"><span class="emo">📚</span><h1>Learning Centres</h1></div>
  <p class="lede">Three study centres on one engine. Each keeps its own progress,
    its own concepts and its own schedule; none of them can see the others'.</p>

  <div class="grid g2" style="margin-top:28px" id="cards"></div>

  <p class="hubfoot" id="foot"></p>
</div>

<script>
"use strict";
(function(){

/* One entry per centre. `key` is that centre's localStorage key and must match
   the `storageKey` in its own CENTRE config — they are two halves of the same
   fact, and getting them out of step shows up here as a centre that always
   reads as unopened. */
var CENTRES = [
  {
    id:"surrey", built:true, emoji:"🌲",
    name:"Surrey Biome",
    href:"surrey/index.html#/overview",
    key:"surrey_learn_v1",
    desc:"The corridor water-stress project: remote sensing, downscaled climate, "+
         "the CDEI index, and the experiment that falsified its own hypothesis.",
    honest:"Exam-and-judging preparation for one specific research project, built from that "+
           "project's own documents. It is not an independent check on the science, and the "+
           "preprint it prepares you to defend is not published and not peer reviewed."
  },
  {
    id:"ap-physics-1", built:true, emoji:"🎢",
    name:"AP Physics 1",
    href:"ap-physics-1/index.html#/overview",
    key:"ap_physics_1_learn_v1",
    desc:"Kinematics through rotation and fluids, with the provided equation sheet, worked "+
         "solutions that show their reasoning, and a timed simulator in the exam's real shape.",
    honest:"A course study centre built from the College Board Course and Exam Description for a "+
           "May 2027 exam — every concept cites the topic code it came from. The practice "+
           "questions are original, not College Board material. Not affiliated with, endorsed "+
           "by, or produced by the College Board."
  },
  {
    id:"ap-english-lang", built:true, emoji:"✍️",
    name:"AP English Language",
    href:"ap-english-lang/index.html#/overview",
    key:"ap_english_lang_learn_v1",
    desc:"Rhetorical analysis, synthesis and argument — the rubric rows each is scored on, a "+
         "timed essay workshop, and a passage drill that explains every wrong option.",
    honest:"A course study centre built from the College Board Course and Exam Description for a "+
           "May 2027 exam. Rubric descriptors are quoted and attributed because you are scored "+
           "against those exact sentences; every passage and prompt is original and labelled. "+
           "Not affiliated with, endorsed by, or produced by the College Board."
  }
];

/* Rawson & Dunlosky's criterion, as the centres implement it: three correct
   recalls on three separate days. Repeated here rather than imported because
   the hub deliberately loads none of the machinery — if that number ever
   changes, it changes in two places. */
var CRITERION = 3;

function esc(s){
  return String(s === undefined || s === null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function today0(){ var d = new Date(); d.setHours(0,0,0,0); return d.getTime(); }

/* Reading another page's progress only works when both pages are one origin.
   Served over http they are; opened from file:// the browsers disagree — Safari
   refuses localStorage on file:// outright, and the others scope it in ways that
   are not worth guessing at. So the hub asks whether it can read at all, and
   where it cannot it says so rather than printing three zeroes that would look
   exactly like "you have done nothing". */
var CAN_READ = (function(){
  if (location.protocol === "file:") return false;
  try { localStorage.getItem("__probe"); return true; }
  catch(e){ return false; }
})();

/* The three numbers, computed from the stored blob and nothing else. No
   denominators: the totals live in the centre's own content, and a total
   hardcoded here would drift the first time a concept is added.

   "Concepts opened" is not the centre's own "concepts touched", and is labelled
   as the narrower thing on purpose. A centre counts a concept as touched once
   any of its cards has been seen, which needs the card-to-concept map — content
   this page deliberately does not load. Opened lessons are what the blob knows
   by itself, so that is what it reports. */
function progress(key){
  var raw;
  try { raw = localStorage.getItem(key); } catch(e){ return null; }
  if (!raw) return null;
  var d;
  try { d = JSON.parse(raw); } catch(e){ return null; }
  if (!d || typeof d !== "object") return null;

  var lessons = d.lessons || {}, cards = d.cards || {}, t = today0();
  var opened = 0, crit = 0, due = 0, id;
  for (id in lessons) if (Object.prototype.hasOwnProperty.call(lessons, id)) opened++;
  for (id in cards){
    if (!Object.prototype.hasOwnProperty.call(cards, id)) continue;
    var c = cards[id];
    if (!c || !c.seen) continue;
    if ((c.streak || 0) >= CRITERION) crit++;
    if (c.due <= t) due++;
  }
  return {opened:opened, crit:crit, due:due};
}

function statsHtml(p){
  return '<div class="cstats">'+
    '<div class="cstat"><div class="k">Concepts opened</div><div class="v">'+p.opened+'</div></div>'+
    '<div class="cstat"><div class="k">Cards at criterion</div><div class="v">'+p.crit+'</div></div>'+
    '<div class="cstat"><div class="k">Due today</div><div class="v">'+p.due+'</div></div>'+
  '</div>';
}

function card(c){
  var inner =
    '<div class="chead"><span class="emo">'+c.emoji+'</span><div style="flex:1;min-width:0">'+
      '<div class="cname">'+esc(c.name)+
        (c.built ? '' : ' <span class="pill"><span class="dot"></span>not built yet</span>')+
      '</div>'+
      '<p class="cdesc">'+esc(c.desc)+'</p>'+
    '</div></div>'+
    '<p class="chonest">'+esc(c.honest)+'</p>';

  if (!c.built){
    inner += '<p class="cnote">Nothing to open yet.</p>';
    return '<div class="card ccard">'+inner+'</div>';
  }
  if (!CAN_READ){
    inner += '<p class="cnote">Progress is stored per centre and cannot be read from '+
             '<code>file://</code> — open the centre to see where you are.</p>';
  } else {
    var p = progress(c.key);
    inner += p ? statsHtml(p) : '<p class="cnote">Not opened yet.</p>';
  }
  return '<a class="card hoverable ccard" href="'+esc(c.href)+'">'+inner+'</a>';
}

document.getElementById("cards").innerHTML = CENTRES.map(card).join("");
document.getElementById("foot").innerHTML = CAN_READ
  ? 'Progress is read from each centre&rsquo;s own <code>localStorage</code> key. '+
    'Nothing is shared between centres and nothing leaves this browser &mdash; back it up from a '+
    'centre&rsquo;s Progress page.'
  : 'Opened from <code>file://</code>, so the per-centre progress numbers are not readable here. '+
    'Everything inside each centre still works offline; run <code>docs/learn/serve.py</code> if you '+
    'want the numbers on this page (and the tutor drawer inside them).';

})();
</script>
</body>
</html>
