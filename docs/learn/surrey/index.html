/* --- remote sensing --- */
{id:"c-refl-1", conceptId:"reflectance", type:"concept", front:"What does a satellite actually measure, and why is it not a photograph?",
 back:"The fraction of sunlight bouncing back off the ground in each of several narrow spectral slices, recorded separately. Each slice is a band; the fraction is reflectance, 0 to 1. A photograph blends them into three colours; a satellite keeps them apart, including bands your eye cannot see."},
{id:"c-refl-2", conceptId:"reflectance", type:"concept", front:"Why do healthy leaves show a big gap between red and near-infrared reflectance?",
 back:"Chlorophyll absorbs red light hard — it is being used for photosynthesis — while the spongy internal structure of a leaf scatters near-infrared strongly. So red comes back low and NIR comes back high. That gap is the physical basis of every vegetation index."},
{id:"c-refl-3", conceptId:"reflectance", type:"choice", front:"Why free Sentinel-2/Landsat rather than commercial sub-metre imagery?",
 back:"The deliverable has to be something the City can re-run itself every summer at no cost. A method depending on a licence a municipality must renew is a subscription, not a monitoring tool. Commercial imagery also is not archived back to 2017, which the nine-summer extension needed."},
{id:"c-ratio-1", conceptId:"band-ratio", type:"concept", front:"Why is almost every vegetation index a ratio rather than a raw band value?",
 back:"A ratio cancels anything that scales all bands together — sun angle, thin haze, topographic shading. Raw brightness would make the same forest look different at noon and at 4pm. The normalised difference form also bounds the result in [−1, +1]."},
{id:"c-ratio-2", conceptId:"band-ratio", type:"concept", front:"A ratio cancels multiplicative effects. What does it NOT cancel, and why does that matter here?",
 back:"Additive offsets. (kA−kB)/(kA+kB) equals (A−B)/(A+B), but ((A+c)−(B+c))/((A+c)+(B+c)) does not. This is exactly the mechanism behind the BOA-offset bug: subtracting an offset that was already removed, then clipping at zero, drove NDVI to exactly 1.0.",
 hint:"Think about what happens to the numerator versus the denominator."},
{id:"c-ndvi-1", conceptId:"ndvi", type:"concept", front:"What does NDVI measure — and what does it not measure?",
 back:"It measures how much healthy green leaf area there is. It does not measure how thirsty that green is. That distinction is the reason SWCI exists, and it is close to the heart of the canopy-density confound: greener is not the same as wetter."},
{id:"c-ndvi-2", conceptId:"ndvi", type:"number", front:"Corrected NDVI over the Surrey panel — the median.", back:"0.768",
 means:"With a range of 0.244 to 0.908. Compare the withdrawn artifact, which claimed a median of 0.986 and 87% above 0.9. An ordinary median is what a correct pipeline looks like."},
{id:"c-ndvi-3", conceptId:"ndvi", type:"concept", front:"NDVI plays three separate roles in this project. Name them.",
 back:"(1) An input to the dry edge, and therefore to CDEI. (2) The variable used to diagnose the canopy-density confound (ρ = −0.347 against CDEI). (3) A variable deliberately excluded as a predictor, because predicting CDEI from NDVI would be circular."},
{id:"c-swci-1", conceptId:"swci", type:"concept", front:"What does SWCI measure, and why does it respond to drought before NDVI does?",
 back:"Liquid water inside leaves, via the two shortwave-infrared bands (B11/B12). A stressed tree closes its stomata and loses leaf moisture days or weeks before it visibly browns — so water content moves while greenness is still fine."},
{id:"c-swci-2", conceptId:"swci", type:"concept", front:"Is SWCI the same as Gao's NDWI? Be precise.",
 back:"No. SWCI is B11/B12 — SWIR against SWIR. Gao (1996) NDWI is NIR against SWIR. Different band pairs, different quantities. Gao is cited in the preprint as a CONTRAST, not as the source. Inverting this would be a misattribution inside your own methods section.",
 hint:"Which two bands, in each case?"},
{id:"c-lst-1", conceptId:"lst", type:"concept", front:"Why should surface temperature say anything about water stress?",
 back:"Transpiration cools. A tree with enough water evaporates it through its leaves, and evaporation carries heat away — the same way sweating cools you. A tree that has run short shuts its stomata, stops transpiring, and heats up."},
{id:"c-lst-2", conceptId:"lst", type:"concept", front:"Landsat thermal is delivered at 30 m. What is the caveat?",
 back:"The sensor measures ~100 m patches. The 30 m grid is resampled from them, so about nine output pixels come from one real reading.",
 means:"The grid got finer; the information did not. Fine spatial detail in an LST image is interpolation, not measurement."},
{id:"c-lst-3", conceptId:"lst", type:"concept", front:"A corridor is ~40 m wide and the thermal footprint is ~100 m. What does that do to its absolute LST?",
 back:"It mixes in the surroundings — road, roofs, adjacent land. The reading is partly the neighbourhood, not the canopy.",
 means:"Which is why absolute LST cannot rank corridors: a corridor beside a highway reads hot because the highway is inside the footprint, not because its trees are stressed."},
{id:"c-lst-4", conceptId:"lst", type:"concept", front:"Why does dividing by the polygon's own multi-summer mean rescue a contaminated thermal reading?",
 back:"The surroundings barely change year to year, so the constant contamination divides out. What survives is this polygon's deviation from its own normal.",
 means:"A thermometer that averages the whole room cannot compare two people. It can still tell you one person has a fever, by comparing them to their own usual reading."},
{id:"c-boa-1", conceptId:"boa-offset", type:"concept", front:"Explain the BOA offset bug from first principles.",
 back:"Atmospheric correction can produce slightly negative reflectance over dark targets, and the format stores unsigned integers, so ESA adds a 1000 DN pedestal before storage. You subtract it once to recover the value. Some providers already have; some claim to and have not. Subtracting twice drops every band by 1000; red is the smallest band over forest, so red goes negative first and clip(min=0) pins it at zero; and NDVI with red = 0 reduces to N/N = exactly 1.0.",
 hint:"Start with why the pedestal exists at all — unsigned integers.",
 means:"The direction matters: the pedestal is ADDED before storage and SUBTRACTED to recover. Only over-subtracting can drive a value negative."},
{id:"c-boa-2", conceptId:"boa-offset", type:"concept", front:"How is the offset now determined, instead of being trusted?",
 back:"Measured per scene. boa_offset_per_time takes the 1st percentile of valid cloud-masked red in raw DN — dark targets like the Fraser River, Boundary Bay and deep shadow — and compares it to an 800 DN threshold. Disagreement with the provider metadata is logged."},
{id:"c-boa-3", conceptId:"boa-offset", type:"number", front:"The dark-pixel threshold used to detect whether the BOA offset is still present (DN).", back:"800",
 hint:"It is calibrated against one specific scene. Which, and why?",
 means:"Calibrated against **haze**. Clear no-offset scenes read 44–178 DN; one hazy scene (2023-08-28) reads 502; an offset-carrying scene reads ~1000. Haze is itself an additive lift — scattered light reaching the sensor without touching the ground — so the probe must separate residual haze (~500) from the storage pedestal (~1000). 800 clears the worst observed haze case with margin while staying well below a genuine offset."},
{id:"c-boa-4", conceptId:"boa-offset", type:"number", front:"Measured BOA offset on the Fraser Valley transect (DN).", back:"0",
 means:"Independent confirmation that the Phase 2 correction holds on a second extent — the transect scenes had the offset already removed."},
{id:"c-sat-1", conceptId:"ndvi-saturation-artifact", type:"concept", front:"What was the Phase 2 NDVI saturation claim, and what was it really?",
 back:"It reported NDVI saturating above 0.9 in 87% of corridors and treated it as an ecological finding about dense urban canopy. It was the offset bug: 69% of pixels sat at exactly 1.000, median 0.986. Retracted. After the fix NDVI spans 0.244–0.908, median 0.768."},
{id:"c-sat-2", conceptId:"ndvi-saturation-artifact", type:"concept", front:"What was the forensic tell that the saturation was arithmetic rather than physical?",
 back:"Not that values were high — that 69% were at EXACTLY 1.000. A physical process does not pile up on a bound to five decimal places. clip(min=0) followed by a ratio is a value generator, not a measurement."},
{id:"c-mask-1", conceptId:"cloud-masking", type:"choice", front:"Median composite for optical, mean for thermal. Why the difference?",
 back:"Optical noise is skewed — a missed thin cloud is bright, and a median ignores it while a mean is dragged up. Thermal noise is roughly symmetric, so a mean uses all the information. A maximum thermal composite, which is common, would just track the single clearest hot afternoon."},
{id:"c-mask-2", conceptId:"cloud-masking", type:"concept", front:"Why must no-data be NaN and never 0 in this pipeline?",
 back:"Because NDVI and SWCI both legitimately take the value 0. A 0 sentinel would be silently averaged in as a real measurement, biasing every zonal statistic toward zero with no error raised."},
{id:"c-stac-1", conceptId:"stac-cog", type:"concept", front:"What do STAC and COG each do, and why are both needed?",
 back:"STAC is a queryable catalogue — 'every Sentinel-2 scene over this box, these dates, under 20% cloud' (Landsat's thermal search is looser, at 40%, because its revisit is sparser). COG lets you read a small window out of a huge remote file over HTTP. Together you compute over terabytes while transferring megabytes."},
{id:"c-stac-2", conceptId:"stac-cog", type:"choice", front:"Why configure two interchangeable STAC providers?",
 back:"So a single vendor outage does not block the pipeline. It had a second, unplanned benefit: the two providers do not treat the BOA offset identically, and that disagreement is what exposed the bug."},
{id:"c-sar-1", conceptId:"sar-backscatter", type:"concept", front:"Why is Sentinel-1 radar a legitimate independent check on an optical index?",
 back:"Different physics. It emits its own microwave pulse and measures the echo, so it responds to geometry and moisture rather than pigment, and works through cloud and at night. If a validating instrument shared a failure mode with the instrument being validated, agreement would not be evidence."},
{id:"c-sar-2", conceptId:"rvi-crossratio", type:"concept", front:"What did the Sentinel-1 validation actually find? State it honestly.",
 back:"The vegetation-condition indices (RVI, cross-ratio) were flat-null against the corridor ranking in all four summers, |ρ| ≤ 0.084. The only radar quantity that correlated with the ranking was raw VH — and VH tracks NDVI at about +0.55. So what agrees with the ranking is canopy density, not canopy water.",
 means:"Radar did not validate the index. It failed to corroborate it, and diagnosed why."},
{id:"c-sar-3", conceptId:"rvi-crossratio", type:"number", front:"VH backscatter against NDVI — the approximate correlation across summers.", back:"0.55",
 means:"Individually +0.615, +0.536, +0.557, +0.549 for 2022–2025. This is what identifies the ranking's confound as canopy density."},
{id:"c-sar-4", conceptId:"rvi-crossratio", type:"number", front:"Largest absolute RVI-versus-ranking correlation across all four summers.", back:"0.084",
 means:"Flat null. Across 2022–2025 the values are −0.066, +0.084, +0.012, −0.030. Stable across four years, so not a one-year artifact."},

/* --- GIS --- */
{id:"c-crs-1", conceptId:"crs-26910", type:"concept", front:"Why is every spatial operation done in EPSG:26910 rather than lat/long?",
 back:"Latitude and longitude are angles. A degree of longitude is ~111 km at the equator and ~73 km at Surrey's latitude, so areas and buffers computed in degrees are wrong in a way that changes with location. UTM Zone 10N is a projected grid in metres."},
{id:"c-crs-2", conceptId:"crs-26910", type:"concept", front:"Where do EPSG:4326 and EPSG:3005 still appear, and why only there?",
 back:"4326 (WGS84 lon/lat) only because STAC search demands a lon/lat bounding box. 3005 (BC Albers) only because the provincial WFS serves VRI in it. Both are converted at the boundary; neither is ever used for analysis."},
{id:"c-zonal-1", conceptId:"zonal-stats", type:"concept", front:"What is a zonal statistic, and why is it not trivial?",
 back:"Summarising all raster pixels inside a polygon to one number. Not trivial because pixels do not respect polygon boundaries — many are cut by the edge, and for a corridor one or two pixels wide, edge pixels are most of them."},
{id:"c-zonal-2", conceptId:"zonal-stats", type:"choice", front:"Why aggregate each raster to polygons first, rather than resampling everything to a common grid?",
 back:"The 20 m optical and 30 m thermal grids do not align. Resampling thermal to 20 m would manufacture detail at three times the resolution the instrument delivers. Polygon-first avoids inventing precision that is not in the measurement."},
{id:"c-cov-1", conceptId:"coverage-weighting", type:"concept", front:"Why does coverage-weighted extraction matter so much for Surrey specifically?",
 back:"Surrey's corridors are 0.29–157.8 ha but long and narrow rather than compact. It is the shape, not the area, that creates the problem: a thin polygon has a huge perimeter-to-area ratio, so a large share of its pixels are edge pixels blending canopy with pavement."},
{id:"c-cov-2", conceptId:"coverage-weighting", type:"number", front:"Median coverage_frac for Phase 3b VRI stands.", back:"1.00",
 means:"No stand below 0.5. VRI stands are large and compact enough that Surrey's thin-corridor partial-pixel problem simply disappears at the transect."},
{id:"c-covf-1", conceptId:"coverage-frac", type:"concept", front:"What is coverage_frac, and what is the trap in computing it?",
 back:"valid_px / expected_px, where expected_px = polygon_area / pixel_area. The trap is the denominator: pixel area must be recomputed per raster. A 30 m Landsat pixel is 9× the area of a 10 m Sentinel-2 pixel, so reusing one constant understates thermal coverage ninefold."},
{id:"c-mix-1", conceptId:"mixed-pixels", type:"concept", front:"Mixed pixels are the obvious objection to the Surrey analysis. How was it answered?",
 back:"Two ways. Structurally, a half-pixel inward buffer strips edge pixels. Empirically — and this is the stronger half — corridor width against CDEI gives ρ = −0.038, p = 0.64. If mixed pixels drove the result, narrow corridors would read systematically differently. They do not."},
{id:"c-mix-2", conceptId:"mixed-pixels", type:"number", front:"Corridor width against CDEI: the correlation.", back:"-0.038",
 means:"p = 0.64. Limitations item 11 — one of the few limitations recorded as checked and found NOT to bite."},
{id:"c-mix-3", conceptId:"mixed-pixels", type:"number", front:"Effective analysis width of Surrey corridors, in metres.", back:"39.7",
 means:"Against 94.8 m for transect stands. The two extents are not measuring the same kind of object — Limitations item 10."},
{id:"c-buf-1", conceptId:"inward-buffer", type:"choice", front:"Why a half-pixel (5 m) inward buffer rather than a full pixel?",
 back:"Surrey's target corridor widths start at 10 m, so a full 10 m buffer would erase the narrowest corridors entirely — exactly the ones most vulnerable to mixed pixels, and the ones the City most needs information about."},
{id:"c-buf-2", conceptId:"inward-buffer", type:"concept", front:"What happens to corridors whose geometry collapses under the buffer?",
 back:"They keep their original shape and get a too_thin=True flag; they are not dropped. The count of them is treated as a finding in its own right — how many corridors are unmeasurable at 10 m. Dropping them would improve every summary statistic while hiding the limitation that produced the improvement."},
{id:"c-rep-1", conceptId:"representative-point", type:"choice", front:"Why representative_point() rather than the centroid, for the climate query?",
 back:"Surrey's corridors follow creeks and ravines — long, narrow, often curved. The centroid of a crescent falls outside the shape. You would be querying climate for a point in the neighbouring subdivision, silently, and at a possibly different elevation, which is the input downscaling turns on."},
{id:"c-gin-1", conceptId:"gin-corridors", type:"number", front:"Number of GIN corridors the City of Surrey manages.", back:"144",
 means:"Served as 153 polygons, because seven corridors are digitised in two to four pieces."},
{id:"c-gin-2", conceptId:"gin-corridors", type:"choice", front:"Why the polygon layer rather than the City's 'Ecosystem Corridors' polyline layer?",
 back:"You cannot compute zonal statistics inside a line. Zonal aggregation requires an area."},
{id:"c-gin-3", conceptId:"gin-corridors", type:"concept", front:"The City of Surrey study was miscited here once. How?",
 back:"It was cited for establishing a 144-corridor network. It actually reports 396 corridor SEGMENTS; the 144 come from its Appendix J. The bibliography entry was perfectly correct and the claim was wrong — the project's own example of why verified metadata is not the same as having read a paper."},
{id:"c-id-1", conceptId:"gin-id-vs-objectid", type:"concept", front:"What is the difference between objectid and id, and why did it matter?",
 back:"objectid is an ArcGIS row number (1–153). id is the City's actual GIN corridor number (1–144). Everything reported before 29 July 2026 used objectid, so 'corridor 73' named a table row rather than the corridor the City calls 73 — serious for a deliverable meant to send a planner to a place."},
{id:"c-id-2", conceptId:"gin-id-vs-objectid", type:"number", front:"Attribute agreement against the City's Appendix J when joined on objectid (%).", back:"33.8",
 means:"Indistinguishable from chance. Joined on id instead, agreement is 95.8–99.3%. That cross-tabulation is how the key was settled — empirically, not by reading the column name."},
{id:"c-id-3", conceptId:"gin-id-vs-objectid", type:"concept", front:"What visible artifact did the unit confusion produce in the manuscript?",
 back:"Table 1 was a polygon top-10 labelled 'Corridor' with objectids, and it listed GIN 14 twice — at ranks 1 and 5, with two different stress values. Figure 2 had the same duplication. Both now take the GIN table, and fig_top_ranking warns if handed the polygon table."},
{id:"c-unit-1", conceptId:"modelling-vs-reporting-unit", type:"concept", front:"Why keep two units rather than collapsing to one?",
 back:"The polygon is the modelling unit — it has its own pixels, its own coverage_frac, and it is what CV blocks on. The GIN corridor is the reporting unit — what the City manages and budgets for. Collapsing to 144 discards the per-polygon coverage the zonal design needs; reporting 153 hands the City database row numbers."},
{id:"c-unit-2", conceptId:"modelling-vs-reporting-unit", type:"number", front:"Split corridors that straddled a cross-validation block, across five repeats.", back:"0",
 means:"The obvious leakage objection to the two-unit design, checked rather than assumed. Zero in all five repeats, so the published results stand as computed."},
{id:"c-unit-3", conceptId:"modelling-vs-reporting-unit", type:"choice", front:"Corridor values are area-weighted means of their polygons. Why weight by area?",
 back:"Because a 13 ha piece and a 0.8 ha piece should not count equally toward one corridor's value. An unweighted mean would let a sliver dominate a corridor it barely constitutes."},

/* --- CDEI ---
   Rewritten 2026-08-02 against the retrieval-practice properties: focused,
   precise, consistent, tractable, effortful. One fact per card, one
   unambiguous answer. Multi-part "explain the whole mechanism" prompts belong
   in Mock interview, which grades them against a rubric; a flashcard that asks
   for six sentences cannot be graded honestly and is not retrieval practice.
   Existing ids are preserved so review history survives. */
{id:"c-fs-1", conceptId:"feature-space", type:"concept", front:"In this project's feature space, what is on each axis?",
 back:"NDVI horizontally, SWCI vertically — greenness against canopy water."},
{id:"c-fs-2", conceptId:"feature-space", type:"concept", front:"Which envelope of the cloud is the dry edge here, and what is its slope?",
 back:"The LOWER envelope, with a POSITIVE slope.",
 means:"Inverted from the classical LST–NDVI trapezoid, where the dry edge is the upper envelope with a negative slope. SWCI rises with canopy water; temperature falls with it."},
{id:"c-fs-3", conceptId:"feature-space", type:"concept", front:"Why does the classical version of this method plot temperature instead of SWCI?",
 back:"It predates the shortwave-infrared water indices — Moran 1994 and Carlson & Ripley 1997 used LST against NDVI because thermal was the available moisture proxy."},
{id:"c-fs-4", conceptId:"feature-space", type:"concept", front:"What does the SHAPE of the cloud tell you that neither axis tells you alone?",
 back:"For any given greenness there is a driest and a wettest that vegetation plausibly reaches, so position within the wedge is informative where a raw coordinate is not."},

{id:"c-dry-1", conceptId:"dry-edge", type:"concept", front:"What does the dry edge represent, in one sentence?",
 back:"For vegetation of a given greenness, about as little canopy water as is ever observed."},
{id:"c-dry-3", conceptId:"dry-edge", type:"number", front:"Number of NDVI bins used to fit the dry edge.", back:"12",
 means:"Equal-frequency (quantile) bins, so each holds the same count of observations."},
{id:"c-dry-4", conceptId:"dry-edge", type:"number", front:"Which percentile of SWCI is taken within each NDVI bin?", back:"5",
 means:"Not the minimum. A raw minimum would chase one outlier pixel-aggregate per bin and make the line hostage to noise."},
{id:"c-dry-5", conceptId:"dry-edge", type:"concept", front:"Why equal-FREQUENCY bins rather than equal-width?",
 back:"So a sparsely populated NDVI range cannot get a bin of its own, where the 5th percentile would be computed from too few points."},
{id:"c-dry-2", conceptId:"dry-edge", type:"choice", front:"The dry edge is fitted across all polygon-summers at once. What was rejected, and why?",
 back:"Fitting per year. It re-zeroes the index every summer, so a dry year and a wet year are each measured against their own edge — erasing the between-year signal a drought monitor exists to detect."},
{id:"c-dry-6", conceptId:"dry-edge", type:"concept", front:"Panel-wide fitting buys comparability across summers. What does it cost?",
 back:"Sensitivity to slow change in the panel itself — a fixed line against a drifting cloud. The same property, seen from two sides."},

{id:"c-perp-1", conceptId:"perpendicular-distance", type:"concept", front:"Why divide the vertical gap by √(1+b²)?",
 back:"It converts vertical distance to perpendicular — the true shortest distance from the point to the line. They differ whenever the line is not horizontal."},
{id:"c-perp-2", conceptId:"perpendicular-distance", type:"concept", front:"Which corridors are the most stressed — high CDEI or low?",
 back:"LOW.",
 means:"dry_dist is signed positive on the WET side, so a low value means sitting close to the dry edge with little moisture margin. Getting this backwards inverts the entire deliverable."},
{id:"c-perp-3", conceptId:"perpendicular-distance", type:"concept", front:"Write the sign convention for dry_dist.",
 back:"Positive = wet side, above the line."},
{id:"c-perp-4", conceptId:"perpendicular-distance", type:"concept", front:"The stress percentile runs 0–100. Which end is most stressed?",
 back:"100 is most stressed. The ranking is ascending CDEI."},

{id:"c-rlst-1", conceptId:"rlst", type:"concept", front:"Why is RLST computed in Kelvin rather than Celsius?",
 back:"A ratio is only meaningful on a scale with a true zero. Celsius has an arbitrary one."},
{id:"c-rlst-4", conceptId:"rlst", type:"concept", front:"Give the Celsius-versus-Kelvin ratio example that shows why the scale matters.",
 back:"21 °C over 20 °C is 1.05; 294 K over 293 K is 1.003. Same physical change, different number."},
{id:"c-rlst-2", conceptId:"rlst", type:"number", front:"Spearman correlation between CDEI and dry_dist alone.", back:"0.99997",
 means:"The thermal term carries essentially no between-polygon information. Limitations item 3 — disclosed, and moved forward to §2.2 where RLST is defined after an outside review."},
{id:"c-rlst-3", conceptId:"rlst", type:"choice", front:"Why does temperature enter as a ratio to the polygon's own mean rather than as an absolute value?",
 back:"Absolute surface temperature between polygons is dominated by surroundings and viewing geometry — a corridor beside a highway against one in a shaded ravine. Running hotter than its own normal is a signal; being always hot is not."},
{id:"c-rlst-5", conceptId:"rlst", type:"concept", front:"Why does RLST barely move, by construction?",
 back:"Summer surface temperatures in Kelvin all sit near 290–310, so the ratio to a polygon's own mean is confined to a narrow band."},

{id:"c-cdei-1", conceptId:"cdei", type:"concept", front:"State the CDEI formula.",
 back:"CDEI = dry_dist / RLST"},
{id:"c-cdei-5", conceptId:"cdei", type:"concept", front:"What does the numerator of CDEI measure?",
 back:"Perpendicular distance from the fitted NDVI–SWCI dry edge — the moisture-margin term."},
{id:"c-cdei-3", conceptId:"cdei", type:"concept", front:"Does CDEI measure soil moisture?",
 back:"No.",
 means:"It is a relative feature-space index from reflectance and surface temperature, never validated against a ground observation at either extent. Saying otherwise is on the never-say list."},
{id:"c-cdei-2", conceptId:"cdei", type:"concept", front:"Why was the index renamed from TVWSI to CDEI?",
 back:"TVWSI is already the name Joshi et al. 2021 use for a different index."},
{id:"c-cdei-6", conceptId:"cdei", type:"concept", front:"Why is the dataframe column still called tvwsi?",
 back:"The cached panels were built under the old name; renaming the field would invalidate them. Same quantity, legacy column name."},
{id:"c-cdei-4", conceptId:"cdei", type:"number", front:"Rows in the canonical Surrey panel.", back:"612",
 means:"153 polygons × 4 summers, 2022–2025."},
{id:"c-cdei-7", conceptId:"cdei", type:"number", front:"Rows in the transect panel.", back:"1200",
 means:"300 VRI stands × 4 summers."},
{id:"c-cdei-8", conceptId:"cdei", type:"number", front:"Polygon-summers in the extended nine-summer Surrey record.", back:"1377",
 means:"2017–2025. Built with --freeze-from so the canonical years reproduce bit-exactly."},

{id:"c-frz-1", conceptId:"frozen-reference", type:"concept", front:"What two quantities does --freeze-from reuse instead of refitting?",
 back:"The dry edge and the per-polygon RLST baseline."},
{id:"c-frz-3", conceptId:"frozen-reference", type:"concept", front:"Why would a naive extension move already-published CDEI values?",
 back:"Both the dry edge and the RLST baseline are properties of the panel they were fitted on, so adding summers refits them and shifts every earlier value."},
{id:"c-frz-2", conceptId:"frozen-reference", type:"number", front:"Median shift in published CDEI under a naive unfrozen extension, as a percentage of one standard deviation.", back:"8.1",
 means:"Enough to move reported numbers and the dry-edge coefficients printed in the paper and Figure 1."},
{id:"c-frz-4", conceptId:"frozen-reference", type:"number", front:"Difference on all six derived columns when frozen mode reproduces the canonical years.", back:"0",
 means:"0.000e+00 — asserted as a check before anything downstream is compared."},
{id:"c-frz-5", conceptId:"frozen-reference", type:"concept", front:"Why is applying a frozen index to new summers a stronger claim than refitting?",
 back:"It is an out-of-sample application of a fixed index. Refitting and re-reporting is a new description of a new dataset."},

{id:"c-drift-1", conceptId:"cdei-drift", type:"concept", front:"In one sentence, what causes the CDEI drift?",
 back:"The dry edge is frozen while the panel slowly gets greener, so the cloud slides relative to a fixed line."},
{id:"c-drift-6", conceptId:"cdei-drift", type:"number", front:"Mean NDVI difference between the two halves of the nine-summer record.", back:"0.014",
 means:"p = 0.40 — not significant. SWCI differs by −0.005 at p = 0.12, also not significant."},
{id:"c-drift-7", conceptId:"cdei-drift", type:"number", front:"Resulting shift in dry_dist, in standard deviations.", back:"0.51",
 means:"At p = 1e-17, from two individually non-significant input shifts. Dry-edge geometry amplifies."},
{id:"c-drift-2", conceptId:"cdei-drift", type:"concept", front:"Which expression predicts the drift from the two input shifts?",
 back:"(Δswci − b·Δndvi) / √(1+b²)",
 means:"Predicted 0.0065; observed 0.0077. That agreement is what identifies the cause as geometry rather than the sensor."},
{id:"c-drift-3", conceptId:"cdei-drift", type:"concept", front:"Name the four mechanisms ruled out before dry-edge geometry was accepted.",
 back:"The frozen RLST baseline; the thermal term entirely; a code-version difference in the imagery; any significant shift in the input bands.",
 means:"All four ruled out by test, not by argument. The rebuilt 2022/2023 rasters are bit-identical at r = 1.00000."},
{id:"c-drift-5", conceptId:"cdei-drift", type:"number", front:"Network-wide CDEI-versus-moisture correlation over the nine-summer record.", back:"0.070",
 means:"Against −0.68 on four summer means. The four-summer relationship did not reproduce."},
{id:"c-drift-4", conceptId:"cdei-drift", type:"concept", front:"What is happening in 2018 and 2021?",
 back:"I don't know yet.",
 means:"Both are dry summers reading as unstressed, and within the five earlier summers the moisture correlation is absent rather than displaced — r = −0.04, p = 0.28. Do not manufacture an explanation."},
{id:"c-drift-8", conceptId:"cdei-drift", type:"concept", front:"What is the untested fix for the drift?",
 back:"Refit the dry edge per period, or normalise against a reference that does not move with canopy growth, then re-extend. It needs no new data and has not been done."},

{id:"c-conf-1", conceptId:"canopy-confound", type:"number", front:"Spearman correlation between CDEI and NDVI over Surrey.", back:"-0.347",
 means:"n = 153 polygons; reported as −0.35 in the abstract. Greener polygons read as MORE stressed."},
{id:"c-conf-2", conceptId:"canopy-confound", type:"number", front:"The same correlation at the transect, against stand NDVI.", back:"-0.314",
 means:"n = 300. Essentially the same magnitude as Surrey — the confound is a property of the index, not of Surrey."},
{id:"c-conf-5", conceptId:"canopy-confound", type:"concept", front:"Which radar quantity correlates with the corridor ranking, and what is it really tracking?",
 back:"Raw VH backscatter — and VH tracks NDVI at about +0.55, so it is tracking canopy density."},
{id:"c-conf-6", conceptId:"canopy-confound", type:"number", front:"Largest absolute RVI-versus-ranking correlation across the four summers.", back:"0.084",
 means:"Flat null every year: −0.066, +0.084, +0.012, −0.030. The vegetation-condition radar indices do not corroborate the ranking."},
{id:"c-conf-4", conceptId:"canopy-confound", type:"number", front:"Share of between-stand CDEI variance explained by land-cover class alone, as a percentage.", back:"2.7",
 means:"With crown closure at +0.180 and height and age near 0 — so the confound runs along greenness, not along stand type."},
{id:"c-conf-3", conceptId:"canopy-confound", type:"concept", front:"What did the confound cost the deliverable?",
 back:"It was demoted to exploratory, with the caveat on every figure.",
 means:"Found by the project itself with an independent sensor. Never say the ranking is validated."},
{id:"c-conf-7", conceptId:"canopy-confound", type:"concept", front:"Does the confound sink the central A-versus-B finding?",
 back:"No — residualising CDEI on 24 independent VRI attributes STRENGTHENS it.",
 means:"ΔRMSE rises from +0.00093 to +0.00113 at 25 km, interval still excluding zero. The confound is real for the ranking; it does not carry the central result."},
/* --- climate --- */
{id:"c-norm-1", conceptId:"climate-normal", type:"concept", front:"What is a climate normal, and which one does this project actually use?",
 back:"A long-term average, typically 30 years, that makes a particular summer interpretable as unusual or not. The plan called for 1971–2000; the ClimateBC API serves only Normal_1961_1990, so every anomaly here is against 1961–1990. A documented deviation, not a silent substitution."},
{id:"c-anom-1", conceptId:"climate-anomaly", type:"concept", front:"Why does radiation get a level but no anomaly twin?",
 back:"At a single latitude, incoming solar radiation is very nearly constant between summers, so its anomaly would be noise around zero — a feature that adds dimensionality without information."},
{id:"c-anom-2", conceptId:"climate-anomaly", type:"concept", front:"What is the structural irony in using anomalies as predictors here?",
 back:"Anomalies are almost purely temporal — they vary between years, not between places. Over Surrey the target varies mostly in SPACE. So the more sophisticated-looking feature is exactly the one with nothing to contribute. That is the orthogonal-axes problem in miniature."},
{id:"c-cbc-1", conceptId:"climatebc-downscaling", type:"concept", front:"What makes ClimateBC 'scale-free', and what actually limits its resolution?",
 back:"It takes latitude, longitude and elevation and returns climate for that exact point — no grid at all. It interpolates between coarse grid points and applies an elevation adjustment. What limits it is the DEM: effective resolution is set by the elevation model you feed it, not by any property of the climate product."},
{id:"c-cbc-2", conceptId:"climatebc-downscaling", type:"number", front:"Approximate effective resolution of ClimateBC, in metres (lower bound of the quoted range).", back:"375",
 means:"Quoted as roughly 375–750 m. Compare Sentinel-2 optical at 10 m (SWIR 20 m) and Landsat thermal at 30 m — the climate data is by far the coarsest input."},
{id:"c-cbc-3", conceptId:"climatebc-downscaling", type:"choice", front:"Why is the DEM fetch wrapped in retry-with-backoff plus a fallback to a raw AWS COG bucket?",
 back:"Because elevation is the lever the whole downscaling turns on, and a DEM failure at minute zero kills a 33-hour unattended acquisition run. The cost of the fallback is a few lines; the cost of not having it is a day."},
{id:"c-var-1", conceptId:"climate-vars", type:"concept", front:"What is CMD, and why is it the most relevant climate variable here?",
 back:"Climatic moisture deficit: how much more water the atmosphere wanted to evaporate than was actually available. It is the most direct climate measure of drought pressure, which is why it is the variable CDEI's temporal direction check is run against."},
{id:"c-var-2", conceptId:"climate-vars", type:"number", front:"CMD_sm between-year sd divided by between-corridor sd over Surrey.", back:"10.2",
 means:"10.2× more temporal than spatial — the single most extreme entry in the orthogonal-axes table, and the clearest statement of why Surrey could not test a spatial hypothesis."},
{id:"c-var-3", conceptId:"climate-vars", type:"concept", front:"How does the ClimateBC API fail, and why is that dangerous?",
 back:"Silently. A malformed period returns −9999, or the degenerate triple MAT=0 / MAP=1 / AHM=10000, rather than an error. validate_record rejects those before they can reach a model. A silent failure that returns plausible numbers is far worse than a crash."},
{id:"c-rate-1", conceptId:"rate-limited-acquisition", type:"number", front:"ClimateBC calls permitted per hour, per IP address.", back:"50",
 means:"Undocumented — discovered by hitting it. There is no batch endpoint. The limiter is paced at 46–48/hour to stay under it."},
{id:"c-rate-2", conceptId:"rate-limited-acquisition", type:"choice", front:"Why is the job order corridor-major rather than period-major?",
 back:"So a partial run yields a COMPLETE panel for the first k corridors, rather than holes scattered across every corridor. Complete-for-some is usable; incomplete-for-all is not."},
{id:"c-rate-3", conceptId:"rate-limited-acquisition", type:"choice", front:"Why not parallelise the ClimateBC fetch across threads or machines?",
 back:"The limit is per IP, so concurrency buys nothing and risks a ban. The correct response to a rate limit is patience plus resumability — a permanent disk cache and atomic write-then-rename — not cleverness."},
{id:"c-bec-1", conceptId:"bec-zone", type:"choice", front:"Why √n allocation when sampling the 300 transect stands, rather than proportional?",
 back:"Proportional allocation would have spent ~77% of the budget on lowland Coastal Western Hemlock, where most stands are, leaving the montane band unsampled — destroying the elevation gradient the transect exists for. Equal allocation would over-weight rare zones. √n is the standard compromise."},

/* --- statistics --- */
{id:"c-res-1", conceptId:"residual", type:"concept", front:"What is a residual, and why does its STRUCTURE matter as much as its size?",
 back:"observed − predicted. Large but patternless residuals mean a noisy problem. Spatially clustered residuals — all positive here, all negative there — mean the model is missing something systematic, and are the signature of spatial autocorrelation."},
{id:"c-rmse-1", conceptId:"rmse-mae", type:"concept", front:"RMSE versus MAE — what is the difference in what they punish?",
 back:"MAE averages the absolute residuals; every error counts in proportion to its size. RMSE squares first, so a few large misses count far more than many small ones. RMSE ≥ MAE always, and the gap between them tells you how uneven the errors are."},
{id:"c-rmse-2", conceptId:"rmse-mae", type:"concept", front:"Surrey's ΔRMSE and ΔMAE point in opposite directions. What does that tell you?",
 back:"That neither model is doing anything meaningful. ΔRMSE is −0.00004 (A very slightly better) while ΔMAE is +0.00018 (B better). Two summaries of the same residuals disagreeing on sign is what a null looks like from the inside."},
{id:"c-r2-1", conceptId:"r-squared", type:"concept", front:"What is R² comparing your model against?",
 back:"The laziest possible model: always predict the mean, ignoring every input. R² = 0.5 means your squared errors are half that model's. R² = 0 means you did exactly as well as guessing the average — you learned nothing."},
{id:"c-r2-2", conceptId:"negative-r2", type:"concept", front:"How can R² be negative, and what does R² = −0.138 mean?",
 back:"On held-out data nothing forces R² positive. Negative means worse than predicting the mean — you would have done better ignoring every predictor. −0.138 is Model A on the transect: fine-scale climate detail is not merely uninformative for stand water stress, it is anti-informative.",
 means:"Attack surface 8. If you cannot explain this cleanly the whole results section becomes indefensible."},
{id:"c-r2-3", conceptId:"negative-r2", type:"concept", front:"What evidence shows Model A's negative R² is overfitting rather than noise?",
 back:"R²_A climbs monotonically from −0.249 to −0.060 as minimum leaf size grows from 1 to 10, while R²_B does not move. Constraining the learner suppresses the damage — which is what overfitting to fine-grained detail looks like."},
{id:"c-r2-4", conceptId:"negative-r2", type:"concept", front:"'So the better model is the one that barely beats a straight line?' Answer it.",
 back:"Effectively yes, and I would not claim more. R²_B = +0.003 is not skill. The conclusion is about the comparison, not about either model being useful: fine climate resolution did not help, and at 25 km it actively hurt. Neither model is a usable predictor of stand water stress."},
{id:"c-cv-1", conceptId:"cross-validation", type:"concept", front:"Why is a random train/test split wrong for a spatial problem?",
 back:"It scatters neighbouring locations across train and test, so a model can predict a held-out corridor by effectively looking up the one next door. That is proximity, not skill, and it inflates the score. Ploton et al. 2020 demonstrate this directly."},
{id:"c-sac-1", conceptId:"spatial-autocorrelation", type:"concept", front:"What is spatial autocorrelation, and when does it become a problem?",
 back:"Nearby things resemble each other — shared soil, weather, species, management. That is a real property of the world, not a nuisance. It becomes a problem only when a validation procedure lets a model exploit it and then reports the result as predictive skill."},
{id:"c-bcv-1", conceptId:"blocked-cv", type:"concept", front:"How are the spatial blocks built, and what are the two guardrails?",
 back:"K-means on projected corridor coordinates; whole clusters held out. Guardrails: block count auto-shrinks to keep ≥8 corridors per held-out block, and fewer than 16 corridors raises rather than producing unscoreable folds."},
{id:"c-bcv-2", conceptId:"blocked-cv", type:"concept", front:"Repeats re-seed the blocking, not just the model. Why does that distinction matter?",
 back:"Repeating with the same partition only measures model variance. Re-partitioning measures whether the result survives a different carving of the map — a much stronger claim, and the one that matters when the blocks are arbitrary."},
{id:"c-bcv-3", conceptId:"blocked-cv", type:"concept", front:"'Isn't blocked CV just making your problem artificially hard?' Answer it.",
 back:"The handicap is the point. The intended use is prediction on corridors the model has never seen, so a validation that permits neighbour lookup measures the wrong thing. Ploton 2020 shows random splits inflate accuracy for exactly this reason."},
{id:"c-grp-1", conceptId:"grouped-folds", type:"concept", front:"Why must all four summers of a corridor share a fold — and how does that happen for free?",
 back:"Otherwise 2022 in training and 2024 in testing means the model has effectively seen the answer, since corridors change slowly. It is free because k-means runs on corridor coordinates, so each corridor gets one block and all its rows inherit it. Grouping falls out of blocking."},
{id:"c-pair-1", conceptId:"paired-difference", type:"concept", front:"Why compare models by a paired difference rather than by their overall scores?",
 back:"Some folds are simply harder, and both models do badly on them. Scoring on identical folds and differencing means whatever made a fold hard cancels. What is left is the signal: is A consistently better than B?"},
{id:"c-pair-2", conceptId:"paired-difference", type:"concept", front:"The residualisation retest fits globally rather than per fold — an acknowledged leak. Why is it still defensible?",
 back:"Because it leaks identically into both arms, and the reported quantity is the paired difference. The absolute scores would not be trustworthy; the comparison between two arms that were contaminated in the same way still is. The script states this openly rather than hiding it."},
{id:"c-boot-1", conceptId:"bootstrap-ci", type:"concept", front:"Explain the bootstrap in your own words.",
 back:"Resample your per-fold differences with replacement to make a new set the same size, compute the average, repeat 10,000 times. The middle 95% of those averages is the interval. It assumes nothing about normality — which matters, because a dozen folds is nowhere near enough to assume it."},
{id:"c-boot-2", conceptId:"bootstrap-ci", type:"choice", front:"Why a bootstrap interval rather than a paired t-interval?",
 back:"A t-interval assumes the per-fold differences are approximately normal. With a small number of spatially-blocked folds that is not defensible. The bootstrap makes no such claim."},
{id:"c-ci-1", conceptId:"ci-excludes-zero", type:"concept", front:"Why does 'the interval excludes zero' matter more than the verdict word?",
 back:"The verdict label flips on the cell size — FALSIFIED at 25 km, INCONCLUSIVE at 12 km — because it depends on a threshold set at exactly zero. The paired interval does not flip: it excludes zero in 32 of 32 runs across both cell sizes. The robust quantity should carry the conclusion.",
 means:"Say this unprompted. The coach brief specifically asks for it without being pushed there."},
{id:"c-ci-2", conceptId:"ci-excludes-zero", type:"number", front:"Runs, out of 32 across both cell sizes, in which the paired interval excludes zero.", back:"32",
 means:"12 of 12 at 12 km and 20 of 20 at 25 km. The single most robust number in the project."},
{id:"c-ci-3", conceptId:"ci-excludes-zero", type:"concept", front:"Under eight hyperparameter settings, what is the fully honest statement of the result?",
 back:"Model B is better on the point estimate in 8 of 8, and R²_B stays within [+0.001, +0.004] — but the paired interval excludes zero in only 6 of 8. So: the coarse model is never worse, it is significantly better under most reasonable settings including the pre-registered one, with the qualification that heavy regularisation (leaf 5 and 10) closes the gap to statistical indistinguishability."},
{id:"c-rf-1", conceptId:"random-forest", type:"concept", front:"How does a random forest work, and why is the randomness necessary?",
 back:"Hundreds of decision trees, each grown on a random subsample and considering a random subset of predictors at each split, then averaged. The randomness makes the trees disagree, and averaging disagreeing models is far more robust than trusting one — a single tree overfits badly."},
{id:"c-rf-2", conceptId:"random-forest", type:"concept", front:"Why does the preprint cite Breiman 2001 and not only scikit-learn?",
 back:"scikit-learn is the implementation; Breiman is the method. Citing only the library credits the software rather than the idea, which an earlier draft did. It is the difference between crediting a tool and crediting a contribution."},
{id:"c-rf-3", conceptId:"random-forest", type:"number", front:"Pre-registered minimum samples per leaf in the forest.", back:"3",
 means:"With 400 trees and max_features = sqrt. Constrained deliberately: at leaf size 1 the forest can memorise individual corridors, and R²_A there is −0.249, its worst value."},
{id:"c-perm-1", conceptId:"permutation-importance", type:"concept", front:"What is permutation importance, and why must it be scored on a held-out block?",
 back:"Shuffle one predictor and measure how much worse the model gets; no drop means it was not being used. Scored in-sample it reports what the model latched onto, including memorisation. Scored on a held-out spatial block it reports what actually helps on unseen stands — the only useful question."},
{id:"c-perm-2", conceptId:"permutation-importance", type:"concept", front:"What are the leading drivers of between-stand water stress by permutation importance?",
 back:"Leading species (bigleaf maple), stand area, aspect (eastness then northness), and broadleaf class. No climate variable appears anywhere in the ranking."},
{id:"c-sp-1", conceptId:"spearman", type:"choice", front:"Why Spearman rather than Pearson for the validation correlations?",
 back:"Pearson measures how well two variables follow a straight line. Spearman correlates ranks, so it catches any consistently increasing or decreasing relationship and is barely affected by outliers. 'Do these order the landscape the same way?' is a rank question."},
{id:"c-sp-2", conceptId:"spearman", type:"number", front:"Largest |ρ| between stand-mean CDEI and any climate/elevation gradient variable at the transect.", back:"0.145",
 means:"Elevation, +0.145; CMD_sm −0.093, Tmax_sm −0.139, Eref_sm −0.138. n = 300. |ρ| ≤ 0.15 is the crux of the whole Phase 3b conclusion: both vary in space, along different patterns."},
{id:"c-sp-3", conceptId:"spearman", type:"concept", front:"Is a near-zero rank correlation with n = 300 an absence of evidence?",
 back:"No — it is a strong negative statement. With 300 stands, ρ ≈ 0.1 says the two quantities genuinely do not order the landscape the same way. Absence of evidence would be a wide interval from a small sample; this is a tight estimate near zero."},
{id:"c-resid-1", conceptId:"residualisation", type:"concept", front:"How does residualisation test whether a finding is really about a confounder?",
 back:"Regress the outcome on the suspected confounder and keep the residuals — the part it cannot explain. Re-run the analysis on those. If the finding disappears it was the confounder; if it survives it was not."},
{id:"c-resid-2", conceptId:"residualisation", type:"concept", front:"Why two residualisation strengths rather than one?",
 back:"A single one invites the objection that you chose the flattering amount. Structural (24 VRI attributes, independent of the imagery) is the clean test. Greenness (adding stand NDVI) is a deliberate over-correction — NDVI is a constitutive input to dry_dist, so it removes the index rather than the confound. Bounding from both sides removes the move."},
{id:"c-resid-3", conceptId:"residualisation", type:"number", front:"Residualised paired ΔRMSE at 25 km, on 24 VRI attributes.", back:"0.00113",
 means:"CI [+0.00049, +0.00183], against +0.00093 unresidualised. Residualising on canopy structure STRENGTHENS the result rather than weakening it — which refutes the objection that the A-vs-B finding is really about canopy density."},
{id:"c-mah-1", conceptId:"mahalanobis-novelty", type:"concept", front:"What was the subtle error in the original Mahalanobis novelty calculation?",
 back:"It scaled by the covariance of the NORMALS rather than of the DEPARTURES. Over a flat 30 km delta the normals barely vary, so their covariance is near-singular; scaling by it inflated distances tenfold and ranked 'unusual place' rather than 'unusual climate'. Median novelty went from 14.3 to 1.87 once corrected."},
{id:"c-mah-2", conceptId:"mahalanobis-novelty", type:"concept", front:"Why add a ridge before inverting the covariance?",
 back:"ClimateBC variables stay strongly collinear even after differencing, so the matrix is near-singular and the inverse is numerically unstable. A small ridge scaled to 1e-6 × trace(cov) regularises it enough to pseudo-invert safely."},
{id:"c-seed-1", conceptId:"seed-sensitivity", type:"concept", front:"Why re-run the whole experiment across many seeds?",
 back:"Model B clears the skill gate by about three thousandths, which invites the objection that it is an artifact of which partition k-means happened to draw. Re-seeding both the blocking and the forest shows the verdict is a deterministic function of cell size — 0/12 above zero at 12 km, 20/20 at 25 km — not a lucky draw."},
{id:"c-seed-2", conceptId:"seed-sensitivity", type:"number", front:"Mean R²_B across 20 seeds at 25 km.", back:"0.0033",
 means:"± 0.0005, and above zero in 20 of 20. Stable — but stability is not magnitude. +0.003 is a reliable measurement of no useful skill."},
{id:"c-dem-1", conceptId:"within-unit-demeaning", type:"concept", front:"What does within-unit demeaning change about the question being asked?",
 back:"It switches from 'do dry polygons differ from wet polygons?' (a question about places) to 'does a given polygon read drier in the summers when it IS drier?' (a question about time). Subtracting each polygon's own mean from both series removes all permanent between-polygon differences."},
{id:"c-dem-2", conceptId:"within-unit-demeaning", type:"number", front:"CDEI against CMD across the four summer means.", back:"-0.68",
 means:"n = 4. Within polygons (n = 612) it is only −0.31. A correlation on four points establishes a sign, not a magnitude — which is why this is called a direction check rather than a validation."},
{id:"c-dem-3", conceptId:"within-unit-demeaning", type:"number", front:"CDEI against precipitation across the four summer means.", back:"0.72",
 means:"n = 4; within-polygon (n = 612) it is +0.32. Correct sign — wetter summers read less stressed — but a weak magnitude once permanent between-polygon differences are removed."},
{id:"c-hold-1", conceptId:"temporal-holdout", type:"concept", front:"Why is the within-corridor anomaly R² of +0.051 not a real result?",
 back:"Spatial CV holds out corridors, not years, so all four summers are in training and the model can simply learn four year-means. The forward holdout cannot be cheated that way, and gives R² = −1.673 for the anomaly target against −0.041 for the level. Do not cite the +0.051."},
{id:"c-hold-2", conceptId:"temporal-holdout", type:"number", front:"Forward-holdout R² for the within-corridor anomaly target (train <2025, test 2025).", back:"-1.673",
 means:"Catastrophically negative, against −0.041 for the level target. This is the test that killed a result the project had already found and liked."},
{id:"c-circ-1", conceptId:"circular-stats-aspect", type:"concept", front:"Why can't you average aspect in degrees?",
 back:"Degrees wrap. 359° and 1° are two degrees apart in the world and 358 apart in arithmetic; their mean comes out as 180°, due south — the exact opposite of the truth. Aspect is stored as northness and eastness unit-vector components instead."},

/* --- experimental design --- */
{id:"c-ab-1", conceptId:"model-a-vs-b", type:"concept", front:"State the experiment in one sentence.",
 back:"Two models identical in every respect — same learner, folds, seeds, features and target — except that Model A uses scale-free ClimateBC sampled per polygon and Model B uses those same values averaged into coarse cells. Only spatial resolution differs."},
{id:"c-ab-2", conceptId:"model-a-vs-b", type:"concept", front:"What result would have falsified the hypothesis, and what actually happened?",
 back:"The coarse model performing as well or better, with a paired interval excluding zero. At the transect at 25 km that is exactly what happened: ΔRMSE +0.00093, CI [+0.00021, +0.00170]. Over Surrey the test could not run at all — INCONCLUSIVE."},
{id:"c-ab-3", conceptId:"model-a-vs-b", type:"number", front:"Surrey Model A RMSE.", back:"0.01393",
 means:"R² −0.042. Model B is 0.01397, R² −0.051. Both worse than predicting the mean; the paired difference is −0.00004 with CI [−0.00016, +0.00007], spanning zero."},
{id:"c-ab-4", conceptId:"model-a-vs-b", type:"number", front:"Transect Model A R² at 25 km.", back:"-0.138",
 means:"Against Model B's +0.003. The fine-resolution model is substantially worse than predicting the mean; the coarse one is negligibly better than it."},
{id:"c-ab-5", conceptId:"model-a-vs-b", type:"number", front:"Transect paired ΔRMSE at 25 km.", back:"0.00093",
 means:"CI [+0.00021, +0.00170], excluding zero; positive in 20 of 20 seeds. Positive means Model A is worse. This is the falsifying result."},
{id:"c-deg-1", conceptId:"degrade-not-substitute", type:"choice", front:"Why is Model B a degradation of ClimateBC rather than a real coarse climate product?",
 back:"Two different products differ in source stations, interpolation, reference period and bias correction. If one won you could not say whether resolution or everything else caused it. Blurring the fine product holds all of that constant, so resolution is the only thing that varies. A narrower question answered cleanly beats a broader one answered uninterpretably."},
{id:"c-deg-2", conceptId:"degrade-not-substitute", type:"concept", front:"What must you concede about Model B, unprompted?",
 back:"That it is not a real climate model. No regional climate model was run; it is a synthetic spatial degradation of ClimateBC standing in for one. Attack surface 7 — say it before you are asked, then explain why the alternative design was worse."},
{id:"c-up-1", conceptId:"upscaling", type:"concept", front:"The upscale averages within (cell, year). Why not within cell alone?",
 back:"Averaging within cell across all years would destroy the temporal signal as well as the spatial one. Averaging within (cell, year) preserves year-to-year variation exactly, so only spatial detail is destroyed — which is what the hypothesis is about."},
{id:"c-up-2", conceptId:"upscaling", type:"concept", front:"Why does the cell anchoring have to be specified in the methods?",
 back:"Because a half-cell shift would change which units fall together and therefore change the partition and the result. §2.5 states cells are anchored to the EPSG:26910 origin at ⌊x/c⌋, ⌊y/c⌋. An outside reviewer raised exactly this gap."},
{id:"c-up-3", conceptId:"upscaling", type:"concept", front:"What is the squeeze between cell size and blockability?",
 back:"Bigger cells destroy more spatial variance, which is what the contrast gate wants — but they leave fewer cells, and below about 8 there is not enough geographic spread to spatially block Model B. Surrey needs ~20 km cells for real contrast and has only 4 cells at that size. There is no escape inside Surrey."},
{id:"c-gate-1", conceptId:"contrast-gate", type:"concept", front:"What does the contrast gate ask, and why is it the project's main contribution?",
 back:"Did the coarsening actually change the predictors? If not, A and B are nearly the same model and a null difference is arithmetic rather than evidence — a result that looks exactly like a null finding while proving nothing. Stated generally: measure the fraction of predictor spatial variance the coarsening destroys BEFORE comparing climate resolutions."},
{id:"c-gate-2", conceptId:"contrast-gate", type:"number", front:"Spatial variance removed by Surrey's 4 km coarsening (%).", back:"12.3",
 means:"Against a 30% gate. Models A and B stay correlated at a median r = 0.998 — two near-identical models, so the null between them is arithmetic."},
{id:"c-gate-3", conceptId:"contrast-gate", type:"number", front:"Spatial variance removed at the transect's 25 km cell (%).", back:"48.4",
 means:"Leading predictors — Eref, Tmax, CMD — lose 58–68%, while 10 cells still leave enough spread to block Model B. The gate passes and the test becomes real."},
{id:"c-gate-4", conceptId:"contrast-gate", type:"number", front:"The contrast-gate threshold, as a fraction.", back:"0.30",
 means:"MIN_CONTRAST_FRAC. Below it, no verdict is issued — the result is INCONCLUSIVE regardless of what the models did."},
{id:"c-skill-1", conceptId:"skill-gate", type:"concept", front:"What is the skill gate, and what is wrong with it?",
 back:"At least one model must beat predicting the mean — MIN_SKILL_R2 = 0.0. What is wrong is that exactly zero is a convenience, not a principled boundary, and the results land on opposite sides of it at two defensible cell sizes: +0.0035 at 25 km, −0.0027 at 12 km."},
{id:"c-skill-2", conceptId:"skill-gate", type:"concept", front:"How was the threshold-artifact problem addressed, rather than defended?",
 back:"The verdict LABELS were removed from the evidence tables. tab:cellsens, tab:seedsens and tab:hpsens now report whether the paired interval excludes zero, not a verdict word; the labels are discussed in the text as threshold artifacts. Limitations item 12 had already recommended this and the tables were contradicting it."},
{id:"c-verd-1", conceptId:"verdict-rule", type:"concept", front:"'You wrote the gate after Surrey returned its null.' Answer it in three parts.",
 back:"(1) A gate is an inclusion criterion, not a hypothesis dressed as a prediction — HARKing is inventing a hypothesis to fit a result. (2) The diagnostic never sees the response variable, so it cannot be tuned toward an outcome. (3) The same gate, unchanged, was applied to the transect, where it permitted a verdict CONTRADICTING my own hypothesis. A criterion that lets your own hypothesis be falsified is not a rationalisation.",
 means:"Attack surface 5. Reconstruct this from scratch rather than reciting it — and do not claim the gate was pre-registered."},
{id:"c-inc-1", conceptId:"inconclusive-vs-not-supported", type:"concept", front:"INCONCLUSIVE versus NOT SUPPORTED — what is the difference?",
 back:"NOT SUPPORTED: the test worked and the hypothesis did not survive it. INCONCLUSIVE: the test could not run, so no conclusion is available in either direction. Reporting a failed test as a failed hypothesis is an overclaim, and the CWSF rubric's lowest band is defined by exactly that."},
{id:"c-inc-2", conceptId:"inconclusive-vs-not-supported", type:"concept", front:"Why can more Surrey data not fix the inconclusive verdict?",
 back:"The variance decomposition is a property of the ClimateBC field over Surrey, not of the sample. It was written as a prediction on a 114-corridor panel and then confirmed: adding the remaining 39 corridors (+34% of rows) moved every point estimate slightly and changed nothing structural. No sample from inside a flat 30 km municipality can manufacture a spatial climate gradient that is not there."},
{id:"c-orth-1", conceptId:"orthogonal-axes", type:"concept", front:"Explain the orthogonal-axes problem without using the word orthogonal.",
 back:"Over Surrey the climate changes a lot from year to year and barely at all from corridor to corridor. Water stress does the opposite — it changes a lot between corridors and little between years. So the thing predicting and the thing being predicted vary along different directions, and blocked CV asks the model to rank corridors along exactly the direction where climate is nearly constant."},
{id:"c-orth-2", conceptId:"orthogonal-axes", type:"number", front:"How many times more CDEI varies between stands than between years, at the transect.", back:"122",
 means:"sd 0.0241 between stands against 0.0022 between years — the exact inverse of Surrey, where CDEI was 4.1× more spatial but the predictors were 10× more temporal. It is why the transect can ask the question Surrey could not."},
{id:"c-orth-3", conceptId:"orthogonal-axes", type:"concept", front:"Which citation covers the space-for-time failure at the centre of this diagnosis?",
 back:"Perret, Evans & Sax (2024), PNAS 121(1):e2304404120 — a species' spatial climate response does not predict its temporal response. Do NOT cite 10.1073/pnas.2320424121 as the primary source; that is Angert's commentary on it."},
{id:"c-assum-1", conceptId:"assumption-not-accuracy", type:"concept", front:"“Both your models are useless. Why is comparing them worth anything?”",
 back:"Because the claim is the difference, not the level. Both arms see identical folds, seeds, hyperparameters and target, and differ only in predictor resolution — so whatever makes the problem hard is common to both and cancels out of the subtraction. ΔRMSE +0.00093, CI [+0.00021, +0.00170], excluding zero in 32 of 32 seeds. The interval never depended on either model being good.",
 hint:"What quantity is actually being reported — a score, or a difference between two scores?",
 means:"The claim is never 'Model B is good.' It is 'the fine data bought nothing,' which is a fact about the data product rather than about the model."},
{id:"c-assum-2", conceptId:"assumption-not-accuracy", type:"concept", front:"Why does the resolution assumption matter even if no model works?",
 back:"Because it sits upstream of any model. §1.2: it 'drives real decisions about what data to acquire and what to spend.' Someone chooses whether to buy or compute a fine climate surface instead of using the coarse field they already have, and that choice is made before anyone knows whether a model will work at all."},
{id:"c-assum-3", conceptId:"assumption-not-accuracy", type:"choice", front:"Why not add terrain and stand structure to both models until something scores well?",
 back:"It would produce a better-looking results section and an uninterpretable experiment. Elevation is ClimateBC's own DEM input and terrain is exactly what the coarsening does not blur, so Model A would win on terrain; NDVI/SWCI/LST are what CDEI is built from. The two arms would then be dominated by predictors resolution does not touch, so a null proves nothing and a positive result is unattributable."},
{id:"c-assum-4", conceptId:"assumption-not-accuracy", type:"concept", front:"The project DID chase a well-performing model. Where, and what did it find?",
 back:"The explanatory analysis, which asks 'if not climate, then what?' — a different question with a different design. Climate alone CV R² −0.138, terrain −0.085, stand structure +0.004, terrain + structure +0.029, and adding climate back on top makes it worse at +0.020. The driver is local terrain and stand composition, and climate actively degrades the fit.",
 means:"Still weak in absolute terms — R² +0.03 to +0.04 — so it is reported as a directional result, not a usable predictor."},
{id:"c-assum-5", conceptId:"assumption-not-accuracy", type:"number", front:"Best explanatory family (terrain + stand structure): cross-validated R².", back:"0.029",
 hint:"It is the only predictor family that crosses into positive skill.",
 means:"80% of folds positive. Adding climate on top drops it to +0.020 — independent confirmation that the climate gradient is noise for this target."},
{id:"c-leak-1", conceptId:"leakage-discipline", type:"choice", front:"Elevation obviously predicts water stress. Why is it excluded from the predictor set?",
 back:"Because it is a DEM INPUT to ClimateBC's downscaling, not a climate variable. Including it would let Model A win on terrain rather than on climate — and terrain is exactly what the coarsening does not blur. It converts a climate-resolution test into a terrain test."},
{id:"c-leak-2", conceptId:"leakage-discipline", type:"concept", front:"Why is RLST quarantined into a separate RS_AUGMENTED predictor group?",
 back:"An RS-derived predictor against an RS-derived target confounds the resolution question with shared measurement structure. The climate-only set is what the A-vs-B test runs on."},
{id:"c-circu-1", conceptId:"circularity-exclusion", type:"concept", front:"Why are NDVI, SWCI and LST barred as predictors in the explanatory analysis?",
 back:"CDEI is built from them. Predicting an index from its own inputs is arithmetic, not discovery, and would have produced an impressive R² meaning nothing. Only families independent of the imagery are compared: climate, terrain, and VRI stand structure."},
{id:"c-circu-2", conceptId:"circularity-exclusion", type:"number", front:"Best CV R² from the terrain-plus-structure family.", back:"0.029",
 means:"Positive in 80% of folds. The only family to cross into positive skill — and adding climate on top makes it WORSE, +0.029 down to +0.020. Weak in absolute terms; a directional result, not a predictive model."},
{id:"c-maup-1", conceptId:"maup", type:"concept", front:"Define the Modifiable Areal Unit Problem in one sentence, without the acronym.",
 back:"Statistical results computed on aggregated spatial units depend on how you drew the units, so redrawing the boundaries can change the correlations without anything in the world having changed.",
 means:"Openshaw 1984. The coach brief asks for exactly this — one sentence, no acronym."},

/* --- domain --- */
{id:"c-vri-1", conceptId:"vri", type:"choice", front:"Why VRI stands rather than protected areas as the transect analysis units?",
 back:"Protected areas gave only 11–19 polygons ranging from 3 ha to 61,594 ha — far too few and far too heterogeneous. VRI gave 12,168 candidates to sample 300 from, with consistent attributes. Protected areas are kept only as a validation subset."},
{id:"c-vri-2", conceptId:"vri", type:"concept", front:"Why is the transect latitude capped at 49.20 N?",
 back:"Without the cap the sampling box reaches the North Shore mountains, and it stops being a west-to-east valley transect. The cap keeps the gradient the one the design intended."},
{id:"c-tr-1", conceptId:"elevation-transect", type:"concept", front:"Why move the test to the Fraser Valley instead of collecting more Surrey data?",
 back:"Because the Surrey failure was structural, not a sample-size problem — the spatial climate gradient across a flat 30 km municipality does not exist to be resolved. The transect climbs 4–1,920 m over 100 km, which is a real spatial climate gradient. Surrey stays the application site; the transect is where the method question gets answered."},
{id:"c-tr-2", conceptId:"elevation-transect", type:"number", front:"Maximum elevation on the Fraser Valley transect, in metres.", back:"1920",
 means:"From 4 m, over 100 km. Surrey spans −1 to 116 m across 30 km. That gradient is the entire point of the second extent."},
{id:"c-tr-3", conceptId:"elevation-transect", type:"concept", front:"What did the transect have to clear, and what actually happened?",
 back:"Both preconditions, not just the blurring one — Phase 3's skill failure was independent of the 12% contrast. The contrast gate passed (48.4%), and the skill gate still failed for Model A, but now for a diagnosable reason: the target varies strongly in space and the climate gradient simply does not align with it."},
{id:"c-aj-1", conceptId:"appendix-j", type:"number", front:"Corridors, out of 144, carrying the restoration priority flag.", back:"14",
 means:"Most-stressed third AND (high ecological value OR high development risk). Presented as candidates to investigate, explicitly not a confirmed list, because the spatial ranking is not validated."},
{id:"c-aj-2", conceptId:"appendix-j", type:"concept", front:"What three things does the delivered corridor ranking combine?",
 back:"The CDEI stress percentile; the City's own ecological value and development-risk attributes; and a persistence count of how many of the four summers that corridor sat in the driest tercile. Plus the City's own Appendix J recommendation text, so the output speaks the City's language."},
{id:"c-vnr-1", conceptId:"verified-not-read", type:"concept", front:"Why is 'the DOI resolves' not enough?",
 back:"You can verify authors, year, journal and DOI and still not know what the paper found. The City of Surrey study was cited here for a 144-corridor network when it reports 396 corridor segments. Perfect metadata, wrong claim. If you cite something and cannot say what it found, that is a Red."},
{id:"c-vnr-2", conceptId:"verified-not-read", type:"number", front:"Scholarly citations in the preprint after the July 2026 audit.", back:"24",
 means:"Up from 11 across 31 pages, against 72 in the 16-page Klinges et al. 2024. 32 bib entries total. Still thin, and the right move if asked is to say so."},
{id:"c-vnr-3", conceptId:"verified-not-read", type:"concept", front:"Why is Meyer & Pebesma 2021 cited?",
 back:"Area of applicability — and it is cited as a check that was NOT performed. The coach brief asks specifically why you would cite something you did not do: because the honest way to flag a missing analysis is to name the method and say you did not run it."},
{id:"c-vnr-4", conceptId:"verified-not-read", type:"concept", front:"Why are Lembrechts 2020 (SoilTemp) and Maclean 2019 (microclima) cited?",
 back:"They are the two routes to microclimate that were NOT taken: measure it directly with sensors, or model it mechanistically. Cited as a limitation on the approach, not as support for it."},
{id:"c-vnr-5", conceptId:"verified-not-read", type:"concept", front:"Why is Klinges et al. 2024 the closest analogue?",
 back:"It tests essentially the same question and finds that proximity beats resolution. It is the paper the central argument leans on, and it is also the citation-density benchmark that triggered the reference audit — 72 references in 16 pages."}
