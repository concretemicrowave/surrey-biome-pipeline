{era:"p3", date:"2026-07-22", kind:"result", key:true,
 title:"Verdict INCONCLUSIVE — and the distinction matters",
 what:"On the full panel, fine climate and blurred climate perform the same. The paired difference in error spans zero, and the fine model is better in 48% of folds — a coin flip.\n\nThe verdict is deliberately **not** “downscaling does not help”. Both preconditions of the test failed, so the experiment as specified had nothing to measure at this extent. Reporting a bare negative would have claimed evidence the run does not contain.",
 why:"A null result from a test that could not have detected an effect is not evidence of absence. Saying so costs the headline and keeps the claim honest.",
 changed:"Sent the project looking for a second extent instead of publishing a null, and forced the verdict function to gate on both preconditions rather than on the comparison alone.",
 evidence:["Model A: RMSE 0.01393, R² −0.042","Model B (4 km): RMSE 0.01397, R² −0.051","paired ΔRMSE −0.00004, CI [−0.00016, +0.00007] — spans zero","no candidate response variable has skill: −0.042, −0.043, −0.232, −0.280, −0.655","4 km upscaling removes 12.3% of spatial variance, against a 30% gate"],
 artifacts:["docs/PHASE3_FINDINGS.md","src/pipeline/experiment.py"],
 concepts:["verdict-rule","inconclusive-vs-not-supported","contrast-gate","skill-gate","negative-r2","paired-difference"]},

{era:"p3", date:"2026-07-22", kind:"result", key:true,
 title:"Root cause: the predictors and the response vary along orthogonal axes",
 what:"One table explains every symptom. Over Surrey, the climate variables vary 2–10× more **between years** than between corridors. The response variable varies 3–9× more **between corridors** than between years.\n\nSpatially-blocked cross-validation asks the model to rank corridors it has never seen — precisely the axis along which climate is near-constant across a 30 km municipality. The predictor and the target move along different axes, so a resolution hypothesis has nothing to bite on.\n\nMore corridors cannot fix this. That was written as a prediction on a partial panel and confirmed on the full one: adding the remaining 39 corridors moved every point estimate slightly and changed nothing structural.",
 why:"The hypothesis carried a hidden premise — that meaningful climate variation exists **between** corridors to resolve. At single-municipality scale that premise is simply false.",
 changed:"Reframed the Phase 3 outcome from a failed experiment into a methodological finding: scale-free downscaling cannot be validated at intra-urban scale. It also produced the project's most portable output — a cheap pre-flight test that takes an afternoon and would have saved a 16-hour acquisition.",
 evidence:["CMD_sm: 77.53 between years vs 7.63 between corridors — 10.2× temporal","greenness: 0.0127 between years vs 0.1194 between corridors — 9.4× spatial","CDEI: 4.1× spatial"],
 concepts:["orthogonal-axes","spatial-autocorrelation","blocked-cv"]},

{era:"p3", date:"2026-07-22", kind:"check", key:true,
 title:"A tempting result is tested and thrown away",
 what:"Stripping each corridor's own mean to isolate the temporal axis appears to produce skill, with a physically correct sign: R² +0.051, and a −0.677 correlation with summer moisture deficit across the four summer means.\n\nIt is memorisation. Spatial cross-validation holds out **corridors**, not **years**, so all four summers sit in training and the model can simply learn four year-means. The forward holdout — train on everything before 2025, test on 2025 — is the test that cannot cheat, and it collapses to **−1.673**.",
 why:"The demeaned result was the only positive number in the entire phase. That is exactly the kind of number that needs an adversarial test rather than a victory lap.",
 changed:"The +0.051 is recorded as a do-not-cite. It also exposed a structural point: upscaling averages within cell **and year**, so the temporal signal is preserved exactly by design — on a purely temporal target the two models are identical by construction, and resolution can only ever be tested on the spatial axis.",
 evidence:["level target, forward holdout: R² −0.041","demeaned target, forward holdout: R² −1.673"],
 concepts:["within-unit-demeaning","temporal-holdout","cross-validation"]},

{era:"p3", date:"2026-07-22", kind:"correction",
 title:"Two code corrections the diagnosis forced",
 what:"The verdict function now gates on **both** preconditions — model skill, and spatial variance actually removed by upscaling — and returns INCONCLUSIVE when either fails, instead of a bare “not supported” that would read as evidence against downscaling.\n\nThe novelty measure was rescaled by the covariance of the **departures** from normal rather than the spatial covariance of the normals themselves. The latter is near-singular over a low-relief 30 km area, which inflated novelty by an order of magnitude and ranked unusual **locations** rather than unusual **climate**.",
 why:"Both are cases of a number that looked fine until the geometry it assumed was checked against the study area it was computed over.",
 changed:"Median novelty fell from 14.3 to 1.87. The verdict function's two-gate structure is what later made the 25 km transect result reportable and the 12 km one not.",
 evidence:["novelty median 14.3 → 1.87 (p95 3.21)"],
 artifacts:["src/pipeline/experiment.py","src/pipeline/assemble.py"],
 concepts:["mahalanobis-novelty","verdict-rule","contrast-gate","skill-gate"]},

/* ---------- Phase 3b ---------- */
{era:"p3b", date:"2026-07-22", kind:"decision", key:true,
 title:"Change the extent, not the question",
 what:"Two options were on the table: weaken the hypothesis until Surrey could test it, or move the test to a place where the hypothesis is meaningful. The second was chosen.\n\nEverything else is held fixed — same hypothesis, same code, same upscaling, same blocked and grouped folds, same climate-only predictors. **Only the study extent changes.** Surrey remains the application site; the transect is where the method question gets answered, and the answer is then carried back to the corridors.",
 why:"Scale-free downscaling exists because of mountains. Testing it across 117 m of relief and then reporting the null would have been a statement about Surrey dressed up as a statement about downscaling.",
 changed:"Bought a second 33-hour acquisition and a second raster build, and turned a dead end into the paper's central result. It also produced the two-extent structure the manuscript is now built around.",
 concepts:["elevation-transect","maup","model-a-vs-b"]},

{era:"p3b", date:"2026-07-22", kind:"decision",
 title:"Analysis units: forest stands, after parks were tested and rejected",
 what:"The valley has no equivalent of a municipally-defined corridor, so two candidate unit sources were probed against the provincial catalogue.\n\n**Protected areas were rejected.** Only 11–19 polygons over the extent, ranging from 3 ha to 61,594 ha. Too few to spatially block the coarse model, and a single 61,594 ha park internally spans most of the elevation range the experiment exists to resolve — one climate point per park would average away the signal being tested. They are retained in the GeoPackage as a validation subset.\n\n**Vegetation Resources Inventory forest stands were selected**: 12,168 treed stands over the transect, continuous end to end, median 7.4 ha. This is the ecological analogue of a corridor, and the layer is provincial, so the same pipeline runs anywhere in British Columbia.",
 why:"Both candidates were checked for actual fetchability and for whether their geometry could support the folds — before the acquisition budget was committed, not after.",
 changed:"Introduced a real limitation the paper states plainly: the two extents do not measure the same kind of object. Effective analysis width is 39.7 m in Surrey against 94.8 m on the transect.",
 evidence:["12,168 treed stands available; 11–19 parks","stands under 1 ha dropped (204 of them) — below ~100 pixels, zonal statistics get noisy"],
 artifacts:["src/pipeline/acquire_vri.py"],
 concepts:["vri","modelling-vs-reporting-unit","coverage-frac","blocked-cv"]},

{era:"p3b", date:"2026-07-22", kind:"decision",
 title:"Sampling: 300 stands, and two corrections to the obvious design",
 what:"The call budget caps the sample at ~300 stands, so how they are drawn matters more than usual. Two departures from the obvious approach:\n\n**Latitude capped at 49.20 N.** Without the cap the bounding box reaches into the North Shore mountains — more elevation range, but no longer a valley transect. This was caught during probing, when an uncapped sample returned alpine ecosystem zones in what was supposed to be the lowland western third.\n\n**Allocation proportional to the square root of stratum size, not to size.** Strict proportional allocation would have spent ~77% of the budget on the lowland zone and barely sampled the montane band — precisely the gradient Surrey lacked and the transect exists to supply.",
 why:"Ecosystem zone is a defensible elevation proxy available **before** any elevation call is made, and easting quintiles keep the transect covered because the folds hold out geographic blocks.",
 changed:"Delivered the range the whole phase depends on: 4–1,920 m across 100 km, against Surrey's −1 to 116 m across 30 km. One honest deviation is recorded — treed stands effectively begin inland of Delta, so it is a Langley-to-Cascades gradient rather than the sea-level-to-mountains one first described.",
 evidence:["300 stands from 12,168 · median 7.4 ha · 100 km span","elevation 4–1,920 m, median 960 m","zones: CWH 190 · MH 75 · CMA 34 · CDF 1"],
 artifacts:["src/pipeline/acquire_vri.py"],
 concepts:["bec-zone","elevation-transect","blocked-cv"]},

{era:"p3b", date:"2026-07-22", kind:"build",
 title:"Two infrastructure failures, fixed because a 33-hour job cannot be babysat",
 what:"**Elevation acquisition had a single point of failure.** The elevation lookup timed out on all five retries and killed the first launch at minute zero. Elevation is the input the scale-free downscaling keys on, so that step cannot be allowed to end an unattended run. It now retries with backoff and then falls back to the identical elevation tiles on a public bucket, addressed by tile name over plain HTTPS — no catalogue search, no token signing. The source is recorded per run in its own column.\n\n**The progress script was hardcoded to Surrey**, and read completion from a job counter that checkpoints every 10 jobs. 765 is not a multiple of 10, so a cleanly finished run displayed “756/765” and was briefly misread as a dead process.",
 why:"Both failures are in the scaffolding, not the science, and both would have cost a day of wall clock each time they fired.",
 changed:"The fallback is what produced the 4–1,920 m elevation figures. The progress script now reads its totals from the log's own planned-jobs line and treats an explicit completion marker as the end condition, so one script serves both runs.",
 artifacts:["src/pipeline/acquire_climate.py","scripts/climate_progress.sh"]},

{era:"p3b", date:"2026-07-23", kind:"check",
 title:"Transect rasters build — and the offset correction is confirmed on a second extent",
 what:"Optical and thermal composites for all four summers built in about 30 minutes, at 99.7–100% valid pixels, over an area seven times Surrey's.\n\nThe measured reflectance offset over the transect comes out at **0 DN** — independent confirmation that the Phase 2 correction generalises rather than having been tuned to Surrey's scenes.\n\nTwo things in the zonal check were informative on their own. Stand coverage fractions have a median of 1.00 with nothing below 0.5, so Surrey's thin-corridor pixel problem simply disappears at this unit size. And surface temperature already spans 16.1–38.8 °C **between stands**, against Surrey's ~3 °C standard deviation: the elevation gradient is showing up in the response variable, not only in the predictors.",
 why:"A correction that has only ever been checked on the data that motivated it is not yet a correction.",
 changed:"Removed mixed pixels as a candidate explanation for anything on the transect, and gave the first evidence that this extent has spatial signal to predict.",
 evidence:["measured BOA offset: 0 DN","coverage_frac median 1.00, none below 0.5","stand LST 16.1–38.8 °C"],
 artifacts:["src/pipeline/acquire_raster.py"],
 concepts:["boa-offset","coverage-frac","lst","zonal-stats"]},

{era:"p3b", date:"2026-07-24", kind:"result", key:true,
 title:"The blur gate passes — the extent is finally big enough to test",
 what:"This is the half Surrey failed structurally. Over the transect, coarsening the grid destroys a large and growing share of the predictors' spatial variance, so the two models become genuinely different rather than two names for the same thing.\n\nAt 25 km — a faithful stand-in for the grid resolution of the regional climate models the hypothesis set out to beat — the median predictor loses about half its spatial variance and the leading ones lose two-thirds, while 10 cells still leave enough geographic spread to block the coarse model.",
 why:"The gate was run **first**, before any verdict was read, precisely so a conclusion could not be drawn from an extent that was too small again.",
 changed:"Made the A-versus-B contrast real, which is what licenses reading the comparison at all.",
 evidence:["4 km → 13.4% removed (≈ Surrey's 12% ceiling)","8 km → 29.0% · 12 km → 34.4%","25 km → 48.4% median; leading predictors 58–68%"],
 concepts:["contrast-gate","upscaling","maup"]},

{era:"p3b", date:"2026-07-24", kind:"result", key:true,
 title:"Verdict FALSIFIED at 25 km — the coarse model is significantly better",
 what:"With something to measure, the answer is that scale-free resolution does not help. The coarse model wins, and the paired interval excludes zero. The fine-scale spatial detail is not merely unhelpful — it is anti-informative, noise the coarse average smooths away.\n\nThe label itself is weaker than the evidence. `FALSIFIED` is issued only because the coarse model clears a hard skill threshold of exactly 0.000 by three thousandths; at 12 km the same comparison lands three thousandths the other side and reads `INCONCLUSIVE`, while the paired difference barely moves. The intervals are what the conclusion rests on. The word is a threshold artifact.",
 why:"Reporting the label alone would have handed a reviewer a true objection. Reporting the interval alongside it makes the objection answerable in one sentence.",
 changed:"Became the paper's central result — and, six days later, the reason the verdict words were stripped out of the evidence tables entirely.",
 evidence:["Model A (~1 km): RMSE 0.02565, R² −0.138","Model B (25 km): RMSE 0.02472, R² +0.003","paired ΔRMSE +0.00093, CI [+0.00021, +0.00170] — excludes zero","paired ΔR² −0.14127, CI [−0.25660, −0.04149] — excludes zero"],
 artifacts:["docs/PHASE3_FINDINGS.md","notebooks/phase3b_modeling.ipynb"],
 concepts:["verdict-rule","paired-difference","bootstrap-ci","ci-excludes-zero","skill-gate"]},

{era:"p3b", date:"2026-07-24", kind:"result",
 title:"Why: both vary in space, along different patterns",
 what:"The failure here is not Surrey's. On the transect the response variable varies **122× more between stands than between years** — the exact inverse of Surrey, where it was mostly temporal. There is a strong spatial signal to predict.\n\nThe climate gradient simply is not what organises it. Stand-mean stress correlates with every gradient variable at |ρ| ≤ 0.15. Both predictor and response vary across the transect; they vary along orthogonal spatial patterns.",
 why:"Two extents failed for two different reasons, and saying so is what makes the pair informative rather than merely repetitive.",
 changed:"Turned the negative result from “the model did not work” into a claim about mechanism — which is what the next entry set out to test directly.",
 evidence:["CDEI: 0.0241 between stands vs 0.0022 between years — 122× spatial","Spearman ρ: CMD −0.093 · Tmax −0.139 · Eref −0.138 · elevation +0.145 (n = 300)"],
 concepts:["orthogonal-axes","spearman","cdei"]},

{era:"p3b", date:"2026-07-24", kind:"result", key:true,
 title:"What actually drives it: local terrain and stand composition",
 what:"If not climate, then what? The same blocked folds were used to score predictor families against the response — with the satellite bands **excluded**, because the response is built from them and including them would be circular.\n\nTerrain plus stand structure is the only family that crosses into positive skill, and adding climate on top makes it **worse**. The leading drivers by permutation importance on a held-out block are all local: leading species, stand area, aspect, broadleaf class. No climate variable appears.\n\nTwo honesty flags are attached and stay attached. The skill is weak in absolute terms — a directional result, not a predictive model. And part of it may be a vegetation-type artifact: broadleaf and conifer stands occupy different regions of the feature space the index is constructed in.",
 why:"“Climate does not explain it” is only half an answer. The other half is what does, and that is the half the City can act on.",
 changed:"Gave the applied recommendation its content: adaptation spending should target site-level interventions, not finer climate products. It also foreshadowed the canopy confound that dominates the audit era.",
 evidence:["climate −0.138 · terrain −0.085 · structure +0.004","terrain + structure +0.029 (positive in 80% of folds)","terrain + structure + climate +0.020 — adding climate makes it worse"],
 artifacts:["src/pipeline/explain.py"],
 concepts:["circularity-exclusion","permutation-importance","circular-stats-aspect","blocked-cv"]},

/* ---------- Validation ---------- */
{era:"val", date:"2026-07-24", kind:"check", key:true,
 title:"An independent radar sensor is pointed at the ranking — and does not corroborate it",
 what:"The stress index was checked against a completely different physics: Sentinel-1 radar, which responds to vegetation and soil water rather than to reflected light. The verdict came back split, and both halves are reported.\n\n**Over time it holds.** Drier, hotter summers read as more stressed, in the physically correct direction, against independent climate data.\n\n**Corridor against corridor it does not.** The radar's vegetation-condition indices are flat null against the ranking in all four summers. The only radar signal that does correlate with the ranking is tracking **canopy density**, not water. So the “most-stressed” corridors are substantially just the densest ones.",
 why:"Building an index is easy; establishing that it is true is the hard part, and an independent sensor is the only check that is not a restatement of the same data.",
 changed:"This is the entry that reshaped what the deliverable is allowed to claim. It also independently reproduced a concern the Phase 3 diagnostics had already raised, which is stronger than either finding alone.",
 evidence:["radar RVI vs ranking: −0.07 / +0.08 / +0.01 / −0.03 across 2022–2025","radar VH vs greenness: ≈ +0.55 — canopy density, not water","CDEI vs moisture deficit −0.68, vs precipitation +0.72 (n = 4 summer means)","within-polygon, n = 612: −0.31 and +0.32 — much weaker"],
 artifacts:["src/pipeline/validate_sar.py","docs/deliverable/sar_validation_summary.csv"],
 concepts:["sar-backscatter","rvi-crossratio","canopy-confound","spearman"]},

{era:"val", date:"2026-07-24", kind:"decision",
 title:"Venue decided: not a journal",
 what:"The realistic options were weighed and one was ruled out on principle. A conventional journal is unrealistic here; the usual substitute — a pay-to-publish outlet aimed at teenagers — is worse than nothing, because it reads as a red flag rather than as a credential.\n\nWhat was chosen instead: the science-fair route, direct community impact with the City, and a legitimate preprint with the code public.",
 why:"The honest venue is the one whose standards the work can actually meet. Buying the appearance of peer review is the one move that cannot be defended at a judging table.",
 changed:"Set the deliverable set for everything after: one shared narrative spine feeding a preprint, a display board, a City memo and the repository README.",
 artifacts:["docs/CORE_NARRATIVE.md","docs/project_direction_notebooklm_note.md"]},

/* ---------- Writing ---------- */
{era:"write", date:"2026-07-24", kind:"write", key:true,
 title:"The preprint is drafted — and the drafting rule is renegotiated",
 what:"Full structure written: abstract, six sections, limitations, references, appendices, with figures for the index construction, the stress map, the ranking and the corridor-level dry edge.\n\nThe original rule was that the technical sections would be drafted and the introduction and discussion left as bullet scaffolds for the student to fill. The student asked for complete prose instead, on the grounds that a scaffold does not teach the reasoning and you cannot rewrite in your own voice something you do not yet understand.\n\nSo the draft is prose throughout, written to expose its own logic, and the rewrite step matters **more** as a result, not less. The introduction was subsequently rewritten by the student and ported back.",
 why:"The point of the workflow is that the submitted text is not the draft. Making the draft more complete raises the bar for the rewrite rather than lowering it.",
 changed:"Fixed the three roles for everything after: the model drafts, the student rewrites and owns, and Gemini is critic only — never author.",
 artifacts:["docs/preprint/latex/main.tex"]},

{era:"write", date:"2026-07-24", kind:"check",
 title:"Every citation resolved against the publisher record",
 what:"Two corrections and one genuine find came out of the pass.\n\nThe microclimate paper turned out to be a **much closer analogue** than assumed: its reported result is that improving climate **proximity** improves ecological predictions far more than increasing spatial **resolution** twentyfold does. That is this project's entire test, published independently.\n\nThe space-for-time citation that had been recorded as probably-misremembered **exists and was right**. The trap: a same-year commentary on that study, by a different author, sits one search result away and must not be cited as the primary result.",
 why:"A citation that cannot be resolved to a digital object identifier has not been checked, however confident the author is about the title.",
 changed:"Established the standard the later audit applied at scale — and the distinction the project keeps re-learning: verified metadata proves a paper exists and is described correctly. It does not prove the paper supports the sentence citing it.",
 artifacts:["docs/preprint/CITATION_TARGETS.md"],
 concepts:["verified-not-read"]},

{era:"write", date:"2026-07-24", kind:"correction",
 title:"“A flat 30 km delta” is retracted — twice wrong",
 what:"The project had repeatedly described Surrey as a flat delta. The delta proper is Richmond and Delta; Surrey sits in the Fraser Lowland, south of the river. And it is not flat — rolling till uplands separated by two river lowlands, with a citywide maximum around 134 m.\n\nThe phrasing had propagated into the findings document, the shared narrative and the preprint. All occurrences now read “low-relief”, and the delta claim is gone.",
 why:"Every reader who knows the region would have stopped at that sentence, and the sentence was load-bearing — it is the reason the first extent could not test the hypothesis.",
 changed:"The scientific point survived and is now **better** supported, because it rests on a number instead of an adjective: about 117 m of relief across 30 km is genuinely too little to generate a spatial climate gradient. A second description was corrected in the same pass — the corridors are 0.29–157.8 ha, not the ~0.1 ha the notes claimed, and it is their long narrow shape rather than their area that drives the pixel-coverage problem.",
 concepts:["gin-corridors","mixed-pixels"]},

{era:"write", date:"2026-07-24", kind:"decision",
 title:"The fair route is pinned down",
 what:"The regional fair is **South Fraser** — Surrey and Delta — not the Greater Vancouver one, and it runs 7–8 April 2027 with applications around mid-March. The national fair is in Hamilton, 29 May – 5 June 2027, Intermediate category.\n\nThere is **no provincial tier in British Columbia**: regional winners advance directly to the national fair.",
 why:"The runway determines the ordering. Roughly eight months makes drafting the preprint before the board a safe sequence rather than a gamble.",
 changed:"One unknown remains, and it is the binding one: the school may run an internal selection because the regional fair caps entries per school. That internal deadline is the real first one and is not published anywhere.",
 evidence:["SFRSF 7–8 April 2027 · application ~mid-March · $60","CWSF Hamilton, 29 May – 5 June 2027, Intermediate"]},

{era:"write", date:"2026-07-28", kind:"decision", key:true,
 title:"A publication hold, pending the City",
 what:"The City contact was emailed on 28 July. Until she replies, **nothing goes public** — not the preprint, and not the archival DOI, because a DOI is permanent: no preview and no take-backs.\n\nAn escalation was set at the same time so the hold cannot quietly become indefinite: nudge on 11 August, proceed regardless on 1 September.",

 what:"First commit of the pipeline, immediately followed by a commit fixing what a full repository-and-preprint audit had turned up, then a figure pass that unified the palette, added map furniture and split each figure into titled and untitled variants.",

{era:"audit", date:"2026-07-29", kind:"build",
 title:"Extending the record without moving the published one",
 what:"The satellite record can be extended backwards to 2017, but two quantities in the index — the fitted dry edge and the temperature baseline — are properties of **the panel they are computed on**. Refitting them on a longer panel moves every already-published value.\n\nSo the assembler gained a mode that reuses an existing panel's fitted quantities instead of refitting them. In that mode the canonical summers reproduce **bit-exactly**: 0.000e+00 difference on all six derived columns.",
 why:"A naive extension would have silently shifted every published number by a median 8.1% of a standard deviation, and moved the dry-edge coefficients printed in the paper and in Figure 1.",
 changed:"Made the nine-summer test possible at all. It also, unintentionally, set up the diagnosis the next entry records — freezing the dry edge is exactly the behaviour that turned out to be the problem.",
 evidence:["frozen mode reproduces canonical years at 0.000e+00 on all six derived columns"],
 artifacts:["src/pipeline/assemble.py"],
 concepts:["frozen-reference","dry-edge","rlst","cdei-drift"]},

{era:"audit", date:"2026-07-29", kind:"correction", key:true,

 what:"The City's map layer carries **both** an ArcGIS row number and the City's own corridor identifier. They are different, they run to different maxima, and everything reported before this date used the row number. “Corridor 73” named a polygon, not the City's corridor 73.\n\nIt was settled by cross-tabulation against the City's published appendix rather than by argument: joined on the City's identifier, four shared attributes agree 95.8–99.3%; joined on the row number, 33.8% — chance.\n\nUnderneath sits a real structure, not just a mislabel. Seven corridors are digitised as several polygons, so 153 polygons carry 144 corridor identifiers, and a polygon-level top-20 had been listing one corridor twice, at ranks 1 and 5.",
 why:"Two identifiers in the same table, both integers, both plausibly named, and only one of them the City's. The check that resolves it is a five-minute cross-tabulation that nobody had run.",
 changed:"49 asserted-exact edits to the manuscript, in three categories: ~5 places where the **number** was wrong, ~40 where 153 was right but the **noun** was wrong, and one table that was a polygon top-10 labelled “Corridor”. It also forced the project to name **two units on purpose** — polygon for modelling, corridor for reporting — and to check the obvious leakage objection: 0 split corridors straddled a cross-validation block in all five repeats, so the published results stand.",
 evidence:["attribute agreement: 95.8–99.3% on the City id vs 33.8% on the row number","153 polygons · 144 corridors · 7 corridors split","0 split corridors straddled a CV block in 5 / 5 repeats"],
 artifacts:["scripts/parse_appendix_j.py","docs/deliverable/README.md"],

{era:"audit", date:"2026-07-30", kind:"correction", key:true,
 title:"The nine-summer extension fails — and the failure is diagnosed",
 what:"The weakest load-bearing claim in the paper was that the index is a validated temporal drought monitor, resting on correlations over **four points**. Extending to nine summers was supposed to settle it. It did not reproduce: network-wide the relationship moves from −0.68 to **+0.070**, and within the five earlier summers it is **absent** rather than displaced.\n\nThe cause is the **frozen dry edge**, not the sensor. Between the two halves of the record, greenness differs by +0.014 and the water ratio by −0.005 — **neither significant** — yet the dry-edge geometry converts that into a 0.51 standard-deviation shift in the distance term, at p = 1e-17. The index drifts with the panel's own greenness, and over a long record that drift is comparable to the entire climate signal.\n\nFour alternative explanations were ruled out by test rather than by argument, including one that had already been stated as fact: rasters rebuilt with the current code are bit-identical to the published ones.",
 why:"The extension was run to strengthen a claim, and it weakened it. Reporting that outcome is the only version of the exercise worth doing.",
 changed:"Recorded as issue V1, status **OPEN** — the register's most load-bearing weakness. The conclusion and abstract were corrected the same day: neither now implies the temporal use is deliverable. The extended panel is a **diagnostic, not a result**, and the reported figures remain the four-summer ones. One thing stays unexplained: two of the early summers read as unstressed in dry years, and there is no account of why.",
 evidence:["2022–2025: −0.677 network-wide, −0.311 within-polygon (n = 612)","2017–2021: −0.084 and −0.061 (n = 765)","all nine summers: +0.070 and +0.049 (n = 1,377)","greenness +0.014 (p = 0.40) and SWCI −0.005 (p = 0.12) → 0.51 sd shift at p = 1e-17","rebuild check: r = 1.00000, bit-identical"],
 artifacts:["scripts/drift_diagnostic.py","docs/preprint/KNOWN_ISSUES.md"],
 concepts:["cdei-drift","frozen-reference","dry-edge","perpendicular-distance"]},

{era:"audit", date:"2026-07-30", kind:"check", key:true,
 title:"The verdict word is stress-tested, and then removed from the tables",
 what:"Two robustness runs were done on the central result.\n\n**Seeds.** Re-running the whole experiment across independent seeds — re-seeding both the spatial blocking and the forest — shows the verdict label is a deterministic function of cell size rather than a lucky partition, and the paired difference excludes zero in **32 of 32 runs**.\n\n**Hyperparameters.** Re-running across eight forest configurations, the coarse model wins on the point estimate in all eight, but the paired interval excludes zero in only **six**. The fine model's deficit climbs monotonically as the forest is constrained, which says the deficit is substantially overfitting to fine climate detail — mechanistically the same claim the paper makes, but it means the **significance** of the gap depends on how hard the learner is allowed to chase that detail.",
 why:"The margin on the skill gate is three thousandths. A result that thin invites exactly this objection, so it was raised and answered internally before anyone else could raise it.",
 changed:"Issue V2 moved from OPEN to **BOUNDED**: the categorical labels were removed from three evidence tables in favour of the question that actually matters — does the interval exclude zero. The weaker, defensible statement now stands in the paper: the coarse model is never worse, and significantly better under most reasonable settings, with the qualification that heavy regularisation closes the gap.",
 evidence:["12 km: 0/12 seeds above zero · 25 km: 20/20 · paired CI excludes zero 32/32","8 of 8 hyperparameter configs favour the coarse model; 6 of 8 exclude zero","R²_A climbs −0.249 → −0.060 as leaf size grows; R²_B does not move"],
 artifacts:["scripts/seed_sensitivity.py"],
 concepts:["seed-sensitivity","verdict-rule","ci-excludes-zero","bootstrap-ci","random-forest"]},

{era:"audit", date:"2026-07-30", kind:"check", key:true,
 title:"An outside review, deliberately kept outside",
 what:"A second notebook was set up holding only the manuscript and a referee brief — and **not** the project's progress notes, so the critique would be an outside check rather than a self-review. The known-weakness register was deliberately withheld from it, so the report could be compared against the register afterwards: overlap corroborates, novel findings justify the exercise, and misses calibrate how much to trust the next one.\n\nThree rounds produced twelve real fixes, including an overstated key point that had never been audited because it sits above the abstract. Two findings were false positives — one of them citing the very sentence it claimed was missing.\n\nThe procedural lesson is recorded with the findings: four passes over the same unchanged manuscript returned minor revision → major revision → accept → **reject**, and the reject was retracted the moment the reviewer was pointed at the section it had failed to retrieve. Do not score a revision by the verdict word; ask targeted questions naming a section, and judge by the quoted specifics.",
 why:"A reviewer that can see your own account of your weaknesses will hand them back to you and call it a review.",
 changed:"What it **missed** is recorded too, and it is the more useful half: it missed the drift issue entirely — reading the limitation, quoting its p-values, and grading it handled correctly. One item was left open as a judgment call rather than a defect: it argued three times, escalating each round, that the exploratory ranking table should be removed outright. That consistency is itself evidence about how the output reads to someone who did not build it.",
 artifacts:["docs/preprint/REFEREE_BRIEF.md","docs/preprint/KNOWN_ISSUES.md"],
 concepts:["canopy-confound","verified-not-read"]},

{era:"audit", date:"2026-07-30", kind:"check", key:true,
 title:"The sharpest objection to the central finding is tested — and refuted",
 what:"The outside review produced one objection that, if it held, would take the paper's main result with it: that the A-versus-B finding is really about **canopy density** rather than water stress, since the same confound was already admitted for the Surrey ranking.\n\nIt was tested rather than argued. The confound on the transect is essentially the same size as Surrey's. But residualising the index on 24 independent stand attributes — removing 14.9% of its variance — does not weaken the result. It **strengthens** it, at both cell sizes, with both intervals still excluding zero.\n\nOne variant does invert the sign: residualising on stand greenness as well, which removes 73.2% of the variance. That is not a confounder being removed, it is a constitutive input to the index being removed — and both models are then worse than predicting the mean, so the skill precondition fails and the comparison is not readable.",
 why:"The objection was correct in form: the same index carried a disclosed confound in one place and a central claim in another. That asymmetry had to be closed by measurement.",
 changed:"Issue V3 splits in two. The derived objection is **CLOSED** and now has its own results subsection and table. The underlying gap stays **OPEN**: no ground observation validates the index at either extent, and the transect response variable has no independent check at all. A one-season field check is the stated fix.",
 evidence:["confound: ρ −0.314 vs stand greenness (n = 300), against Surrey's −0.347","land-cover class explains only 2.7% of between-stand variance","residualised ΔRMSE +0.00113 at 25 km, +0.00146 at 12 km — both exclude zero"],
 artifacts:["scripts/residualized_retest.py"],
 concepts:["residualisation","canopy-confound","ci-excludes-zero","circularity-exclusion"]},

{era:"audit", date:"2026-07-30", kind:"write",
 title:"Citation count audited, and the title rescoped",
 what:"The manuscript carried **11 scholarly citations across 31 pages**, against 72 in the 16-page paper that is its closest published analogue — and the intended preprint server declines submissions that lack citations to established literature. Thirteen were added, taking it to 24, all resolved by identifier.\n\nTwo first hits were the **wrong record**, which is why the rule is to resolve by identifier rather than by title match. And one citation is deliberately a **contrast, not a source**: the index's water ratio uses two shortwave-infrared bands, where the classic index it is compared against uses near-infrared against shortwave-infrared. Inverting that would misattribute the construction.\n\nThe title was rewritten in the same pass. The previous one asserted a general finding from one valley; the current one names both extents, bounds the scope, and flags the monitor as exploratory before anyone opens the paper.",
 why:"A thin reference list reads as a project that did not check whether its question had already been answered — which, in this case, it partly had.",
