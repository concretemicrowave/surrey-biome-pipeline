{
  id:"reflectance", group:"rs", prereqs:[], sourceDoc:"src/pipeline/acquire_raster.py",
  title:"Reflectance and bands",
  plain:
"A satellite does not photograph a colour. It measures how much sunlight bounces back off the ground in several narrow slices of the spectrum, and records each slice separately. One slice might be red light, another the invisible near-infrared just past what your eye can see, another the shortwave infrared further out still.\n\n"+
"Each slice is called a **band**, and the fraction of light that bounces back in that band is the **reflectance** — a number between 0 (all the light was absorbed) and 1 (all of it bounced).\n\n"+
"Different surfaces have different signatures. Healthy leaves absorb red light hard, because chlorophyll is eating it, and reflect near-infrared strongly, because the internal leaf structure scatters it. That gap between two bands is the whole basis of measuring vegetation from space.",
  depth:
"Sentinel-2 carries 13 bands. This project uses four: B04 (red, 665 nm), B08 (near-infrared, 842 nm), B11 (shortwave infrared, 1610 nm) and B12 (SWIR, 2190 nm). Red and NIR run at 10 m ground resolution; the two SWIR bands at 20 m.\n\n"+
"What is stored in the file is not reflectance directly but a **digital number** (DN) — a scaled integer. Bottom-of-atmosphere reflectance is recovered as `DN / 10000`, after any offset is removed. That last clause is where this project once went badly wrong; see [[boa-offset]].\n\n"+
"“Bottom of atmosphere” (BOA, or Level-2A) means the atmospheric scattering has already been modelled out, so you are looking at the surface rather than the air above it. Top-of-atmosphere (L1C) has not, and is not usable for a vegetation index without further correction.",
  whyThisChoice:
"Only free, open, repeatable imagery is used — Sentinel-2 and Landsat, both public. A commercial high-resolution product would have given crisper corridor boundaries, but the deliverable is meant to be something the City of Surrey can re-run itself every summer at no cost. A method that depends on a licence a municipality has to renew is not a monitoring tool; it is a subscription.",
  rejectedAlternative:
"Commercial sub-metre imagery (Planet, Maxar). Better geometry, wrong economics, and not archived back to 2017."
},
{
  id:"band-ratio", group:"rs", prereqs:["reflectance"], sourceDoc:"src/pipeline/acquire_raster.py",
  title:"Why indices are ratios",
  analogy:
"Compare two people by their ratio of heights. Photograph them from further away and both shrink by the same factor — the ratio does not budge. Now stand both on the same 30 cm box: the ratio moves, because a fixed amount was added rather than multiplied. The BOA offset is the box.",
  plain:
"Suppose you measure a forest at noon and again in late afternoon. Everything is dimmer in the afternoon — every band drops, because less light is arriving. If you tracked raw brightness you would conclude the forest changed. It did not; the lighting did.\n\n"+
"The fix is to compare bands **against each other** instead of against an absolute scale. If red halves and near-infrared halves, their ratio does not move. A ratio cancels anything that scales all the bands together: sun angle, thin haze, topographic shading.\n\n"+
"That is why almost every vegetation index has the same shape — the difference of two bands divided by their sum.",
  depth:
"The normalised difference form is `(A − B) / (A + B)`. Its two useful properties: it is bounded in [−1, +1] no matter what A and B are, and it is invariant to any **multiplicative** factor applied to both bands, since `(kA − kB)/(kA + kB) = (A − B)/(A + B)`.\n\n"+
"The crucial word is multiplicative. An **additive** constant does not cancel, and the asymmetry is worth seeing in numbers. Take dense conifer: red 0.025, NIR 0.30, NDVI 0.846.\n\n"+
"- **Halve the light** (multiplicative): red 0.0125, NIR 0.15 → 0.1375 / 0.1625 = **0.846**. Unchanged. This is the protection a ratio buys you.\n"+
"- **Add 0.05 to both**: numerator `N − R` does not move; denominator grows → **0.647**. Squashed toward zero.\n"+
"- **Subtract 0.05 from both**: numerator still does not move; denominator *shrinks* → **1.22**, which is outside NDVI's legal range; clipping the now-negative red to zero gives exactly **1.000**.\n\n"+
"So the numerator is immune to an additive shift and the denominator is not. Adding a constant dilutes the index; **subtracting one inflates it**, systematically and in the direction that looks like a healthier forest.\n\n"+
"That distinction is not academic. It is precisely the mechanism behind this project's retracted saturation claim — see [[boa-offset]].",
  formula:"NDVI = (NIR − Red) / (NIR + Red)          bounded in [−1, +1]\nSWCI = (SWIR1 − SWIR2) / (SWIR1 + SWIR2)",
  trap:
"“Ratios cancel atmospheric effects” is the recipe answer. The mechanism is that they cancel *multiplicative* effects only. A judge who asks why the BOA offset mattered is testing exactly this distinction — see [[boa-offset]]."
},
{
  id:"ndvi", group:"rs", prereqs:["band-ratio"], sourceDoc:"src/pipeline/acquire_raster.py",
  title:"NDVI — greenness",
  analogy:
"A thermometer for how much green is there, not for how thirsty it is. A plastic plant would score well.",
  plain:
"NDVI asks a simple question: how much more near-infrared is coming back than red? Living leaves absorb red (chlorophyll uses it) and scatter near-infrared (the spongy tissue inside a leaf bounces it around). So a big gap between the two means a lot of healthy leaf area, and a small gap means bare soil, pavement, or dead vegetation.\n\n"+
"Values run from about 0 over bare ground and water to about 0.9 over dense closed forest. It is the oldest and most widely used vegetation index in remote sensing.\n\n"+
"What it measures is **how much green there is** — not how thirsty that green is. That distinction matters more in this project than almost anything else.",
  depth:
"`NDVI = (B08 − B04) / (B08 + B04)`. Over the corrected Surrey panel it spans **0.244 to 0.908** with a median of **0.768**.\n\n"+
"Its central weakness is **saturation**: once a canopy closes, adding more leaf area barely changes the reflectance in either band, so NDVI flattens out near its ceiling and stops discriminating. Two forests with very different leaf-area index can return nearly the same NDVI.\n\n"+
"NDVI plays three separate roles here, and mixing them up is a genuine risk. It is (1) an input to the dry edge and therefore to CDEI, (2) the variable used to *diagnose* the canopy-density confound, and (3) a variable deliberately **not** used as a predictor, because predicting CDEI from NDVI would be circular.",
  figure:"../../figures/cdei_feature_space.png",
  figureAlt:"NDVI against SWCI for 612 corridor-summers with the fitted dry edge",
  figureCaption:"612 polygon-summers in NDVI–SWCI space. NDVI is the horizontal axis. See [[dry-edge]].",
  trap:
"Phase 2 reported that NDVI saturated above 0.9 in 87% of corridors and called it a finding. It was a bug — see [[ndvi-saturation-artifact]]. **Never cite the saturation result.** Real saturation exists as a general property of NDVI; this project did not observe it."
},
{
  id:"swci", group:"rs", prereqs:["band-ratio"], sourceDoc:"src/pipeline/acquire_raster.py",
  title:"SWCI — canopy water content",
  plain:
"Liquid water inside a leaf absorbs shortwave infrared light, and it absorbs the longer shortwave band more strongly than the shorter one. So comparing those two bands gives a measure of how much water is actually in the canopy — not how green it is, how *wet* it is.\n\n"+
"This is the more interesting half of the index, because water content responds to drought stress **before** greenness does. A tree closes its stomata and loses leaf moisture days or weeks before it visibly browns. NDVI would still say the forest is fine; SWCI has already moved.",
  depth:
"`SWCI = (B11 − B12) / (B11 + B12)`, both Sentinel-2 shortwave-infrared bands at 20 m. Over the Surrey panel the median is about 0.377.\n\n"+
"**This is a SWIR–SWIR ratio, and that is a point of citation discipline.** Gao (1996) defines NDWI as a NIR–SWIR ratio — a different pair of bands measuring a related but distinct quantity. In the preprint Gao is cited as a **contrast**, not as the source of SWCI. Getting that backwards would be a misattribution inside the project's own methods section, and it is one of the specific things the coach brief says to test.\n\n"+
"The 20 m native resolution of B11/B12 also sets the effective resolution of the whole optical analysis: there is no point resampling to 10 m when half the inputs cannot support it.",
  whyThisChoice:
"A SWIR–SWIR ratio was chosen over NIR–SWIR because both bands sit in the same broad atmospheric window and respond to the same liquid-water absorption feature, so the difference between them is more nearly a pure moisture signal and less contaminated by canopy structure.",
  trap:
"If asked “is that Gao's NDWI?” the answer is no, and you must be able to say why: **SWCI is B11/B12, SWIR–SWIR; Gao's NDWI is NIR–SWIR.** Do not invert it."
},
{
  id:"lst", group:"rs", prereqs:["reflectance"], sourceDoc:"src/pipeline/acquire_raster.py",
  title:"LST — land surface temperature",
  plain:
"A separate satellite instrument measures the infrared heat radiating off the ground and converts it to a surface temperature. This is not air temperature — it is the temperature of the actual surface the satellite can see, which on a summer afternoon might be the top of the canopy, or a parking lot, or bare soil.\n\n"+
"It matters for water stress because of transpiration. A tree with enough water evaporates it through its leaves, and evaporation cools the surface, exactly the way sweating cools you. A tree that has run short of water shuts its stomata, stops transpiring, and heats up. So a hot canopy on a summer day is a plausible sign of a thirsty canopy.",
  depth:
"From Landsat 8/9 Collection 2 Level-2, band `ST_B10`, at 30 m — though the sensor's native thermal resolution is about 100 m and the 30 m product is resampled, which matters for how much you should trust fine spatial detail in it.\n\n"+
"The scaling is applied by hand rather than trusted to metadata: `DN × 0.00341802 + 149.0 − 273.15` to reach degrees Celsius, because odc-stac does not consistently honour STAC scale/offset fields. Landsat's 16-day revisit is much sparser than Sentinel-2's ~5 days, which is why the cloud threshold is loosened to 40% at scene level and the per-pixel QA mask does the real work.\n\n"+
"Over the transect, stand LST spans **16.1 to 38.8 °C** between stands, against roughly a 3 °C standard deviation across Surrey — the elevation gradient shows up in the target, not just in the predictors.",
  whyThisChoice:
"LST enters CDEI only as a ratio to each polygon's own multi-summer mean ([[rlst]]), never as an absolute temperature — because absolute surface temperature between two polygons is dominated by land cover and viewing geometry, not by water status."
},
{
  id:"boa-offset", group:"rs", prereqs:["band-ratio","ndvi"], sourceDoc:"src/pipeline/acquire_raster.py",
  title:"The BOA offset, and measuring rather than trusting it",
  analogy:
"A shop prices everything £10 above cost so no item ever shows a negative margin. To recover the true cost you subtract £10 — once. Subtract it twice and the cheap items go negative, and if the till refuses to display negatives it prints £0.00. Every cheap item now reads identically, and nothing about the till was broken.",
  plain:
"Start with why the offset exists, because everything else follows from it.\n\n"+
"Atmospheric correction works by *subtracting* the haze the processor thinks it saw. Over very dark targets — deep water, deep shadow — that estimate sometimes overshoots and produces a slightly **negative** reflectance. Physically meaningless, but numerically real. And the file format stores unsigned integers, which cannot hold a negative number at all.\n\n"+
"So from processing baseline 04.00 onward, ESA lifts everything onto a **pedestal**: it adds 1000 to every value before storing it, so the slightly-negative ones still land above zero. To get the real number back you **subtract** the 1000. Some data providers do that for you. Some say they did and did not.\n\n"+
"If you subtract a pedestal that was already removed, every band drops by 1000 and anything below zero gets clipped to zero. Red is the smallest band over forest — chlorophyll is eating it — so red hits zero first. And NDVI with red equal to zero is exactly 1.0.\n\n"+
"So the entire forest reads as impossibly, perfectly healthy. That is a bug that looks like a finding.",
  depth:
"ESA's metadata field is `BOA_ADD_OFFSET = −1000`, used in the recovery formula `reflectance = (DN + BOA_ADD_OFFSET) / 10000`. In plain terms: **the stored DN sits 1000 above the scaled reflectance, and you subtract 1000 to recover it.**\n\n"+
"Worked on dense summer conifer — true red ≈ 0.025, true NIR ≈ 0.30:\n\n"+
"- Stored on the pedestal: red 1250, NIR 4000. Subtract 1000 once → 250 and 3000 → NDVI **0.846**. Correct.\n"+
"- Provider already subtracted: stored red 250, NIR 3000. Subtract again → red **−750**, NIR 2000. `clip(min=0)` → red **0** → NDVI **1.000**.\n\n"+
"Note what the clip does: with red at exactly zero, NDVI reduces to `N/N`, so the NIR value cancels entirely. Every affected pixel returns the *same* value regardless of what was actually on the ground. That is why 69% of pixels agreed to five decimal places — they had stopped being measurements and become an algebraic identity.\n\n"+
"The pipeline therefore no longer trusts the `earthsearch:boa_offset_applied` flag, which is demonstrably wrong for some 2022 Element84 scenes. `boa_offset_per_time` **measures** the pedestal instead: the 1st percentile of valid, cloud-masked red in raw DN — dark targets like the Fraser River, Boundary Bay and deep shadow, whose true red reflectance is near zero, so they read the pedestal directly.\n\n"+
"**Where the 800 comes from — it is calibrated against haze, not chosen for roundness.** Across summers 2022–2025, clear scenes with no offset read **44–178 DN**; one hazy scene, 2023-08-28, reads **502**; an offset-carrying scene reads **~1000**.\n\n"+
"Haze is itself an additive lift: it scatters sunlight straight into the sensor without it touching the ground, so a dark target stops reading near zero. Atmospheric correction removes most of that but not all of it on a bad day. So the probe has to separate *two* additive effects — residual haze at up to ~500 DN, and the storage pedestal at ~1000. Set the threshold at 500 and that August scene is misread as carrying a pedestal, 1000 is subtracted from a perfectly good scene, and it clips. **800 clears the worst observed haze case with margin while staying well below a genuine offset.**\n\n"+
"Disagreements with the metadata are logged rather than silently overridden. The observed failure: scenes flagged `boa_offset_applied: False` carried red at ~400–500 DN over vegetation, identical to scenes flagged `True` — the offset was already gone in both. Trusting the flag subtracted 1000 from **five otherwise fine scenes**, pinned their NDVI at 1.0, and dragged the whole summer's median composite upward, because a median over the summer is poisoned by a handful of corrupted dates.\n\n"+
"On the Fraser Valley transect the measured offset is **0 DN**, independently confirming the correction holds on a second extent.",
  formula:"reflectance = (stored_DN − 1000) / 10000        ← subtract the pedestal ONCE\n\n"+
"  truth        red 0.025   NIR 0.30    NDVI 0.846\n"+
"  stored       red 1250    NIR 4000\n"+
"  −1000 once   red  250    NIR 3000    NDVI 0.846   ✓\n"+
"  −1000 twice  red −750    NIR 2000\n"+
"  clip(min=0)  red    0    NIR 2000    NDVI 1.000   ✗  ( = N/N )",
  whyThisChoice:
"Measuring beats trusting because the failure is silent. A wrong offset does not raise an error; it produces a beautiful, plausible, entirely fictitious result. A one-line probe against physics — water is dark — costs nothing and catches it.",
  rejectedAlternative:
"Trusting the provider's `boa_offset_applied` flag. That is what Phase 2 did, and it produced a published claim that had to be retracted.",
  trap:
"This is the strongest single credibility item in the whole repository, and it is worth volunteering rather than waiting to be asked. Finding your own error with an independent check, retracting the claim, and rebuilding is exactly the behaviour the Scientific Thought rubric rewards."
},
{
  id:"ndvi-saturation-artifact", group:"rs", prereqs:["boa-offset"], sourceDoc:"docs/ndvi_saturation_correction_notebooklm_note.md",
  title:"The retracted saturation claim",
  plain:
"Phase 2 of this project reported that NDVI saturated above 0.9 in 87% of Surrey's corridors, and treated that as a real ecological finding about dense urban canopy.\n\n"+
"It was not real. It was the offset bug. Subtracting the BOA offset twice drove red reflectance to zero in 69% of pixels, and NDVI with red at zero is exactly 1.000 by arithmetic. The median NDVI was 0.986 — a number that should have looked suspicious rather than encouraging.\n\n"+
"After the fix, NDVI spans 0.244 to 0.908 with a median of 0.768. Perfectly ordinary. The finding evaporated.",
  depth:
"The forensic signature is worth being able to describe: it was not that many pixels were *high*, it was that 69% were at **exactly 1.000**. A physical process does not pile up on a bound to five decimal places; an arithmetic one does. `clip(min=0)` on red, followed by a ratio, is a value generator, not a measurement.\n\n"+
"Three consequences stand:\n\n"+
"- The saturation result is withdrawn and must never be cited.\n"+
"- CDEI remained the Phase 3 target anyway, on its original Phase 1 grounding — the correction changed the input values, not the rationale for the index.\n"+
"- The offset is now measured per scene rather than assumed, so the class of error is closed rather than patched.",
  trap:
"Do not soften this into “an early version had slightly different values.” It was a false published claim, caught internally, retracted. Saying so plainly is stronger than hedging — and hedging is what the rubric penalises."
},
{
  id:"cloud-masking", group:"rs", prereqs:["reflectance"], sourceDoc:"src/pipeline/acquire_raster.py",
  title:"Cloud masking and compositing",
  plain:
"Most satellite images of a temperate coastal city have clouds in them. A cloud is bright in every band, and its shadow is dark in every band, so either one silently destroys a vegetation index if you leave it in.\n\n"+
"Two defences, used together. First, throw away the bad pixels: both satellites ship a per-pixel quality layer that labels cloud, cloud shadow, cirrus, snow and saturated pixels. Second, take many images across the whole summer and combine them per pixel, so that even if any single date is ruined, most dates are not.",
  depth:
"For Sentinel-2 the Scene Classification Layer is used with an explicit, enumerated **drop-list** (`BAD_SCL`), not a generic “clouds off”: classes 0, 1, 3, 8, 9, 10 and 11 are discarded (no-data, saturated, shadow, cloud medium/high, cirrus, snow), which leaves 2, 4, 5, 6 and 7 (dark area, vegetation, bare soil, water, unclassified). For Landsat, `QA_PIXEL` bits 1–4 are unpacked bitwise for dilated cloud, cirrus, cloud and cloud shadow.\n\n"+
"Compositing then differs by sensor, deliberately: **median for optical, mean for thermal**. Optical noise is skewed — a missed thin cloud is bright, and a median ignores it while a mean is dragged upward. Thermal noise is roughly symmetric, so a mean uses all the information; and a *maximum* composite, which is common in thermal work, would simply track the single clearest hot afternoon rather than the summer.\n\n"+
"No-data must be NaN and never 0, because NDVI and SWCI both take the value 0 legitimately.",
  rejectedAlternative:
"A single cloud-free “best scene” per summer. Simpler, but it makes the result depend on which day happened to be clear, and over a 16-day Landsat revisit there may be no clear day at all."
},
{
  id:"stac-cog", group:"rs", prereqs:[], sourceDoc:"src/pipeline/acquire_raster.py",
  title:"STAC and cloud-optimised GeoTIFFs",
  plain:
"There is far too much satellite imagery to download. A single Sentinel-2 scene is over a gigabyte, and this project touches hundreds of them across nine summers and two study areas.\n\n"+
"Two pieces of infrastructure make that tractable. **STAC** is a standard catalogue you can query — “give me every Sentinel-2 scene overlapping this box, between these dates, under 20% cloud.” **COG** is a file format that lets you read a small window out of a huge remote file over HTTP without fetching the rest.\n\n"+
"Together they mean you can compute over a terabyte of imagery while only ever transferring the few megabytes you actually need.",
  depth:
"Two interchangeable STAC providers are configured — Microsoft Planetary Computer and Element84 Earth Search — so a single vendor outage does not block the pipeline. That redundancy is also what exposed the BOA offset disagreement, since the two providers do not treat it identically.\n\n"+
"Reads are chunked with dask, which is why the Fraser transect job (2,841 km², 5072 × 1400 pixels at 20 m, two MGRS tiles) fit in memory at all and completed in roughly half an hour.\n\n"+
"Scenes are grouped by **solar day** before compositing, so the two MGRS tiles Surrey straddles are mosaicked into one observation rather than counted as two."
},
{
  id:"sar-backscatter", group:"rs", prereqs:["reflectance"], sourceDoc:"src/pipeline/validate_sar.py",
  title:"Radar backscatter — a genuinely independent sensor",
  plain:
"Sentinel-1 is a radar satellite. Instead of measuring reflected sunlight, it sends out its own microwave pulse and listens for the echo. That makes it completely different physics from everything else in this project: it works at night, it sees through cloud, and what comes back depends on the geometry and moisture of what it hit rather than on pigment.\n\n"+
"That independence is the entire point of using it. Checking a satellite index against another optical index proves very little, because both are looking at the same photons in the same way. Checking it against radar is a real test.",
  depth:
"Sentinel-1 transmits and receives in two polarisations: **VV** (vertical out, vertical back) and **VH** (vertical out, horizontal back). VH arises from volume scattering — the pulse bouncing around inside a canopy — so it rises with the amount of vegetation structure present.\n\n"+
"The pipeline takes summer-median VV and VH, derives the vegetation indices, computes zonal means per corridor, and correlates them against the CDEI stress ranking with Spearman's rho.\n\n"+
"The result was negative, and it was kept. That is the substance of [[canopy-confound]].",
  whyThisChoice:
"Different physics is the whole criterion for an independent check. If the validating instrument shares a failure mode with the instrument being validated, agreement between them is not evidence."
},
{
  id:"rvi-crossratio", group:"rs", prereqs:["sar-backscatter"], sourceDoc:"src/pipeline/validate_sar.py",
  title:"RVI and the cross-ratio",
  plain:
"From the two radar polarisations you can build simple indices, the same way NDVI is built from two optical bands. The Radar Vegetation Index and the cross-ratio both compare the cross-polarised echo to the co-polarised one, and both are meant to track vegetation condition.\n\n"+
"In this project they were used as the independent test of whether the corridor stress ranking is really about water. They returned essentially nothing — flat null, every year.",
  depth:
"`RVI = 4·VH / (VV + VH)` and the cross-ratio is simply `VH / VV`.\n\n"+
"Against the CDEI stress ranking across 139 corridors, over four summers:\n\n"+
"- RVI vs ranking: −0.066, +0.084, +0.012, −0.030\n"+
"- cross-ratio vs ranking: −0.076, +0.079, +0.006, −0.029\n"+
"- **VH backscatter** vs ranking: +0.373, +0.358, +0.364, +0.356\n"+
"- VH vs **NDVI**: +0.615, +0.536, +0.557, +0.549\n\n"+
"Read those four rows together and the conclusion is forced. The vegetation-*condition* indices see nothing. The one radar quantity that does correlate with the ranking is raw VH — and VH is itself tracking NDVI at about +0.55. So what agrees with the ranking is canopy density, not canopy water.\n\n"+
"This is stable across all four summers, which rules out a one-year artifact.",
  trap:
"Do not report this as “radar validated the index.” It did the opposite, and the honest framing is that an independent sensor **failed to corroborate** the between-corridor ranking as water stress."
},

/* ---------- GIS ----------------------------------------------------------- */
{
  id:"crs-26910", group:"gis", prereqs:[], sourceDoc:"CLAUDE.md · src/pipeline/prepare.py",
  title:"EPSG:26910 — why everything is in metres",
  plain:
"Latitude and longitude are angles, not distances. One degree of longitude is about 111 km at the equator and about 73 km at Surrey's latitude, so if you compute an area or a buffer in degrees you get a number that is wrong in a way that changes with where you are.\n\n"+
"A projected coordinate system fixes this by flattening a region of the globe onto a grid measured in metres. This project uses NAD83 / UTM Zone 10 North — EPSG:26910 — for every spatial operation, and everything is reprojected into it before anything is measured.",
  depth:
"The rule is enforced rather than assumed: `align.py` asserts that both raster and vector are in EPSG:26910 before it will do anything, and the corridor polygons are requested from the City's ArcGIS server with `outSR=26910` so they arrive natively in the analysis CRS and never pass through a reprojection at all.\n\n"+
"Two other systems appear at the boundaries and only there. **EPSG:4326** (WGS84 lon/lat) is used solely because STAC search demands a lon/lat bounding box. **EPSG:3005** (BC Albers) is what the provincial WFS serves VRI data in, so it is reprojected on arrival.\n\n"+
"The project seed is also 26910 — a small joke, but it makes every run reproducible from a number that is already in the codebase.",
  whyThisChoice:
"A single declared analysis CRS, asserted at the boundary, is the only defence against the class of bug where two layers silently disagree and the overlap is quietly wrong rather than loudly broken."
},
{
  id:"zonal-stats", group:"gis", prereqs:["crs-26910"], sourceDoc:"src/pipeline/zonal.py",
  title:"Zonal statistics",
  plain:
"A satellite image is a grid of pixels. A corridor is an irregular polygon. To get one number per corridor — its mean NDVI this summer, say — you have to find all the pixels inside that polygon and average them. That operation is called a zonal statistic.\n\n"+
"It sounds trivial and is not, because pixels do not respect polygon boundaries. Some pixels are entirely inside, some entirely outside, and many are cut by the edge.",
  depth:
"The analysis unit is the corridor polygon and never the grid cell — that is a standing repository convention. Each raster is aggregated to polygons independently, because a 20 m optical grid and a 30 m thermal grid do not align and pretending they do would invent detail the sensors never resolved.\n\n"+
"That per-polygon-first ordering is also why CDEI is computed on **polygon-level** NDVI, SWCI and LST rather than pixel-by-pixel: you cannot do pixel algebra across two grids that do not share a geometry without resampling one of them, and resampling thermal to 20 m manufactures precision that is not in the measurement.\n\n"+
"The join key at this stage is `objectid`, not `id`, because `id` is not unique across the polygon layer — see [[gin-id-vs-objectid]].",
  rejectedAlternative:
"Resampling everything to a common 10 m grid and doing pixel algebra. Cleaner code, but it fabricates thermal detail at three times the resolution the instrument actually delivers."
},
{
  id:"coverage-weighting", group:"gis", prereqs:["zonal-stats"], sourceDoc:"src/pipeline/zonal.py",
  title:"Coverage-weighted extraction",
  analogy:
"Measuring a field by counting whole squares of graph paper laid over it. For a big round field that is close enough. For a long thin ditch, nearly every square is half in and half out, and whole-square counting is mostly wrong.",
  plain:
"When a pixel is cut in half by a corridor boundary, how much should it count? The crude answer is all-or-nothing: include it if its centre is inside, exclude it otherwise. For a big compact polygon that barely matters. For a corridor that is 30 metres wide and made of 20-metre pixels, it matters enormously — you might be including a pixel that is two-thirds parking lot, or throwing away one that is nearly all forest.\n\n"+
"Coverage weighting does the honest thing: it computes the exact fraction of each pixel that falls inside the polygon and weights it by that fraction.",
  depth:
"Implemented with `exactextract`, which computes true geometric intersection areas rather than sampling.\n\n"+
"This is not a refinement, it is load-bearing. Surrey's GIN corridors are **0.29 to 157.8 ha** (median 5.8, mean 9.1) and are long and narrow rather than compact. It is that *shape*, not the area, that creates the partial-pixel problem at 20–30 m resolution: a long thin polygon has an enormous perimeter-to-area ratio, so a large share of its pixels are edge pixels.\n\n"+
"The contrast with Phase 3b is instructive. VRI forest stands are far larger and more compact, and their coverage fraction has a median of **1.00** with no stand below 0.5 — the thin-corridor problem simply disappears at the transect."
},
{
  id:"coverage-frac", group:"gis", prereqs:["coverage-weighting"], sourceDoc:"src/pipeline/zonal.py",
  title:"coverage_frac — the data-completeness check",
  plain:
"Even after masking clouds and weighting partial pixels, you need to know whether a corridor's number is based on plenty of valid data or on three surviving pixels. `coverage_frac` answers that: it is the fraction of the pixels you *expected* to find inside a polygon that turned out to be valid.\n\n"+
"A value near 1.0 means the polygon was well observed. A low value is a warning that the number attached to that polygon is thin.",
  depth:
"`coverage_frac = valid_px / expected_px`, where `expected_px = polygon_area / pixel_area`.\n\n"+
"The subtlety is in that denominator: **pixel area is recomputed from each raster's actual pixel size**, not taken from a constant. A 30 m Landsat pixel has nine times the area of a 10 m Sentinel-2 pixel, so reusing the optical constant for thermal would understate thermal coverage by a factor of nine and make well-observed polygons look unmeasurable.\n\n"+
"Each raster therefore carries its **own** coverage fraction, because optical and thermal coverage genuinely differ — different revisit intervals, different cloud masks, different pixel sizes."
},
{
  id:"mixed-pixels", group:"gis", prereqs:["zonal-stats"], sourceDoc:"src/pipeline/align.py",
  title:"Mixed pixels and edge contamination",
  plain:
"A 20-metre pixel sitting on the boundary of a green corridor does not contain only corridor. It contains some canopy, some road, some roof, some lawn — and the satellite reports a single blended value for all of it. That blend is a mixed pixel, and in a city it is mostly a way of quietly mixing pavement into your forest measurement.\n\n"+
"For corridors that are only one or two pixels wide, a large share of every pixel is boundary. This is the most obvious objection to the whole Surrey analysis, so it was tested rather than argued about.",
  depth:
"Two responses, one structural and one empirical.\n\n"+
"Structurally, corridors are buffered **inward** before any statistics are taken — see [[inward-buffer]].\n\n"+
"Empirically, the objection was tested directly: if mixed pixels were driving the result, narrow corridors would systematically read differently from wide ones. Corridor width against CDEI gives **ρ = −0.038, p = 0.64** — no relationship at all. This is Limitations item 11 in the paper, and it is one of the few limitations that is recorded as *checked and found not to bite*.\n\n"+
"The effective analysis widths are worth knowing: **39.7 m for Surrey corridors against 94.8 m for transect stands**. The two extents are not measuring the same kind of object, which is Limitations item 10.",
  trap:
"The strong answer here is not “we buffered inward.” It is “we buffered inward, and then we tested whether width predicts the index, and it does not — ρ = −0.038, p = 0.64.” A mitigation you did not verify is a hope."
},
{
  id:"inward-buffer", group:"gis", prereqs:["mixed-pixels"], sourceDoc:"src/pipeline/align.py",
  title:"The half-pixel inward buffer",
  plain:
"To keep boundary pixels out of the statistics, each corridor is shrunk slightly before the pixels inside it are counted — pulled in by five metres all the way round. Anything within five metres of the edge is discarded.\n\n"+
"Five metres is half a pixel, and the choice of a half rather than a whole pixel is deliberate. A full 10-metre buffer would completely erase the narrowest corridors, because Surrey's target corridor widths start at 10 metres. You would then be dropping exactly the corridors most vulnerable to the problem you were trying to fix.",
  depth:
"Corridors whose geometry collapses under the buffer are **not dropped**. They keep their original shape and get a `too_thin = True` flag, and the count of those is itself treated as a finding: it answers “how many of Surrey's corridors are simply unmeasurable at 10 m resolution?”\n\n"+
"That is a different design philosophy from silently discarding difficult cases. Dropping them would improve every summary statistic on the page while hiding the limitation that produced the improvement.",
  rejectedAlternative:
"A full one-pixel (10 m) inward buffer. Cleaner edge rejection, but it deletes the narrowest corridors entirely — and those are the ones the City most needs information about.",
  trap:
"Limitations item 10 discusses the buffer convention, and an outside reviewer once raised the 5 m asymmetry as an uncontrolled variable. It is already answered there, with both conventions reported."
},
{
  id:"representative-point", group:"gis", prereqs:["crs-26910"], sourceDoc:"src/pipeline/acquire_climate.py",
  title:"representative_point() rather than the centroid",
  plain:
"To ask a climate service for the weather at a corridor, you need a single point to ask about. The obvious choice is the centroid — the polygon's centre of mass.\n\n"+
"The obvious choice is wrong for this data. Surrey's corridors are long, narrow and often curved, following creeks and ravines. The centre of mass of a crescent falls in the gap, outside the shape entirely. You would be asking for the climate of a place that is not in the corridor.",
  depth:
"`representative_point()` is guaranteed by construction to return a point that lies *inside* the polygon, at some cost in elegance — it is not the geometric centre of anything.\n\n"+
"For a compact polygon the two coincide closely and the distinction is academic. For this dataset it is not, and the failure would have been silent: ClimateBC would have returned perfectly plausible values for a point in the neighbouring subdivision.\n\n"+
"Because ClimateBC downscales on elevation, an off-polygon point is not merely misplaced — it can sit at a different elevation, which is exactly the input the whole downscaling turns on."
},
{
  id:"gin-corridors", group:"domain", prereqs:[], sourceDoc:"src/pipeline/acquire_vector.py",
  title:"Surrey's Green Infrastructure Network",
  plain:
"The City of Surrey maintains a mapped network of vegetated corridors that connect habitat patches across the city — creek ravines, forest remnants, the green strips that let a coyote or a songbird move from one park to another without crossing six lanes of traffic. The City calls it the Green Infrastructure Network, or GIN.\n\n"+
"The City has a stated need, in its Ecosystem Management Study, to find which corridors are becoming impaired so it can spend a limited restoration budget where it matters most. That is the practical question this project attaches itself to.",
  depth:
"There are **144 GIN corridors**, served by the City's ArcGIS MapServer as **153 polygons** — seven corridors are digitised in two to four separate pieces. See [[gin-id-vs-objectid]] and [[modelling-vs-reporting-unit]].\n\n"+
"Each corridor carries City-assigned attributes used as the prioritisation lens: **ecological value** (Low/Moderate/High) and **risk of development** (the pressure it is under). Those are the City's own judgements, not the project's, and they are what turn a stress ranking into something a planner can act on.\n\n"+
"The polygon layer was chosen over the City's “Ecosystem Corridors” polyline layer for a mundane and decisive reason: you cannot compute zonal statistics inside a line.",
  trap:
"A citation error worth knowing about: the City of Surrey study was once cited here as establishing a 144-corridor network. It actually reports **396 corridor segments**; the 144 come from its Appendix J. This is the project's own example of why verified metadata is not the same as having read a paper."
},
{
  id:"gin-id-vs-objectid", group:"gis", prereqs:["gin-corridors"], sourceDoc:"scripts/parse_appendix_j.py",
  title:"GIN id versus objectid",
  plain:
"The City's data layer carries two identifier columns, and they are not the same thing. `objectid` is an ArcGIS row number — a database artefact, running 1 to 153. `id` is the City's actual corridor number, the one that appears in its own management documents, running 1 to 144.\n\n"+
"Everything this project reported before 29 July 2026 used `objectid`. So “corridor 73” named a row in a table, not the corridor the City calls 73. For a deliverable whose entire purpose is telling a planner which corridor to visit, that is a serious error.",
  depth:
"The identifier question was settled empirically rather than by reading documentation, by cross-tabulating against the City's own published Appendix J on four shared attributes:\n\n"+
"- joined on `id`: agreement of **95.8% to 99.3%** (ecological value and development risk 97.9%, corridor type 95.8%, target width 99.3%)\n"+
"- joined on `objectid`: **33.8%** — indistinguishable from chance\n\n"+
"`parse_appendix_j.py` re-verifies this key on every run and raises if the relationship inverts, so the error cannot silently return.\n\n"+
"The consequence was a 49-edit pass through the manuscript. Roughly five places had the wrong *number* (facts about the City became 144); roughly forty had the right number with the wrong *noun* (`corridor-summers` became `polygon-summers`). Table 1 was a polygon top-10 labelled “Corridor” with objectids, and it listed GIN 14 twice, at ranks 1 and 5, with two different stress values.",
  trap:
"If a judge asks how you know the join is right, the answer is the cross-tabulation — 95.8–99.3% versus 33.8% at chance — not “the column was called id.”"
},
{
  id:"modelling-vs-reporting-unit", group:"gis", prereqs:["gin-id-vs-objectid","zonal-stats"],
  sourceDoc:"src/pipeline/corridor_stress.py",
  title:"Two units, deliberately",
  plain:
"Because seven corridors are drawn in several pieces, there are 153 polygons but only 144 corridors. Rather than force one into the other, the project keeps both, each for the job it is right for.\n\n"+
"The **polygon** is the modelling unit: it has its own pixels, its own data-completeness fraction, and it is what cross-validation holds out. The **GIN corridor** is the reporting unit: it is what the City manages, what its documents index, and what a restoration budget is spent on.\n\n"+
"Corridor values are area-weighted means of their polygons — a 13-hectare piece and a 0.8-hectare piece should not count equally.",
  depth:
"Both files ship: `corridor_stress_ranking.csv` has 144 corridors plus the City's own recommendation text; `polygon_stress_ranking.csv` has the 153 polygons in full detail.\n\n"+
"The obvious objection is that splitting a corridor across cross-validation folds would leak information between train and test. It was checked: **zero split corridors straddled a block in any of five repeats**, so the published results stand as computed.\n\n"+
"One place the language is deliberately left as “between-corridor”: the ranking caveats in §3.4, §3.5, §5 and Limitations item 1. That ranking is *delivered* at corridor level and inherits the canopy confound, and rewriting those to “between-polygon” would read as though the corridor ranking had somehow escaped it.",
  whyThisChoice:
"Collapsing to 144 everywhere would have thrown away the per-polygon coverage fractions the whole zonal design depends on. Reporting 153 everywhere would have handed the City a list keyed to database row numbers."
}
,

/* ---------- THE CDEI INDEX ------------------------------------------------ */
{
  id:"feature-space", group:"cdei", prereqs:["ndvi","swci"], sourceDoc:"scripts/plot_cdei_feature_space.py",
  title:"Feature space — plotting one index against another",
  plain:
"Take every corridor in every summer and put a dot on a graph: greenness along the bottom, canopy water up the side. You now have a cloud of dots. That cloud is called a **feature space**, and its *shape* carries information that neither index carries alone.\n\n"+
"The key insight is that the cloud has edges, and the edges mean something physical. For any given amount of greenness, there is a driest that vegetation can plausibly be, and a wettest. The dots do not fill the whole rectangle; they fill a wedge. Where a corridor sits inside that wedge — near the dry edge or far from it — is more informative than either coordinate on its own.",
  depth:
"This is a well-established family of methods. The classical version plots **land surface temperature against NDVI** and produces a triangle or trapezoid, with a “dry edge” along the top (hot, water-limited) and a “wet edge” along the bottom. Moran (1994), Carlson & Ripley (1997) and Sandholt's TVDI (2002) are the lineage the preprint cites.\n\n"+
"This project inverts the picture. It plots **SWCI against NDVI**, and because SWCI *increases* with canopy water while temperature *decreases* with it, the dry edge becomes the **lower** envelope of the cloud with a **positive** slope, rather than the upper envelope with a negative one.\n\n"+
"That inversion is worth being able to state out loud, because anyone who knows the classical trapezoid will read the figure with the wrong orientation in mind.",
  figure:"../../deliverable/fig3_dry_edge.png",
  figureAlt:"NDVI against SWCI with the fitted dry edge",
  figureCaption:"The feature space with the fitted dry edge. Distance from that line is the numerator of CDEI."
},
{
  id:"dry-edge", group:"cdei", prereqs:["feature-space"], sourceDoc:"src/pipeline/assemble.py",
  title:"The dry edge",
  analogy:
"A height-for-age chart. There is no single correct height, but for a given age there is a lower line almost no healthy child falls below. The dry edge is that line for canopy water at a given greenness, and the index is how far above it you sit.",
  plain:
"The dry edge is a straight line fitted along the bottom of the cloud — the boundary that says “for vegetation this green, this is about as little canopy water as we ever see.”\n\n"+
"Once you have that line, a corridor's water status becomes a distance. A corridor sitting right on the line has almost no moisture margin for how green it is. A corridor sitting far above it has plenty. That distance is the raw stress measurement.\n\n"+
"Crucially it is a **relative** measure. It says how a corridor compares to the driest thing seen at its greenness, not how much water is in the soil.",
  depth:
"The fit is deliberately robust rather than naive:\n\n"+
"- NDVI is divided into **12 equal-frequency (quantile) bins** — equal counts per bin, not equal widths, so sparsely populated NDVI ranges do not get a bin of their own.\n"+
"- Within each bin, the **5th percentile** of SWCI is taken, not the minimum. A raw minimum would chase a single outlier pixel-average per bin and make the line hostage to noise.\n"+
"- Sparse bins are dropped, and a least-squares line is fitted through the surviving bin points.\n\n"+
"**The fit is done across all polygon-summers at once, never per year.** That is the single most consequential choice in the index. A per-year fit would re-zero the index every summer, so a dry year and a wet year would each be measured against their own edge and the between-year signal — the thing a drought monitor exists to detect — would be erased by construction.\n\n"+
"It also creates the project's most serious open weakness, because a fixed line and a drifting cloud interact badly over a long record. See [[cdei-drift]].",
  whyThisChoice:
"Panel-wide fitting is what makes the index comparable across summers. It is also, unavoidably, what makes it sensitive to slow changes in the panel itself — the same property, seen from two sides.",
  rejectedAlternative:
"Fitting the dry edge separately per summer. It would immunise the index against greenness drift and destroy its ability to detect drought in the same stroke."
},
{
  id:"perpendicular-distance", group:"cdei", prereqs:["dry-edge"], sourceDoc:"src/pipeline/assemble.py",
  title:"Perpendicular distance and the 1/√(1+b²) factor",
  analogy:
"How far you are from a road. You could measure straight up the map grid, but that overstates the walk unless the road happens to run east-west. The honest answer is the shortest path to the road, and converting between the two depends on how steeply the road is angled.",
  plain:
"Distance from a point to a line can be measured two ways: straight up (how far above the line, reading vertically) or the shortest way (perpendicular to the line). They are different numbers unless the line is horizontal.\n\n"+
"This project uses the perpendicular distance, because that is the honest geometric distance from the point to the line. Converting from the vertical version to the perpendicular one requires dividing by a factor that depends on how steep the line is.",
  depth:
"If the dry edge is `SWCI = a + b·NDVI`, then the vertical gap for an observation is `SWCI_obs − (a + b·NDVI_obs)`, and the perpendicular distance is that gap divided by `√(1 + b²)`.\n\n"+
"The sign convention is fixed and matters everywhere downstream: `dry_dist` is **positive on the wet side**, above the line. So **low CDEI means more stressed**, and the corridor ranking is ascending CDEI expressed as a stress percentile where 100 is the most stressed.\n\n"+
"That geometry also gives the drift diagnostic its analytic prediction. A shift in the panel's mean NDVI and SWCI translates into a shift in `dry_dist` of `(Δswci − b·Δndvi) / √(1 + b²)` — which is how the drift was confirmed to be geometry rather than sensor: predicted 0.0065, observed 0.0077.",
  formula:"dry_dist = (SWCI_obs − (a + b·NDVI_obs)) / √(1 + b²)\n\n  positive = wet side  →  LOW CDEI = MOST STRESSED",
  trap:
"Getting the sign backwards inverts the entire deliverable. If asked which corridors are most stressed, they are the ones with the *lowest* CDEI."
},
{
  id:"rlst", group:"cdei", prereqs:["lst"], sourceDoc:"src/pipeline/assemble.py",
  title:"RLST — relative warmth, in Kelvin",
  analogy:
"A thermometer that reports the average temperature of the whole room. Two people's readings cannot be compared — they mostly describe the rooms. But one person against their own usual reading still detects a fever.",
  plain:
"Absolute surface temperature is not comparable between two corridors. One might sit beside a highway, another in a shaded ravine; the difference between them is mostly about what surrounds them, not about how thirsty they are.\n\n"+
"So temperature enters as a **ratio to the corridor's own multi-summer average**. A corridor running hotter than its own normal this summer is a signal; a corridor that is simply always hot is not.\n\n"+
"And the ratio is taken in Kelvin, not Celsius, because a ratio only means anything on a scale with a true zero.",
  depth:
"Celsius has an arbitrary zero, so a “ratio” of 21 °C to 20 °C (1.05) and of 294 K to 293 K (1.003) are different numbers describing the same physical change. Only the Kelvin version is meaningful.\n\n"+
"The cost of doing it correctly is real and is reported rather than hidden: because summer surface temperatures in Kelvin are all near 290–310, the ratio barely moves. RLST is a gentle modulation by construction.\n\n"+
"**How gentle is the point.** CDEI correlates with `dry_dist` alone at **ρ = +0.99997**. The thermal term carries essentially no between-polygon information at all. That is Limitations item 3, and after an outside review it was moved forward in the manuscript to §2.2 — the point where RLST is defined — rather than being disclosed only after the maps that depend on it.",
  trap:
"A judge who notices that ρ = +0.99997 will ask why the thermal band is in the index at all. The honest answer is that it contributes almost nothing between polygons, that this is measured and disclosed, and that the index would be nearly identical without it."
},
{
  id:"cdei", group:"cdei", prereqs:["perpendicular-distance","rlst"], sourceDoc:"src/pipeline/assemble.py",
  title:"CDEI — the response variable",
  plain:
"CDEI, the Canopy Dry-Edge Index, is the thing this whole project tries to predict. It combines the two pieces: how far a corridor sits from the dry edge in greenness–water space, divided by how warm it is running relative to its own normal.\n\n"+
"High CDEI means comfortable — plenty of canopy water for how green it is, and no unusual heat. Low CDEI means stressed.\n\n"+
"It is computed for every polygon in every summer, from free satellite imagery, with no field measurements and no commercial data.",
  depth:
"`CDEI = dry_dist / RLST`, one value per polygon per summer.\n\n"+
"The name has a history worth knowing. It was called **TVWSI** in earlier drafts, until an audit found that name belongs to Joshi et al. (2021), *Remote Sensing* 13(22):4635. It was renamed to CDEI. The dataframe column is still `tvwsi`, because the cached panels were built under the old name and renaming the field would invalidate them — `tvwsi` the column and CDEI the index are the same quantity.\n\n"+
"Panel sizes: **612 rows** over Surrey (153 polygons × 4 summers, 2022–2025) and **1,200 rows** over the transect (300 VRI stands × 4 summers). The extended Surrey record reaches 1,377 polygon-summers across nine summers, 2017–2025.",
  formula:"CDEI = dry_dist / RLST\n\n  dry_dist : perpendicular distance from the fitted NDVI–SWCI dry edge (+ = wet)\n  RLST     : summer LST ÷ that polygon's multi-summer mean LST, in Kelvin",
  figure:"../../preprint/latex/figures/fig1-cdei-construction.png",
  figureAlt:"CDEI construction and the orthogonal-axes diagnosis",
  figureCaption:"How CDEI is built, and the orthogonal-axes problem it ran into over Surrey.",
  trap:
"**CDEI does not measure soil moisture.** It is a relative feature-space index derived from satellite reflectance and surface temperature, never validated against a ground observation at either extent. Saying it measures soil moisture is on the never-say list."
},
{
  id:"frozen-reference", group:"cdei", prereqs:["cdei","dry-edge"], sourceDoc:"src/pipeline/assemble.py",
  title:"The frozen reference (--freeze-from)",
  analogy:
"Grading on a curve. Redraw the curve when a new class sits the exam and last year's B quietly becomes a C, without anyone's paper changing. Freezing the curve is what keeps a published grade meaning what it said.",
  plain:
"Here is an awkward property of an index defined by fitting a line to your data: if you add more data, the line moves. And if the line moves, every number you already published moves with it.\n\n"+
"That is unacceptable for a monitoring tool. So the pipeline can **freeze** the dry edge and the per-polygon temperature baselines from an existing panel and reuse them, so that adding new summers applies a fixed index to new data rather than redefining the index.",
  depth:
"Both the dry edge and the RLST baseline are properties of *the panel they were fitted on*. A naive extension from four summers to nine moved every already-published CDEI value by a median of **8.1% of a standard deviation**, and shifted the dry-edge coefficients printed in the paper and in Figure 1.\n\n"+
"Frozen mode reproduces the canonical years **bit-exactly** — a difference of 0.000e+00 on all six derived columns — which is asserted as a check before anything downstream is compared.\n\n"+
"Conceptually this is the stronger claim: applying a fixed index to new summers is an **out-of-sample application**, whereas refitting and re-reporting is a new description of a new dataset.",
  formula:"python -m src.pipeline.assemble --years 2017 ... 2025 \\\n  --freeze-from data/processed/features.parquet \\\n  --out data/processed/features_extended.parquet",
  whyThisChoice:
"Freezing is what makes a published number stay published. It is also what exposed the drift problem, because a frozen line against a drifting cloud is exactly the configuration in which [[cdei-drift]] becomes visible."
},
{
  id:"cdei-drift", group:"cdei", prereqs:["frozen-reference"], sourceDoc:"scripts/drift_diagnostic.py",
  title:"CDEI drifts with the panel's own greenness — OPEN",
  analogy:
"A tide gauge bolted to a pier that is slowly sinking. The water may not be rising at all, but the readings climb — and because the gauge is the only instrument you have, nothing in the numbers tells you which of the two moved.",
  plain:
"This is the most serious unresolved problem in the project, and it deserves to be understood properly rather than memorised.\n\n"+
"The claim was that CDEI works as a drought monitor over time: in drier summers it correctly reads as more stressed. That rested on four summers. Extending to nine summers was supposed to confirm it, and instead the relationship vanished — the correlation moved from −0.68 to about +0.07.\n\n"+
"The cause was diagnosed, and it is not the satellite. It is the frozen dry edge. Over nine years the forest quietly got a little greener. The dry edge did not move, because it was frozen. So the whole cloud of dots slid sideways relative to a fixed line, and the index moved for reasons that have nothing to do with water.",
  depth:
"The numbers make the mechanism unusually clear. Between the two halves of the record, mean NDVI differs by **+0.014** (p = 0.40) and mean SWCI by **−0.005** (p = 0.12). **Neither difference is statistically significant.** Yet the dry-edge geometry converts those two non-significant shifts into a **0.51 standard deviation** shift in `dry_dist`, at **p = 1 × 10⁻¹⁷**.\n\n"+
"The arithmetic checks out: `(Δswci − b·Δndvi)/√(1+b²)` predicts 0.0065 and 0.0077 was observed.\n\n"+
"Four alternative mechanisms were ruled out **by test rather than by argument**: the frozen RLST baseline (refitting it leaves the result null), the thermal term entirely (`dry_dist` alone collapses identically), a code-version difference in the imagery (2022/2023 rasters rebuilt with the current code are bit-identical, r = 1.00000), and any significant shift in the input bands.\n\n"+
"**And part of it is still unexplained.** Within the five earlier summers the moisture correlation is not merely displaced, it is *absent*: r = −0.04, p = 0.28. Two dry summers, 2018 and 2021, read as unstressed and nobody knows why.",
  whyThisChoice:
"The untested fix is to refit the dry edge per period, or to normalise against a reference that does not move with canopy growth, then re-extend. It needs no new data. It has not been done.",
  trap:
"The correct answer to “what is happening in 2018 and 2021?” is **“I don't know yet, and here is what I ruled out.”** Do not manufacture an explanation. Do not claim the extension confirmed anything — it is a diagnostic, not a result, and claiming otherwise is on the never-say list."
},
{
  id:"canopy-confound", group:"cdei", prereqs:["cdei","rvi-crossratio"], sourceDoc:"src/pipeline/validate_sar.py",
  title:"The canopy-density confound",
  plain:
"The headline limitation of the applied deliverable. When the corridor stress ranking was checked against independent radar, the vegetation-condition radar indices showed no relationship to it at all. The only radar signal that *did* line up with the ranking turned out to be tracking how dense the canopy is.\n\n"+
"Put bluntly: the corridors the map calls most stressed are substantially just the densest-canopy corridors. The map might be a vegetation-density map wearing a water-stress label.\n\n"+
"This was found by the project itself, with an independent sensor, and the deliverable was demoted to exploratory as a result.",
  depth:
"The direct measurement is **CDEI against NDVI, ρ = −0.347, n = 153 polygons** (reported as −0.35 in the abstract). Greener polygons read as more stressed.\n\n"+
"At the transect the same confound measures **ρ = −0.314 against stand NDVI, n = 300** — essentially the same magnitude, which is itself informative: the confound is a property of the index, not of Surrey.\n\n"+
"But the sharper derived objection — *that the central A-vs-B finding is therefore really about canopy density rather than water stress* — was tested and **does not hold**. Residualising CDEI on 24 independent VRI attributes does not weaken the result, it **strengthens** it. See [[residualisation]].\n\n"+
"Two facts constrain the confound further: crown closure correlates at only +0.180, height and age at about 0, and land-cover class explains just **2.7%** of between-stand CDEI variance. So the confound runs along **greenness**, not along stand type.",
  trap:
"Never say the corridor ranking is validated. It is exploratory and confounded. The honest position: it might be a density map, you found that yourself with an independent sensor, and you labelled it accordingly on every figure."
},

/* ---------- CLIMATE ------------------------------------------------------- */
{
  id:"climate-normal", group:"climate", prereqs:[], sourceDoc:"src/pipeline/acquire_climate.py",
  title:"Climate normals",
  plain:
"A climate normal is the long-term average weather for a place — typically over thirty years — and it is what “normal for this time of year” actually means. It is the baseline against which any particular summer is judged unusual or not.\n\n"+
"Without a baseline, a raw temperature is nearly useless for comparing places: 22 °C is a warm summer in one valley and a cool one in another. Against the local normal, the same number becomes interpretable.",
  depth:
"The intended baseline was 1971–2000. The ClimateBC web API turned out to serve only **Normal_1961_1990**, so every anomaly in this project is taken against 1961–1990 instead. That is a documented deviation from the plan rather than a silent substitution.\n\n"+
"It matters because 1961–1990 is a cooler baseline than 1971–2000, so anomalies computed against it run systematically warmer. Since the analysis uses anomalies as *predictors* rather than reporting them as climate findings, a constant offset is absorbed by the model — but the choice is disclosed rather than assumed to be harmless."
},
{
  id:"climate-anomaly", group:"climate", prereqs:["climate-normal"], sourceDoc:"src/pipeline/assemble.py",
  title:"Anomalies as predictors",
  plain:
"For each corridor and each summer, the pipeline computes both the raw climate value and the **anomaly** — the value minus that corridor's own long-term normal. The anomaly answers “how unusual was this summer, here?”\n\n"+
"Anomalies are often more useful than levels for prediction, because they strip out the permanent local differences and leave the year-to-year variation.",
  depth:
"Every climate variable enters the predictor set as a level *and* as an anomaly, with one exception: solar radiation gets a level but no anomaly twin, because at a single latitude it is very nearly constant between summers and the anomaly would be noise around zero.\n\n"+
"There is a structural irony here that becomes the project's central diagnosis. Anomalies are almost purely temporal quantities — they vary strongly between years and weakly between places. Levels carry the spatial information. Over Surrey the target varies mostly in *space*, so the anomalies, which look like the more sophisticated feature, are exactly the ones with nothing to contribute. See [[orthogonal-axes]]."
},
{
  id:"climatebc-downscaling", group:"climate", prereqs:["climate-normal"], sourceDoc:"src/pipeline/acquire_climate.py",
  title:"ClimateBC and “scale-free” downscaling",
  plain:
"Climate models produce values on a grid, and the grid cells are large — tens of kilometres across. Everything inside one cell gets the same climate, which is obviously wrong in mountainous terrain where a valley floor and a ridge top are in the same cell.\n\n"+
"ClimateBC takes a different approach. You give it a latitude, a longitude **and an elevation**, and it returns climate for that exact point. There is no grid at all — hence “scale-free.” It works by interpolating smoothly between the coarse grid points and then applying an elevation adjustment, since temperature falls predictably with height.\n\n"+
"The hypothesis this whole project tests is whether that extra spatial detail actually helps predict anything on the ground.",
  depth:
"Effective resolution is roughly **375–750 m**, but the honest framing is that the effective resolution is set by the **digital elevation model** you feed it, not by any property of the climate product. Give it a coarse DEM and the scale-free claim degrades accordingly.\n\n"+
"Elevation therefore is not a convenience, it is the lever the whole method turns on. It comes from the **Copernicus GLO-30** DEM, fetched via Planetary Computer STAC with retry-and-backoff and a fallback to the raw AWS COG tile bucket — because a DEM failure at minute zero kills a 33-hour unattended acquisition run.\n\n"+
"Variables fetched include annual and seasonal sets: **CMD** (climatic moisture deficit), **Eref** (reference evaporation), **AHM** and **SHM** (annual and summer heat-moisture indices), **DD18** (degree-days above 18 °C), plus Tmax, Tmin, PPT and radiation. Summer (`_sm`) variables are fetched first because they carry the water-stress hypothesis.",
  links:[{label:"Interactive: bilinear interpolation sandbox", href:"../../bilinear_interpolation.html"}],
  trap:
"“Scale-free” is a marketing term for “no grid,” not a claim of infinite accuracy. If asked what limits it, the answer is the DEM."
},
{
  id:"climate-vars", group:"climate", prereqs:["climate-normal"], sourceDoc:"src/pipeline/acquire_climate.py",
  title:"CMD, Eref, AHM, DD18 — what the variables mean",
  plain:
"The climate variables in this project are not raw temperatures; most are derived indices that combine temperature and precipitation into something closer to what a plant experiences.\n\n"+
"- **CMD**, climatic moisture deficit: how much more water the atmosphere wanted to evaporate than was actually available. The single most direct climate measure of drought pressure.\n"+
"- **Eref**, reference evaporation: how much water would evaporate from a standard surface — the atmospheric demand side.\n"+
"- **AHM / SHM**, heat-moisture indices: warmth divided by wetness, annually and for summer.\n"+
"- **DD18**, degree-days above 18 °C: accumulated heat above a threshold, a measure of how much hot weather there was rather than how hot the peak got.",
  depth:
"These are the variables whose behaviour produces the orthogonal-axes diagnosis, so their variance structure is worth carrying in your head. Over Surrey, between-year standard deviation against between-corridor standard deviation:\n\n"+
"- CMD_sm: 77.53 vs 7.63 → **10.2× more temporal than spatial**\n"+
"- PPT_sm: 73.04 vs 11.60 → 6.3× temporal\n"+
"- Tmin_sm 2.7×, Rad_sm 2.5×, DD18_sm 2.4×, Eref_sm 2.3×, Tmax_sm 2.3× — all temporal\n\n"+
"At the transect the leading predictors by variance lost under coarsening are Eref, Tmax and CMD, which shed 58–68% of their spatial variance at a 25 km cell.\n\n"+
"The API also fails **silently** rather than loudly: a malformed period request returns `−9999`, or the degenerate triple `MAT = 0 / MAP = 1 / AHM = 10000`. `validate_record` rejects those before they can reach a model."
},
{
  id:"rate-limited-acquisition", group:"climate", prereqs:["climatebc-downscaling"], sourceDoc:"src/pipeline/acquire_climate.py",
  title:"Acquiring data behind a rate limit",
  plain:
"ClimateBC's web service allows about 50 calls per hour from one IP address. That limit is undocumented — it was discovered by hitting it. There is no batch endpoint.\n\n"+
"This project needed 765 calls for Surrey (153 corridors × 5 periods) and 1,500 for the transect (300 stands × 5 periods). At 46 calls an hour that is roughly 16 hours and 33 hours respectively, running unattended.\n\n"+
"That constraint shapes the whole module: it has to be interruptible, resumable, and safe to kill at any moment.",
  depth:
"Four design consequences, each of which is a defensible engineering answer in its own right:\n\n"+
"- A **token-bucket limiter** paced at 48/hour, under the observed ceiling.\n"+
"- A **permanent disk cache** in `data/raw/climatebc/`, so re-running is free for anything already fetched. Interruption costs nothing.\n"+
"- **Corridor-major job ordering** — all periods for corridor 1, then all for corridor 2. A partial run therefore yields a *complete* panel for the first k corridors rather than holes scattered across every corridor.\n"+
"- **Atomic write-then-rename**, so a kill mid-write cannot leave a truncated cache entry that would be read back as valid.\n\n"+
"`complete_panel` then keeps only units that have every study year *and* the normal, so an unbalanced panel cannot silently over-weight the well-covered corridors.\n\n"+
"Practical note that cost real time: the machine has to stay awake. A system sleep freezes the process and silently adds hours, which is why runs are wrapped in `caffeinate -s`.",
  rejectedAlternative:
"Parallelising across threads or machines. The limit is per IP, so concurrency buys nothing and risks a ban. The correct response to a rate limit is patience plus resumability, not cleverness."
},
{
  id:"bec-zone", group:"climate", prereqs:[], sourceDoc:"src/pipeline/acquire_vri.py",
  title:"BEC zones",
  plain:
"British Columbia classifies its landscape into Biogeoclimatic Ecosystem Classification zones — broad ecological regions defined by climate and the vegetation that grows in them. Coastal Western Hemlock, Mountain Hemlock, Coastal Mountain-heather Alpine, and so on.\n\n"+
"In this project they are used for sampling rather than analysis: they provide a way to stratify the transect sample so that the high-elevation zones are actually represented.",
  depth:
"The 300 transect stands are sampled from 12,168 candidates, stratified by **BEC zone × easting quintile** with **√n proportional allocation**.\n\n"+
"Plain proportional allocation would have spent roughly 77% of the sampling budget on lowland Coastal Western Hemlock, because that is where most of the stands are, and left the montane band essentially unsampled — destroying the elevation gradient that was the entire reason for building a transect. Equal allocation would have over-weighted rare zones. The square-root rule is the standard compromise between the two."
}
,

/* ---------- STATISTICS & ML ----------------------------------------------- */
{
  id:"residual", group:"stats", prereqs:[], sourceDoc:"src/pipeline/experiment.py",
  title:"Residuals",
  plain:
"A model predicts a value; reality has a different value. The difference between them is the **residual** — the part the model got wrong.\n\n"+
"Almost every measure of how good a model is, and several of the methods in this project, are built out of residuals. Squaring them and averaging gives RMSE. Regressing one variable on another and keeping the residuals is how you remove a confounder. Understanding residuals is the foundation for most of the statistics here.",
  depth:
"`residual = observed − predicted`. Positive means the model under-predicted.\n\n"+
"The structure of the residuals matters as much as their size. Residuals that are large but patternless mean a noisy problem. Residuals that are **spatially clustered** — all positive in one part of the map, all negative in another — mean the model is missing something systematic, and they are also the signature of [[spatial-autocorrelation]], which is what makes naive validation dishonest for spatial problems."
},
{
  id:"rmse-mae", group:"stats", prereqs:["residual"], sourceDoc:"src/pipeline/experiment.py",
  title:"RMSE and MAE",
  plain:
"Two ways to summarise how wrong a model is on average.\n\n"+
"**MAE**, mean absolute error, takes the size of each residual ignoring sign and averages them. It is the plain-language answer to “how far off is it typically?”\n\n"+
"**RMSE**, root mean square error, squares the residuals first, averages, then square-roots. Squaring means a few big misses count for much more than many small ones, so RMSE punishes large errors harder. Both are in the same units as the thing being predicted.",
  depth:
"RMSE ≥ MAE always, and the gap between them tells you how uneven the errors are.\n\n"+
"The headline comparisons in this project are RMSE differences, and they are tiny in absolute terms because CDEI is a small-valued index: Surrey Model A RMSE **0.01393** against Model B **0.01397**. The transect: Model A **0.02565**, Model B **0.02472**.\n\n"+
"Those absolute magnitudes are meaningless out of context — CDEI has a standard deviation of about 0.0138 over Surrey. What matters is the **paired difference** between two models scored on identical folds, and whether an interval around that difference excludes zero. See [[paired-difference]].\n\n"+
"Note that Surrey's ΔRMSE and ΔMAE point in *opposite* directions (−0.00004 versus +0.00018), which is itself a sign that neither model is doing anything meaningful."
},
{
  id:"r-squared", group:"stats", prereqs:["rmse-mae"], sourceDoc:"src/pipeline/experiment.py",
  title:"R² — variance explained",
  plain:
"R² compares your model against the laziest possible model: always guess the average, no matter what the inputs say.\n\n"+
"If your model's squared errors are half as big as the always-guess-the-mean model's, R² is 0.5 — you have explained half the variance. R² = 1 means perfect prediction. R² = 0 means you did exactly as well as guessing the mean, which is to say you learned nothing.\n\n"+
"The unintuitive part is that it can go below zero.",
  depth:
"`R² = 1 − SS_res / SS_tot`, where `SS_res` is the sum of squared residuals from the model and `SS_tot` is the sum of squared deviations from the mean of the test data.\n\n"+
"Two things to be careful about. First, on **held-out** data there is nothing forcing R² to be positive, unlike the in-sample case in ordinary least squares. Second, `SS_tot` is computed on the *test fold's* mean, so a fold whose values happen to be tightly clustered has a small denominator and can produce a badly negative R² from modest errors — one reason per-fold R² varies more than per-fold RMSE."
},
{
  id:"negative-r2", group:"stats", prereqs:["r-squared"], sourceDoc:"docs/PHASE3_FINDINGS.md",
  title:"Negative R² — and what −0.138 means",
  analogy:
"A weather forecaster who is worse than the rule tomorrow will be the yearly average. Not merely unhelpful: you would have done better ignoring them entirely.",
  plain:
"A negative R² means the model is **worse than guessing the average**. Not just unhelpful — actively harmful. You would have done better ignoring every predictor and returning one constant number.\n\n"+
"This happens on held-out data when a model has learned patterns from the training set that do not exist in the test set, and confidently applies them anyway.\n\n"+
"Model A on the transect scored **R² = −0.138**. That is the fine-resolution climate model, and it is the model the project's own hypothesis said should win.",
  depth:
"Attack surface 8 in the coach brief exists precisely because this number is easy to fumble, and if it is fumbled the whole results section becomes indefensible.\n\n"+
"The reading is: fine-scale climate detail is not merely uninformative for stand water stress, it is **anti-informative**. The forest chases spatial structure in the climate field that has no counterpart in the response, and its confident predictions are worse than a constant.\n\n"+
"The supporting evidence is that R²_A climbs monotonically from **−0.249 to −0.060** as the forest's minimum leaf size grows from 1 to 10, while R²_B does not move. Constraining the learner suppresses the damage — which is direct evidence that Model A's deficit is overfitting to fine-grained climate detail rather than random noise.\n\n"+
"And the honest counterpart: Model B's **+0.003** is not skill either. Two models were compared; one of them was less bad. Neither is useful.",
  trap:
"The trap answer is “so the coarse model is better.” The complete answer is that the coarse model is *less bad*, that +0.003 is no skill, and that the conclusion is about the **comparison** rather than about either model's usefulness."
},
{
  id:"cross-validation", group:"stats", prereqs:["residual"], sourceDoc:"src/pipeline/experiment.py",
  title:"Cross-validation",
  plain:
"If you test a model on the same data you trained it on, it will look brilliant, because it has simply memorised the answers. To find out whether it learned anything transferable you have to test it on data it has never seen.\n\n"+
"Cross-validation does this systematically: split the data into folds, hold one out, train on the rest, predict the held-out fold, then repeat so every fold gets its turn. Every observation gets predicted exactly once by a model that never saw it.",
  depth:
"The standard version splits **at random**, and for most machine-learning problems that is correct.\n\n"+
"For spatial problems it is not, and the reason is [[spatial-autocorrelation]]. A random split scatters neighbouring locations across train and test, so the model can predict a held-out corridor by effectively looking up the corridor next door. That is not skill, it is proximity, and it inflates the score.\n\n"+
"Ploton et al. (2020) is the citation for this in the preprint — they show directly that random splits inflate accuracy estimates for spatial models — and it is the strongest justification for the blocked design used here. Roberts et al. (2017) covers cross-validation for structured data more generally."
},
{
  id:"spatial-autocorrelation", group:"stats", prereqs:[], sourceDoc:"src/pipeline/experiment.py",
  title:"Spatial autocorrelation",
  analogy:
"An exam where you can see your neighbour's paper. You will score well, and the score measures the seating plan rather than what you know.",
  plain:
"Things near each other tend to be alike. Two corridors half a kilometre apart share soil, weather, tree species, planting history and management. Two corridors twenty kilometres apart share much less.\n\n"+
"This is sometimes called the first law of geography, and it is not a nuisance — it is a real property of the world. It becomes a problem only when a validation procedure lets a model exploit it and then reports the result as predictive skill.",
  depth:
"The failure mode is precise. Under a random split, for almost every held-out corridor there is a near neighbour in the training set. A flexible learner such as a random forest can approximate “return the value of the nearest thing I have seen,” which scores well without having learned any relationship between predictors and response.\n\n"+
"The score you get is then a measurement of how spatially autocorrelated your response variable is, dressed up as a measurement of your model.\n\n"+
"The defence is to hold out **contiguous geographic blocks**, so that held-out locations have no near neighbours in training. It makes the problem harder, and the harder problem is the honest one — it is also the one that matches how the model would actually be used, which is on corridors it has never seen."
},
{
  id:"blocked-cv", group:"stats", prereqs:["cross-validation","spatial-autocorrelation"], sourceDoc:"src/pipeline/experiment.py",
  title:"Spatially-blocked cross-validation",
  analogy:
"So instead of removing one student per row, you remove an entire row and seat them in another building. Nobody can see a neighbour now. Scores drop — and the lower score is the true one.",
  plain:
"Instead of splitting corridors at random, group them into geographic clusters and hold out whole clusters at a time. Every corridor in the held-out block is far from everything the model trained on, so the model cannot fall back on “what did the neighbour do?”\n\n"+
"This is the honest way to test a spatial claim, and it produces much lower scores than a random split would. Those lower scores are the true ones.",
  depth:
"Implementation: **k-means clustering on projected corridor coordinates** defines the blocks, and whole blocks are held out.\n\n"+
"Two guardrails. The block count auto-shrinks to keep at least **8 corridors per held-out block**, because a block of two produces an unscoreable fold; and fewer than 16 corridors raises an error rather than silently producing nonsense.\n\n"+
"Repeats **re-seed the blocking itself**, not just the model. That matters: repeating with the same partition only measures model variance, whereas re-partitioning measures whether the result survives a different carving of the map. The base seed is 26910, the project's CRS.",
  trap:
"An expert may push back that blocked CV artificially handicaps the model. The answer is that the handicap is the point — the intended use is prediction on unseen corridors, so a validation that allows neighbour lookup is measuring the wrong thing. Ploton 2020 is the citation."
},
{
  id:"grouped-folds", group:"stats", prereqs:["blocked-cv"], sourceDoc:"src/pipeline/experiment.py",
  title:"Grouping by corridor across summers",
  plain:
"Each corridor appears four times in the data, once per summer. If summer 2022 for a corridor lands in training and summer 2024 for the same corridor lands in testing, the model has effectively seen the answer — corridors change slowly, so knowing one year tells you most of another.\n\n"+
"So the folds are built on **corridors**, not on rows. All four summers of a corridor always travel together.",
  depth:
"The elegant part is that this falls out for free from the blocking design: k-means runs on corridor coordinates, so each corridor gets one block assignment, and all its rows inherit it. Grouping is automatic rather than a second mechanism bolted on.\n\n"+
"The obvious risk in Surrey is the seven corridors digitised as multiple polygons — could two polygons of one corridor land in different blocks? It was checked explicitly: **zero split corridors straddled a block in any of five repeats.**\n\n"+
"One deliberate exception: the [[temporal-holdout]] *does* let corridors repeat across the split, because it is testing transfer through time rather than through space."
},
{
  id:"paired-difference", group:"stats", prereqs:["rmse-mae","blocked-cv"], sourceDoc:"src/pipeline/experiment.py",
  title:"The paired difference",
  analogy:
"Compare two runners by racing them on the same courses on the same days, not by their personal bests. Whatever made a course hard slowed both of them, so it cancels out of the difference.",
  plain:
