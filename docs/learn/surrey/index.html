"Comparing two models by their overall scores is noisy, because some folds are simply harder than others and both models do badly on them.\n\n"+
"The fix is pairing. Score Model A and Model B on **exactly the same folds**, then take the difference fold by fold. Whatever made a fold hard affects both models equally, so it cancels out of the difference. What remains is the signal you actually care about: is A better than B, consistently?\n\n"+
"This is the same logic as a paired experiment in any science — compare treatments within the same subject rather than between subjects.",
  depth:
"Both models see identical `(repeat, block)` folds, identical seeds, identical hyperparameters and identical target. The only thing that differs is the spatial resolution of the predictors.\n\n"+
"The reported quantity is the paired ΔRMSE, positive meaning A is worse:\n\n"+
"- Surrey: **−0.00004**, A better in 48% of folds — a coin flip.\n"+
"- Transect, 25 km: **+0.00093**, A better in 40% of folds.\n\n"+
"Pairing is also what rescues the residualisation retest from an acknowledged leak: the residualisation is fitted globally rather than per fold, which does leak response structure into the folds — but it leaks *identically into both arms*, and the reported quantity is the paired difference, so the comparison survives even though the absolute scores would not."
},
{
  id:"bootstrap-ci", group:"stats", prereqs:["paired-difference"], sourceDoc:"src/pipeline/experiment.py",
  title:"Bootstrap confidence intervals",
  analogy:
"You have twelve measurements and want to know how much the average would wobble had you happened to take twelve different ones. You cannot go back, so you draw twelve out of the twelve you have, allowing repeats, and watch how far the average moves. Ten thousand times.",
  plain:
"You have a handful of per-fold differences and you want to know whether their average is real or just how these particular folds happened to fall.\n\n"+
"The bootstrap answers this by resampling. Draw a new set of folds from the ones you have, with replacement, and compute the average. Do that ten thousand times. You now have ten thousand plausible averages, and the middle 95% of them is your confidence interval.\n\n"+
"It requires no assumption that anything is normally distributed — which is fortunate, because a dozen folds is nowhere near enough for that assumption to hold.",
  depth:
"10,000 resamples of the per-fold paired differences; the interval is the 2.5th and 97.5th percentiles.\n\n"+
"The alternative would be a paired t-interval, which assumes the per-fold differences are approximately normal. With a small number of spatially-blocked folds that assumption is not defensible, and the bootstrap makes no such claim.\n\n"+
"Attack surface 9 in the coach brief names the bootstrap specifically as something to be tested hard on — precisely because it is a sophisticated-sounding method that is easy to name and hard to explain. If you cannot describe resampling with replacement in your own words, naming it is a liability."
},
{
  id:"ci-excludes-zero", group:"stats", prereqs:["bootstrap-ci"], sourceDoc:"src/pipeline/experiment.py",
  title:"“The interval excludes zero”",
  plain:
"This is the single most important sentence in the project's results, and it is the claim that survives everything.\n\n"+
"If the confidence interval around the difference between two models contains zero, then “no difference at all” is a plausible explanation of what you saw. If the interval **excludes** zero — every plausible value is on the same side — then a real difference is the better explanation.\n\n"+
"Verdict words like FALSIFIED flip on arbitrary thresholds. The interval does not.",
  depth:
"Surrey: ΔRMSE −0.00004, CI **[−0.00016, +0.00007]** — spans zero. No difference detectable.\n\n"+
"Transect at 25 km: ΔRMSE +0.00093, CI **[+0.00021, +0.00170]** — excludes zero. And at 12 km: +0.00094, also excluding zero, even though the *label* there reads INCONCLUSIVE.\n\n"+
"Across 32 independent seed runs at both cell sizes, the interval excludes zero in **32 of 32**. Under eight hyperparameter configurations, Model B is better on the point estimate in **8 of 8**, though the interval excludes zero in only **6 of 8** — the two exceptions being the heavily regularised settings (min leaf 5 and 10).\n\n"+
"So the fully honest statement is: the coarse model is never worse; it is significantly better under the majority of reasonable settings including the pre-registered one; and heavy regularisation closes the gap to statistical indistinguishability.",
  trap:
"This is what must be said **unprompted** when the knife-edge verdict comes up. Weight the paired intervals (32/32) over the categorical label (holds at one cell size). See [[verdict-rule]]."
},
{
  id:"random-forest", group:"stats", prereqs:["residual"], sourceDoc:"src/pipeline/experiment.py",
  title:"Random forests",
  plain:
"A decision tree splits the data by asking yes/no questions about the predictors — “is summer moisture deficit above 400?” — until it reaches groups it can assign a value to. A single tree overfits badly.\n\n"+
"A random forest grows hundreds of trees, each on a random subsample of the data and considering a random subset of predictors at each split, then averages them. The randomness makes the trees disagree, and averaging disagreeing models is much more robust than trusting one.",
  depth:
"Pre-registered settings, fixed a priori and never tuned: **400 trees, min_samples_leaf = 3, max_features = sqrt**. The constraints are deliberate — an unconstrained forest with leaf size 1 can memorise individual corridors, and R²_A at leaf size 1 is −0.249, its worst value.\n\n"+
"Citation discipline: the preprint cites **Breiman (2001)** for the method and scikit-learn for the implementation. Citing only scikit-learn — which is what an earlier draft did — credits the software rather than the idea, and the coach brief flags that distinction as something to be asked about.\n\n"+
"Gradient boosting is also available in the codebase as an alternative learner, but the reported results use the forest.",
  links:[{label:"Interactive: ML pipeline explorer", href:"../../ml_pipeline_explorer.html"}],
  trap:
"Limitations item 8: **one downscaling product, one learner.** The result is not shown to hold for other model families."
},
{
  id:"permutation-importance", group:"stats", prereqs:["random-forest","blocked-cv"], sourceDoc:"src/pipeline/explain.py",
  title:"Permutation importance on held-out blocks",
  analogy:
"Work out whether a team member matters by scrambling their contribution and seeing how much output drops — and measure it on new work, not on the project they have already memorised.",
  plain:
"To find out how much a model relies on a particular predictor, shuffle that predictor's values randomly and see how much worse the model gets. If shuffling it changes nothing, the model was not using it.\n\n"+
"The important refinement here is *where* you measure the drop. Measured on the training data it tells you what the model latched onto, including things it memorised. Measured on a **held-out spatial block** it tells you what actually helps on stands the model has never seen — which is the only question worth asking.",
  depth:
"This is what produced the finding that between-stand water stress is driven by local factors. The leading predictors, scored on held-out blocks, are **leading species (bigleaf maple), stand area, aspect (eastness then northness), and broadleaf class**.\n\n"+
"**No climate variable appears anywhere in that ranking.**\n\n"+
"Attack surface 9 names permutation importance as one of the sophisticated-sounding methods to be tested hardest on, alongside the bootstrap and the blocking design. The in-sample versus out-of-sample distinction is the substance of it."
},
{
  id:"spearman", group:"stats", prereqs:[], sourceDoc:"src/pipeline/explain.py",
  title:"Spearman rank correlation",
  plain:
"Pearson correlation measures how well two variables follow a **straight line**. Spearman replaces every value with its rank — 1st, 2nd, 3rd — and then correlates the ranks.\n\n"+
"That makes it sensitive to any consistently increasing or decreasing relationship, not just a straight one, and it is barely affected by outliers. For questions of the form “do these two things go up and down together?”, which is most of the validation in this project, it is the right tool.",
  depth:
"The rho values that carry the most weight here:\n\n"+
"- stand-mean CDEI against the climate gradient: CMD_sm −0.093, Tmax_sm −0.139, Eref_sm −0.138, elevation +0.145 → **|ρ| ≤ 0.15**, n = 300. This near-zero result is the crux of the entire Phase 3b conclusion.\n"+
"- CDEI against NDVI: **−0.347**, n = 153 — the canopy confound.\n"+
"- CDEI against `dry_dist` alone: **+0.99997** — the thermal term is inert between polygons.\n"+
"- corridor width against CDEI: −0.038, p = 0.64 — mixed pixels checked, and they do not bite.\n\n"+
"A near-zero rank correlation with n = 300 is a strong negative statement, not an absence of evidence: it says the two things genuinely do not order the landscape the same way."
},
{
  id:"residualisation", group:"stats", prereqs:["residual","spearman"], sourceDoc:"scripts/residualized_retest.py",
  title:"Residualisation — removing a confounder",
  analogy:
"You suspect the sales rise was the hot weather, not the ad campaign. So you subtract off whatever temperature alone would predict, and ask whether the campaign still explains what is left over.",
  plain:
"If you suspect that your result is really driven by some other variable, you can try to remove that variable's influence and see whether the result survives.\n\n"+
"The method: regress your outcome on the suspected confounder, and keep the residuals — the part of the outcome the confounder cannot explain. Then re-run the whole analysis on the residuals. If the finding disappears, it was the confounder. If it survives, it was not.\n\n"+
"Here the suspected confounder was canopy density, and the finding did not merely survive. It got stronger.",
  depth:
"The retest bounds the question from both sides with two residualisation strengths:\n\n"+
"**Structural (the clean test).** CDEI residualised on 24 VRI attributes — age, height, crown closure, species, land-cover class — which come from the provincial forest inventory and are therefore **independent of the imagery CDEI is built from**. They absorb 14.9% of CDEI variance. Result: ΔRMSE **+0.00113 [+0.00049, +0.00183]** at 25 km and **+0.00146 [+0.00083, +0.00213]** at 12 km. Both exclude zero; both are *larger* than the unresidualised result.\n\n"+
"**Greenness (a deliberate over-correction).** Adding stand-mean NDVI absorbs 73.2% of variance and inverts the sign — but NDVI is a **constitutive input** to `dry_dist`, not a confounder, so this removes the index rather than the confound. Both models then fall below the mean (R²_A −0.087, R²_B −0.229) and the skill precondition fails. It is reported as a pessimistic bound, explicitly not as the headline.\n\n"+
"One acknowledged leak, stated openly in the script's own docstring: the residualisation is fitted globally rather than per fold. It leaks identically into both arms and the reported quantity is the paired difference, which is why it is defensible.",
  whyThisChoice:
"Two strengths rather than one, because a single residualisation invites the objection that you chose the flattering amount. Bounding the answer from both sides removes that move."
},
{
  id:"mahalanobis-novelty", group:"stats", prereqs:["residual"], sourceDoc:"src/pipeline/assemble.py",
  title:"Mahalanobis distance and climate novelty",
  analogy:
"Someone 6 foot 5 and 250 lb is unremarkable — that combination is ordinary. At 5 foot 2, the same 250 lb is not. Judging each measurement on its own misses this; you have to know how the two normally travel together.",
  plain:
"How unusual is this summer's climate, here, compared to normal? A single variable is easy. Several correlated variables at once is not — being 2 degrees warm and 20% dry might be entirely ordinary if warm and dry always happen together, and extraordinary if they never do.\n\n"+
"Mahalanobis distance handles this by measuring distance in units of the natural spread of the data, taking the correlations into account.",
  depth:
"The subtle and consequential choice: the covariance used for scaling is that of the **departures** (`x − x_normal`), **not** the spatial covariance of the normals themselves.\n\n"+
"Over a flat 30 km delta the climate normals barely vary between corridors, so their covariance matrix is near-singular. Scaling by it inflated distances by roughly an order of magnitude and, worse, ranked *unusual place* rather than *unusual climate*. Correcting it moved the median novelty from **14.3 to 1.87** (p95 3.21).\n\n"+
"A ridge scaled to `1e-6 × trace(cov)` is added before pseudo-inversion, because ClimateBC variables remain strongly collinear even after differencing.\n\n"+
"Novelty is then used to stratify out-of-fold error into terciles, which locates where the model is extrapolating rather than interpolating."
},
{
  id:"seed-sensitivity", group:"stats", prereqs:["blocked-cv"], sourceDoc:"scripts/seed_sensitivity.py",
  title:"Seed sensitivity",
  plain:
"The k-means blocking and the forest both start from a random seed. Run the experiment again with a different seed and you get a slightly different partition of the map and a slightly different forest — so a result that only appears at one seed is not a result.\n\n"+
"Model B clears the skill gate by about three thousandths, which is exactly the kind of margin that invites the accusation of a lucky draw. So the whole experiment was re-run across many seeds, re-seeding the blocking and the forest together.",
  depth:
"| cell | seeds | R²_B (mean ± sd) | R²_B > 0 | paired ΔRMSE | CI excludes 0 |\n"+
"|---|---|---|---|---|---|\n"+
"| 12 km | 12 | −0.0027 ± 0.0010 | 0 / 12 | +0.00094 | 12 / 12 |\n"+
"| 25 km | 20 | +0.0033 ± 0.0005 | 20 / 20 | +0.00093 | 20 / 20 |\n\n"+
"Two conclusions, and both matter. The verdict label is a **deterministic function of cell size**, not a lucky draw — at 12 km it is negative in all twelve runs, at 25 km positive in all twenty. And the paired difference excludes zero in **32 of 32 runs** across both cell sizes.\n\n"+
"What this does *not* rescue: +0.003 is a stable measurement, not a meaningful amount of skill.",
  figure:"../../figures/paired_ci.png",
  figureAlt:"Paired ΔRMSE confidence intervals across seeds",
  figureCaption:"Paired intervals per seed. The 12 km seeds are deliberately excluded from this figure — they fail the skill gate, and plotting them would imply falsifications the experiment does not support."
},
{
  id:"within-unit-demeaning", group:"stats", prereqs:["spearman"], sourceDoc:"scripts/drift_diagnostic.py",
  title:"Within-unit demeaning",
  plain:
"There are two completely different questions hiding in one correlation. “Do dry polygons differ from wet polygons?” is a question about places. “Does a given polygon read drier in the summers when that polygon is drier?” is a question about time.\n\n"+
"To ask only the second, subtract each polygon's own average from both series first. What is left is purely the year-to-year wobble within each polygon, with all the permanent differences between polygons removed.",
  depth:
"This is what separates the honest temporal claim from the flattering one. Across the four summer means (n = 4) CDEI correlates with moisture deficit at **−0.68** and precipitation at **+0.72**. Computed within polygons (n = 612) the same relationships hold in the same directions but are much weaker: **−0.31** and **+0.32**.\n\n"+
"Both are reported, always with their n. A correlation on four points establishes a **sign**, not a magnitude — which is why the deliverable README calls the temporal result a *direction check* rather than a validation.\n\n"+
"Over the extended nine-summer record: network-wide **+0.070**, within-polygon **+0.049**, and within the five earlier summers the relationship is *absent* at r = −0.04, p = 0.28."
},
{
  id:"temporal-holdout", group:"stats", prereqs:["cross-validation"], sourceDoc:"src/pipeline/experiment.py",
  title:"The forward temporal holdout",
  analogy:
"Being handed the exam you already sat, rather than next year's paper. Memorising four annual averages and reciting them looks exactly like understanding, until the year changes.",
  plain:
"Spatial cross-validation holds out places. A temporal holdout holds out *time*: train on the earlier summers, predict the most recent one. It answers a different question — can this model predict a year it has not seen?\n\n"+
"In this project it exists mostly as a trap detector, and it caught a big one.",
  depth:
"Stripping each corridor's own mean from CDEI to isolate the temporal axis appears to produce genuine skill, with a physically sensible sign: spatial CV R² of **+0.051**, against −0.042 for the level, and the four summer means correlate with moisture deficit at −0.677.\n\n"+
"It is memorisation. Spatial CV holds out *corridors*, not *years*, so all four summers are present in training and the model can simply learn four year-means and apply them.\n\n"+
"The forward holdout cannot be cheated that way, and it is brutal: train on <2025, test on 2025 gives **R² = −1.673** for the anomaly target, against −0.041 for the level.\n\n"+
"**Do not cite the +0.051.** With four summers there is no defensible temporal claim — four points is not a time series.\n\n"+
"Note also that corridors deliberately *do* repeat across this split, unlike in the spatial folds, because the thing being tested is transfer through time.",
  trap:
"This is a result the project found, liked, and then killed with a stricter test. That sequence is worth telling: it is evidence of exactly the discipline the Scientific Thought rubric is looking for."
},
{
  id:"circular-stats-aspect", group:"stats", prereqs:[], sourceDoc:"src/pipeline/explain.py",
  title:"Circular statistics — averaging aspect",
  analogy:
"Average 11pm and 1am by their clock numbers and you get noon.",
  plain:
"Aspect is the compass direction a slope faces, in degrees. The problem is that 359° and 1° are two degrees apart in the world and 358 degrees apart in arithmetic. Averaging them gives 180° — due south — which is the exact opposite of the truth.\n\n"+
"The fix is to stop treating a direction as a number. Convert it into a pair of components — how much it faces north, how much it faces east — average those, and you get the right answer.",
  depth:
"Aspect is stored as **northness** and **eastness**, the cosine and sine unit-vector components. A polygon mean of raw degrees is meaningless for anything crossing 0°/360°.\n\n"+
"It matters here because aspect turned out to be one of the leading real drivers of between-stand water stress: a south-facing slope in the Fraser Valley receives substantially more afternoon sun than a north-facing one at the same elevation. Eastness and northness both appear in the permutation-importance ranking.\n\n"+
"Two related terrain derivations in the same module: ruggedness is the within-stand standard deviation of elevation, and slope comes from `np.gradient` with `north = −d/drow`, because raster rows increase southward."
},

/* ---------- EXPERIMENTAL DESIGN ------------------------------------------ */
{
  id:"model-a-vs-b", group:"design", prereqs:["climatebc-downscaling"], sourceDoc:"src/pipeline/experiment.py",
  title:"Model A versus Model B",
  plain:
"The whole experiment in one sentence: two models that are identical in every respect except the spatial resolution of their climate predictors.\n\n"+
"**Model A** uses scale-free ClimateBC sampled at each polygon — the fine, expensive, allegedly-better data. **Model B** uses *those same values* averaged into coarse grid cells — the same information, blurred.\n\n"+
"Same learner, same folds, same seeds, same features, same target. If A does not beat B, then the fine spatial detail was not carrying anything useful.",
  depth:
"The hypothesis under test: **scale-free downscaled climate (~375–750 m) predicts corridor water stress better than coarse grid-based climate.** The falsifying result is the coarse model performing as well or better, with a paired interval excluding zero.\n\n"+
"Results at the two extents:\n\n"+
"- **Surrey**, 4 km cell: A RMSE 0.01393 (R² −0.042), B 0.01397 (R² −0.051), ΔRMSE −0.00004 CI [−0.00016, +0.00007]. **INCONCLUSIVE.**\n"+
"- **Transect**, 25 km cell: A RMSE 0.02565 (R² −0.138), B 0.02472 (R² +0.003), ΔRMSE +0.00093 CI [+0.00021, +0.00170]. **FALSIFIED.**\n\n"+
"25 km is chosen as a faithful stand-in for the grid resolution of the regional climate models the hypothesis set out to beat.",
  figure:"../../figures/board/ab_schematic.png",
  figureAlt:"Surrey corridors under a fine grid and a 4 km grid",
  figureCaption:"Model A samples the fine field; Model B averages it into coarse cells. Nothing else changes."
},
{
  id:"degrade-not-substitute", group:"design", prereqs:["model-a-vs-b"], sourceDoc:"src/pipeline/experiment.py",
  title:"Why Model B is a degradation, not a different product",
  analogy:
"To test whether resolution matters in a photograph, you do not compare a Canon against a Nikon. You take one photo and blur a copy of it. Otherwise every other difference between the two cameras ends up inside your answer.",
  plain:
"The obvious way to test “does fine climate data beat coarse climate data?” is to get a fine product and a coarse product and compare them. That design is broken, and understanding why is the single best demonstration of experimental thinking in this project.\n\n"+
"Two different products differ in dozens of ways — different source stations, different interpolation methods, different reference periods, different bias corrections. If one wins, you cannot say whether it won because of its **resolution** or because of everything else about it.\n\n"+
"Deriving the coarse model by blurring the fine one holds all of that constant. Resolution becomes the only thing that varies.",
  depth:
"This is the central design decision of the entire project, and it is attack surface 7.\n\n"+
"The concession it forces is real and must be volunteered: **Model B is not a real climate model.** No regional climate model was run. It is a synthetic spatial degradation of ClimateBC, standing in for one.\n\n"+
"The defence is that the alternative is strictly worse. A real RCM comparison would confound *which dataset* with *what resolution*, and the confound would be unresolvable with the data available. A synthetic degradation answers a narrower question cleanly rather than a broader question uninterpretably.\n\n"+
"It also has a second virtue: because the upscale averages within `(cell, year)`, the temporal signal is preserved exactly, so the two models are **identical by construction** on a purely temporal target. That is not a bug — it is the guarantee that only spatial detail is being tested.",
  rejectedAlternative:
"Running or obtaining an actual regional climate model at 25 km and comparing it to ClimateBC. More externally valid, entirely uninterpretable — any difference could be resolution or could be that they are simply different models."
},
{
  id:"upscaling", group:"design", prereqs:["model-a-vs-b"], sourceDoc:"src/pipeline/experiment.py",
  title:"Upscaling — how the blur is done",
  plain:
"To build Model B, lay a coarse grid over the study area and replace each unit's climate values with the average of all units in its cell. Everything within one cell now has identical climate, exactly as it would from a coarse climate model.\n\n"+
"The detail that matters: the averaging is done **within each cell for each year separately**, never across years. That way the year-to-year variation is untouched, and only spatial detail is destroyed.",
  depth:
"Cells are anchored to the EPSG:26910 origin at `⌊x/c⌋, ⌊y/c⌋`. That anchoring is specified in the methods because a half-cell shift would change which units fall together and therefore change the partition — an outside reviewer raised exactly this, and §2.5 now states it.\n\n"+
"Cell sizes tested and the resulting geometry:\n\n"+
"- Surrey: 4 km → 25 cells, 8 km → 12, 12 km → 6, 20 km → 4, 30 km → 3.\n"+
"- Transect: 4 km → 101 cells, 8 km → 40, 12 km → 23, 25 km → 10.\n\n"+
"There is a squeeze here. Bigger cells destroy more spatial variance, which is what you want — but they also leave fewer cells, and below about 8 cells there is not enough geographic spread left to spatially block Model B. Surrey needs ~20 km cells for meaningful contrast and has only 4 cells at that size. There is no escape inside Surrey."
},
{
  id:"contrast-gate", group:"design", prereqs:["upscaling"], sourceDoc:"src/pipeline/experiment.py",
  title:"The contrast gate — the methodological contribution",
  analogy:
"Testing whether glasses help by comparing your vision wearing them against wearing them with one faint smudge. If the smudge changed nothing, finding no difference says nothing at all about glasses.",
  plain:
"Before comparing a fine model to a coarse one, ask a question almost nobody asks: **did the coarsening actually change anything?**\n\n"+
"If blurring the predictors barely moves them, then Model A and Model B are very nearly the same model, and finding no difference between them is arithmetic rather than evidence. You would have proved nothing, while producing a result that looks exactly like a null finding.\n\n"+
"So the pipeline measures the fraction of predictor spatial variance destroyed by the coarsening, and refuses to issue a verdict below 30%. This is the part of the project that generalises beyond corridors, water and British Columbia.",
  depth:
"`MIN_CONTRAST_FRAC = 0.30`, measured by `upscaling_diagnostics()`.\n\n"+
"| cell | Surrey | transect |\n|---|---|---|\n| 4 km | **12.3%** | 13.4% |\n| 8 km | 24.1% | 29.0% |\n| 12 km | 28.4% | 34.4% |\n| 25 km | — | **48.4%** |\n| 30 km | 85.6% | — |\n\n"+
"At Surrey's 4 km cell, Models A and B remain correlated at a median **r = 0.998**. A null difference between models that near-identical is not evidence about resolution.\n\n"+
"At the transect's 25 km cell the median predictor loses about half its spatial variance and the leading ones — Eref, Tmax, CMD — lose 58–68%, while 10 cells still leave enough spread to block Model B. The gate passes and the test becomes real.\n\n"+
"Stated generally: **measure the fraction of predictor spatial variance the coarsening destroys before comparing climate resolutions.** That is the transferable contribution, and it matters more than the falsification.",
  trap:
"Attack surface 5: this gate was written **after** Surrey returned its null. See [[verdict-rule]] for why that is not HARKing — but do not pretend the ordering did not happen. It is disclosed in the paper."
},
{
  id:"skill-gate", group:"design", prereqs:["negative-r2"], sourceDoc:"src/pipeline/experiment.py",
  title:"The skill gate, and its threshold artifact — BOUNDED",
  analogy:
"A pass mark set at exactly 50%. Score 49.7 and 50.3 and you get different words on the certificate, describing performances nobody could tell apart.",
  plain:
"The second precondition: at least one of the two models must beat simply predicting the average. If both are worse than a constant, then ranking them tells you which of two failures is less bad, which is not a statement about resolution.\n\n"+
"The threshold is R² greater than exactly zero. And that exact zero is the project's most-criticised design choice, because the results land on opposite sides of it at two defensible cell sizes.",
  depth:
"`MIN_SKILL_R2 = 0.0`. At 25 km Model B reaches +0.0035 → **FALSIFIED**. At 12 km it reaches −0.0027 → **INCONCLUSIVE**.\n\n"+
"The label flips. The paired difference does not: ΔRMSE +0.00093 versus +0.00095, both intervals excluding zero, 32 of 32 seeds.\n\n"+
"Zero is a convenience, not a principled boundary — there is no theory saying that a model 0.003 better than the mean has crossed into usefulness while one 0.003 worse has not.\n\n"+
"**How it was addressed.** Rather than defend the threshold, the verdict *labels were removed from the evidence tables*. Tables `tab:cellsens`, `tab:seedsens` and `tab:hpsens` now report whether the paired interval excludes zero, not a verdict word; the labels are discussed in the text as threshold artifacts. Limitations item 12 had already recommended exactly this, and the tables had been contradicting it.\n\n"+
"Status: **BOUNDED** — real, but measured and scoped.",
  trap:
"Attack surface 4. The right answer weights the paired intervals over the categorical label, and the coach brief says to say so **unprompted** rather than waiting to be pushed there."
},
{
  id:"verdict-rule", group:"design", prereqs:["skill-gate","contrast-gate"], sourceDoc:"src/pipeline/experiment.py",
  title:"The precondition-based verdict rule",
  plain:
"`experiment.verdict()` will not issue SUPPORTED, FALSIFIED or NOT SUPPORTED unless both preconditions pass: at least one model has skill, and the coarsening destroyed a material amount of spatial variance. If either fails, the verdict is INCONCLUSIVE.\n\n"+
"This exists because the original falsification rule silently assumed both conditions. Over Surrey both failed, and without the gates the pipeline would have returned a bare NOT SUPPORTED — which would have read as evidence against downscaling when in fact the test had nothing to measure.",
  depth:
"The order-of-operations objection is attack surface 5, and a sharp judge will make it: **the gate was written after Surrey returned its null.**\n\n"+
"The response has three parts, and it should be reconstructed from scratch rather than recited:\n\n"+
"1. A gate is an **inclusion criterion**, not a hypothesis dressed up as a prediction. HARKing is inventing a hypothesis to fit a result; this is declaring when a test is capable of answering anything.\n"+
"2. The diagnostic **never sees the response variable**. It is computed entirely on the predictor field, so it cannot be tuned toward a desired outcome.\n"+
"3. The same gate, unchanged, was applied to the transect — where it **permitted a verdict that contradicted the author's own hypothesis.** A criterion that lets your own hypothesis be falsified is not functioning as a rationalisation.\n\n"+
"It is disclosed in the paper rather than presented as having been pre-registered.",
  trap:
"Do not claim the gate was pre-registered. It was not, it is disclosed, and the defence is about what kind of object a gate is — not about the order in which it was written."
},
{
  id:"inconclusive-vs-not-supported", group:"design", prereqs:["verdict-rule"], sourceDoc:"src/pipeline/experiment.py",
  title:"INCONCLUSIVE is not NOT SUPPORTED",
  analogy:
"A blood test that failed versus a blood test that came back clear. Only one of them tells you anything about the patient.",
  plain:
"These two verdicts look similar and mean completely different things.\n\n"+
"**NOT SUPPORTED** says: the test worked, and the hypothesis did not survive it.\n\n"+
"**INCONCLUSIVE** says: the test could not run. Something about the setup meant there was nothing to measure, so no conclusion about the hypothesis is available in either direction.\n\n"+
"Reporting a failed *test* as a failed *hypothesis* would be a serious overclaim — and the CWSF rubric's lowest band is defined by exactly that kind of exaggeration.",
  depth:
"Surrey returned INCONCLUSIVE, and the diagnosis is structural rather than a matter of sample size. Two preconditions failed independently: no model had skill on **any** candidate target (which rules out “we picked the wrong index”), and the 4 km coarsening removed only 12.3% of predictor spatial variance.\n\n"+
"The underlying reason is [[orthogonal-axes]], and the crucial corollary is that **more data cannot fix it**. The variance decomposition is a property of the ClimateBC field over Surrey, not of the sample. This was written as a prediction on a 114-corridor panel and then confirmed: adding the remaining 39 corridors (+34% of rows) moved every point estimate slightly and changed nothing structural.\n\n"+
"So the Surrey finding is methodological: *scale-free climate downscaling cannot be validated at intra-urban scale, because the spatial climate gradient within a municipality is far smaller than the interannual variation, and smaller still than the spatial variation in the response being predicted.* That is a genuine, useful negative result — and it is what motivated the transect."
},
{
  id:"orthogonal-axes", group:"design", prereqs:["cdei","climate-vars"], sourceDoc:"docs/PHASE3_FINDINGS.md",
  title:"Orthogonal axes — why Surrey could not answer the question",
  analogy:
"Predicting which houses on a street are cold using this week's national forecast. The forecast is excellent and it changes constantly — but it says the same thing for every house on the street, and the differences between houses are exactly what you were asked about.",
  plain:
"Over Surrey the climate varies mostly **from year to year**, and hardly at all from corridor to corridor — a 30 km flat delta simply does not have much internal climate gradient. But corridor water stress varies mostly **from corridor to corridor**, and much less from year to year.\n\n"+
"So the predictor varies along one axis and the target along a different one. They are, in the loose sense, orthogonal. Spatially-blocked cross-validation asks the model to rank corridors it has never seen — which is precisely the axis along which the climate is nearly constant.\n\n"+
"The hypothesis contained a hidden premise: that meaningful climate variation exists *between* corridors to resolve. At municipal scale that premise is simply false.",
  depth:
"Predictors, between-year sd against between-corridor sd: CMD_sm 77.53 vs 7.63 (**10.2× temporal**), PPT_sm 73.04 vs 11.60 (6.3× temporal), and every other summer variable 2.3–2.7× temporal.\n\n"+
"Targets, same comparison: ndvi_mean 0.0127 vs 0.1194 (**9.4× spatial**), CDEI 0.0031 vs 0.0126 (**4.1× spatial**), lst_mean 2.8× spatial.\n\n"+
"The transect is the **exact inverse**, which is what makes it the right second extent: CDEI there varies **122× more between stands than between years** (sd 0.0241 vs 0.0022). There is a strong spatial signal to predict. The climate gradient simply does not align with it — |ρ| ≤ 0.15 against CMD, Tmax, Eref and elevation, n = 300.\n\n"+
"Perret et al. (2024) is the citation: a species' spatial climate response does not predict its temporal response. This is the space-for-time failure at the centre of the diagnosis.",
  figure:"../../figures/board/transect_profile.png",
  figureAlt:"Elevation of 300 transect stands against Surrey's own range",
  figureCaption:"Why the second extent exists: 4–1,920 m across 100 km, against Surrey's −1 to 116 m."
},
{
  id:"leakage-discipline", group:"design", prereqs:["model-a-vs-b"], sourceDoc:"src/pipeline/assemble.py",
  title:"Leakage discipline in the predictor set",
  plain:
"For the A-versus-B test to mean anything, the only thing separating the two models must be climate resolution. That means being ruthless about what is allowed into the predictor set.\n\n"+
"Two exclusions are load-bearing, and both are the kind of thing that would quietly invalidate the experiment if missed.",
  depth:
"**Elevation is excluded from `CLIMATE_ONLY`.** This one is counter-intuitive, because elevation obviously predicts water stress. But elevation is a DEM *input* to ClimateBC's downscaling, not a climate variable. Including it would let Model A win on terrain rather than on climate — and terrain is exactly what the coarsening does not blur, so A would win for a reason that has nothing to do with the hypothesis.\n\n"+
"**RLST is quarantined into a separate `RS_AUGMENTED` group.** An RS-derived predictor against an RS-derived target confounds the resolution question with shared measurement structure.\n\n"+
"Related but distinct is [[circularity-exclusion]] in the explanatory analysis.",
  trap:
"“Why didn't you include elevation, it's obviously predictive?” is a good judge question with a precise answer: because it is the downscaling's input, and including it converts a climate-resolution test into a terrain test."
},
{
  id:"circularity-exclusion", group:"design", prereqs:["cdei"], sourceDoc:"src/pipeline/explain.py",
  title:"Circularity — you cannot predict CDEI from its own ingredients",
  plain:
"When the question turned to “if not climate, what *does* drive water stress?”, the tempting predictors were NDVI, SWCI and LST — they are already computed, and they obviously correlate with the target.\n\n"+
"They are barred, because CDEI is **built from** them. Predicting an index from its own inputs is not a discovery, it is arithmetic wearing a lab coat, and it would have produced an impressive R² that meant nothing.",
  depth:
"The explanatory analysis therefore compares only predictor families that are independent of the imagery: climate (14 features), terrain (5), and VRI stand structure (24).\n\n"+
"| family | n | CV R² | folds R² > 0 |\n|---|---|---|---|\n| climate | 14 | −0.138 | 40% |\n| terrain | 5 | −0.085 | 44% |\n| stand structure | 24 | +0.004 | 68% |\n| **terrain + structure** | 29 | **+0.029** | **80%** |\n| + climate | 43 | +0.020 | 60% |\n\n"+
"Terrain plus structure is the only family that crosses into positive skill. **Adding climate on top makes it worse** (+0.029 → +0.020), which is independent confirmation that the climate gradient is noise for this target.\n\n"+
"Honesty flag carried in the findings document: the explanatory signal is weak in absolute terms, around R² +0.03–0.04. It is a *directional* result — the driver is local — not a usable predictive model."
},
{
  id:"maup", group:"design", prereqs:["zonal-stats"], sourceDoc:"docs/preprint/CITATION_TARGETS.md",
  title:"The Modifiable Areal Unit Problem",
  analogy:
"Election results change when you redraw the constituency boundaries, without a single vote changing.",
  plain:
"Statistical results computed on aggregated spatial units depend on how you drew the units. Redraw the boundaries — bigger, smaller, shifted, differently shaped — and the correlations change, sometimes dramatically, without anything in the world having changed.\n\n"+
"It is a genuine, unavoidable feature of any analysis on polygons or grid cells, which is to say: of this entire project.",
  depth:
"Openshaw (1984) is the citation. The coach brief asks specifically for a **one-sentence definition with no acronym**, so have one ready.\n\n"+
"It shows up here in at least three places. The verdict label depends on the coarse **cell size** (4 vs 12 vs 25 km). The cell **anchoring** matters, which is why §2.5 specifies `⌊x/c⌋, ⌊y/c⌋` against the EPSG:26910 origin and notes that a half-cell shift would change the partition. And the two extents use different analysis units entirely — corridors of 39.7 m effective width against stands of 94.8 m — which is Limitations item 10.\n\n"+
"The project's response is not to solve it, which is impossible, but to report results across multiple cell sizes so a reader can see how much the conclusion moves."
},
{
  id:"assumption-not-accuracy", group:"design",
  prereqs:["model-a-vs-b","negative-r2","paired-difference"],
  sourceDoc:"docs/preprint/latex/main.tex · §1.2",
  title:"Why not just build the best model?",
  analogy:
"You are asked whether premium fuel makes your car faster. You test it on the same car, same track, same driver, and the car is slow on both runs — because it is a slow car. You have still answered the question you were asked, and answered it better than someone who swapped in a faster car at the same time and can no longer say which change did what.",
  plain:
"This is the objection that lands hardest, and it is the right instinct: if Model A has an R² of −0.138 and Model B manages +0.003, both are useless. So why compare two useless models instead of going and building one that works?\n\n"+
"Three answers, and they stack.\n\n"+
"**The assumption sits upstream of any model.** §1.2 says what it does: it *“drives real decisions about what data to acquire and what to spend.”* Someone chooses whether to buy or compute a fine climate surface instead of using the coarse field they already have — and that choice is made before anyone knows whether a model will work at all. The assumption is load-bearing whether or not anything downstream succeeds.\n\n"+
"**The result is the difference, not the level.** The claim is never “Model B is good.” It is “the fine data bought nothing.” That is a subtraction, and whatever makes the problem hard subtracts out of it.\n\n"+
"**Chasing accuracy would have destroyed the test.** The moment you add whatever makes the model work, you no longer know which change did what.",
  depth:
"**Why pairing survives two bad models.** Both arms see identical folds, identical seeds, identical hyperparameters, identical target; the only difference is the spatial resolution of the predictors. So the difficulty of the problem is common to both and cancels. The reported quantity is ΔRMSE **+0.00093**, CI **[+0.00021, +0.00170]**, excluding zero in **32 of 32** seed runs — an interval that is stable precisely because it never depended on either model being good. See [[paired-difference]].\n\n"+
"**Why a tuned model would have answered a different question.** A model built for accuracy would reach for elevation, terrain and stand structure. Every one of those is barred, and for reasons specific to this experiment:\n\n"+
"- **Elevation** is ClimateBC's *input*, not a climate variable. Terrain is exactly what the coarsening does not blur, so Model A would win on terrain and the result would say nothing about climate resolution. See [[leakage-discipline]].\n"+
"- **NDVI, SWCI and LST** are what CDEI is *built from*. See [[circularity-exclusion]].\n\n"+
"A model that scored well would have scored well for reasons unrelated to the hypothesis. The experiment's power comes from the fact that exactly one thing varies.\n\n"+
"**The project did chase accuracy — in a separate analysis, on purpose.** Asking “if not climate, then what?” is a different question with a different design, and it got one: climate alone reaches CV R² **−0.138** (**40%** of folds positive), terrain **−0.085** (**44%**), stand structure **+0.004** (**68%**), terrain + structure **+0.029** (**80%**), and adding climate back on top makes it **worse**, +0.029 → **+0.020** (**60%**).\n\n"+
"So the best available model is terrain plus stand structure, it is the only family with positive skill, and climate actively degrades it. That is a real finding, and it is still weak — **R² +0.03 to +0.04**, reported as directional rather than as a usable predictor.\n\n"+
"**Where the objection retains force.** It is not fully answered, and pretending otherwise is the trap. `MIN_SKILL_R2 = 0.0` exists exactly because comparing two failures can be vacuous — that is why Surrey returned INCONCLUSIVE rather than a verdict. At the transect Model B clears the bar at **+0.0035**, which is barely; at a 12 km cell it is **−0.0027** and the label flips while the paired interval does not. See [[skill-gate]].",
  whyThisChoice:
"Framing the paper around an assumption rather than a model is what makes a negative result publishable and useful. “I could not build a good model” is a fact about one student's afternoon. “Fine climate data does not improve this prediction, and here is the paired interval” is a fact about the data product, and it transfers to anyone else deciding what to buy.",
  rejectedAlternative:
"Adding terrain and stand structure to both arms until something scored well. It would have produced a better-looking results section and an uninterpretable experiment — the two models would then differ in climate resolution *and* be dominated by predictors that resolution does not touch, so a null difference would prove nothing and a positive one would be unattributable.",
  trap:
"Do not answer this with “but the paired difference is significant” and stop. That is true and it is half the answer. The complete answer names the limit as well: at least one model has to clear the skill gate for the comparison to be admissible, Model B clears it by 0.0035, and that is thin enough to be listed as a bounded weakness rather than a closed one."
},

"Stands proved much better behaved than Surrey's corridors: coverage fraction median **1.00**, no stand below 0.5, so the thin-corridor partial-pixel problem disappears.\n\n"+
"Protected areas were evaluated as an alternative unit and **rejected** — only 11–19 polygons, ranging from 3 ha to 61,594 ha, far too few and far too heterogeneous. They are kept only as a validation subset.\n\n"+

{
  id:"elevation-transect", group:"domain", prereqs:["gin-corridors"], sourceDoc:"docs/PHASE3_FINDINGS.md",
  title:"The Fraser Valley transect — moving the test",
  plain:
"When Surrey turned out to be incapable of answering the question, the response was not to collect more Surrey data — that was shown to be futile — but to move the test somewhere the question could actually be asked.\n\n"+
"The Fraser Valley elevation transect runs 100 km inland and climbs from 4 m to 1,920 m. That is a real climate gradient in space, which is exactly what Surrey lacks.\n\n"+
"Surrey stays the application site. The transect is where the method question gets answered.",
  depth:
"Same experiment, same code, same variables, same folds — **only the study extent changes.** That is what makes the two results comparable.\n\n"+
"Surrey spans −1 to 116 m of relief across 30 km. The transect spans 4–1,920 m across 100 km and covers 2,841 km² against Surrey's 408 km² — seven times the area, though only ~15–17 usable solar days per summer across two MGRS tiles.\n\n"+
"The design was explicit that the transect had to clear **both** preconditions, not just the blurring one. Phase 3's failure was independent of the 12% contrast — no model had skill on any target. As it turned out, the contrast gate passed (48.4%) and the skill gate still failed for Model A, but now for a *diagnosable* reason: the target varies strongly in space, and the climate gradient simply does not align with it.\n\n"+
"The elevation gradient was showing up in the target before any modelling was done — stand LST spans 16.1 to 38.8 °C, against Surrey's ~3 °C standard deviation."
},

  title:"Verified metadata is not the same as having read a paper",
  plain:
"You can confirm that a citation exists, that the DOI resolves, that the authors and year and journal are right — and still have no idea what the paper actually found. That is a real failure mode, and it has already bitten this project once.\n\n"+
"The standing rule: if you cite something in an answer and cannot say what it found, that is a Red, regardless of how correct the bibliography entry is.",
  depth:
"The concrete failure: the City of Surrey study was cited for establishing a 144-corridor network. It actually reports **396 corridor segments**; the 144 come from its Appendix J. The metadata was perfect and the claim was wrong.\n\n"+
"Context on the reference list itself. A July 2026 audit found **11 scholarly citations across 31 pages**, against **72 in the 16-page Klinges et al. 2024** paper the central argument leans on — and EarthArXiv declines submissions that “lack citations to established scientific literature.” Thirteen were added, taking it to **24 scholarly citations (32 bib entries)**. Still thin, and the right move if asked is to say so.\n\n"+
"Two resolution traps worth remembering: Crossref **first hits** were the wrong record twice (Meyer & Pebesma returned an author-response stub; a search for “SoilTemp” returned a different Lembrechts commentary), so always resolve by DOI. And do not cite 10.1073/pnas.2320424121 as the space-for-time source — that is Angert's commentary; the primary study is Perret, Evans & Sax, PNAS 121(1):e2304404120."

  /* --- the CDEI index --- */
  "feature-space":[
    "**This is a well-established family of methods.** The classical version plots land surface temperature against NDVI and produces a triangle or trapezoid, with a “dry edge” along the top (hot, water-limited) and a wet edge along the bottom.",
    "**Moran (1994), Carlson & Ripley (1997) and Sandholt's TVDI (2002)** are the lineage the preprint cites.",
    "**This project inverts the picture.** It plots **SWCI against NDVI**, and because SWCI *increases* with canopy water while temperature *decreases* with it, the dry edge becomes the **lower** envelope of the cloud with a **positive** slope — rather than the upper envelope with a negative one.",
    "**That inversion is worth being able to state out loud**, because anyone who knows the classical trapezoid will read the figure with the wrong orientation in mind."
  ],
  "dry-edge":[
    "**The fit is deliberately robust rather than naive.** NDVI is divided into **12 equal-frequency (quantile) bins** — equal counts, not equal widths, so sparsely populated NDVI ranges do not get a bin of their own.",
    "**Within each bin the 5th percentile of SWCI is taken, not the minimum.** A raw minimum would chase a single outlier per bin and make the line hostage to noise.",
    "**Sparse bins are dropped**, and a least-squares line is fitted through the surviving bin points.",
    "**The fit is done across all polygon-summers at once, never per year.** That is the single most consequential choice in the index.",
    "**Why it matters:** a per-year fit would re-zero the index every summer, so a dry year and a wet year would each be measured against their own edge — and the between-year signal, the thing a drought monitor exists to detect, would be erased by construction.",
    "**It also creates the project's most serious open weakness**, because a fixed line and a drifting cloud interact badly over a long record. See [[cdei-drift]]."
  ],
  "perpendicular-distance":[
    "**If the dry edge is `SWCI = a + b·NDVI`**, the vertical gap for an observation is `SWCI_obs − (a + b·NDVI_obs)`, and the perpendicular distance is that gap divided by `√(1 + b²)`.",
    "**The sign convention is fixed and matters everywhere downstream.** `dry_dist` is **positive on the wet side**, above the line.",
    "**So low CDEI means more stressed**, and the corridor ranking is ascending CDEI expressed as a stress percentile where 100 is the most stressed.",
    "**That geometry also gives the drift diagnostic its analytic prediction.** A shift in the panel's mean NDVI and SWCI translates into a shift in `dry_dist` of `(Δswci − b·Δndvi) / √(1 + b²)` — which is how the drift was confirmed to be geometry rather than sensor: predicted **0.0065**, observed **0.0077**."
  ],
  "rlst":[
    "**Celsius has an arbitrary zero**, so a “ratio” of 21 °C to 20 °C (1.05) and of 294 K to 293 K (1.003) are different numbers describing the same physical change. Only the Kelvin version is meaningful.",
    "**The cost of doing it correctly is real and is reported rather than hidden.** Because summer surface temperatures in Kelvin all sit near 290–310, the ratio barely moves — RLST is a gentle modulation by construction.",
    "**How gentle is the point. CDEI correlates with `dry_dist` alone at ρ = +0.99997.** The thermal term carries essentially no between-polygon information at all.",
    "**That is Limitations item 3**, and after an outside review it was moved forward to §2.2 — the point where RLST is defined — rather than being disclosed only after the maps that depend on it."
  ],
  "cdei":[
    "**`CDEI = dry_dist / RLST`**, one value per polygon per summer.",
    "**The name has a history worth knowing.** It was called **TVWSI** in earlier drafts until an audit found that name belongs to Joshi et al. (2021), *Remote Sensing* 13(22):4635. It was renamed to CDEI.",
    "**The dataframe column is still `tvwsi`**, because the cached panels were built under the old name and renaming the field would invalidate them. `tvwsi` the column and CDEI the index are the same quantity.",
    "**Panel sizes: 612 rows over Surrey** (153 polygons × 4 summers, 2022–2025) **and 1,200 rows over the transect** (300 VRI stands × 4 summers).",
    "**The extended Surrey record reaches 1,377 polygon-summers** across nine summers, 2017–2025."
  ],
  "frozen-reference":[
    "**Both the dry edge and the RLST baseline are properties of the panel they were fitted on.**",
    "**A naive extension from four summers to nine moved every already-published CDEI value** by a median of **8.1% of a standard deviation**, and shifted the dry-edge coefficients printed in the paper and in Figure 1.",
    "**Frozen mode reproduces the canonical years bit-exactly** — a difference of **0.000e+00** on all six derived columns — asserted as a check before anything downstream is compared.",
    "**Conceptually this is the stronger claim.** Applying a fixed index to new summers is an **out-of-sample application**; refitting and re-reporting is a new description of a new dataset."
  ],
  "cdei-drift":[
    "**The numbers make the mechanism unusually clear.** Between the two halves of the record, mean NDVI differs by **+0.014** (p = 0.40) and mean SWCI by **−0.005** (p = 0.12). **Neither difference is statistically significant.**",
    "**Yet the dry-edge geometry converts those two non-significant shifts into a 0.51 standard deviation shift in `dry_dist`, at p = 1 × 10⁻¹⁷.**",
    "**The arithmetic checks out**: `(Δswci − b·Δndvi)/√(1+b²)` predicts **0.0065** against **0.0077** observed.",
    "**Four alternative mechanisms were ruled out by test rather than by argument**: the frozen RLST baseline (refitting it leaves the result null), the thermal term entirely (`dry_dist` alone collapses identically), a code-version difference in the imagery (2022/2023 rasters rebuilt with current code are bit-identical, **r = 1.00000**), and any significant shift in the input bands.",
    "**And part of it is still unexplained.** Within the five earlier summers the moisture correlation is not merely displaced, it is *absent*: **r = −0.04, p = 0.28**. Two dry summers, **2018 and 2021**, read as unstressed and nobody knows why."
  ],
  "canopy-confound":[
    "**The direct measurement is CDEI against NDVI, ρ = −0.347, n = 153 polygons** (reported as −0.35 in the abstract). Greener polygons read as more stressed.",
    "**At the transect the same confound measures ρ = −0.314 against stand NDVI, n = 300** — essentially the same magnitude, which is itself informative: the confound is a property of the index, not of Surrey.",
    "**But the sharper derived objection does not hold.** The claim that the central A-vs-B finding is therefore really about canopy density was tested: residualising CDEI on 24 independent VRI attributes does not weaken the result, it **strengthens** it. See [[residualisation]].",
    "**Two facts constrain the confound further**: crown closure correlates at only **+0.180**, height and age at about **0**, and land-cover class explains just **2.7%** of between-stand CDEI variance.",
    "**So the confound runs along greenness, not along stand type.**"
  ],

  /* --- climate --- */
  "climate-normal":[
    "**The intended baseline was 1971–2000.** The ClimateBC web API turned out to serve only **Normal_1961_1990**, so every anomaly in this project is taken against **1961–1990** instead.",
    "**That is a documented deviation from the plan, not a silent substitution.**",
    "**It matters because 1961–1990 is a cooler baseline than 1971–2000**, so anomalies computed against it run systematically warmer.",
    "**Since the analysis uses anomalies as predictors rather than reporting them as climate findings, a constant offset is absorbed by the model** — but the choice is disclosed rather than assumed harmless."
  ],
  "climate-anomaly":[
    "**Every climate variable enters the predictor set as a level *and* as an anomaly**, with one exception: solar radiation gets a level but no anomaly twin, because at a single latitude it is very nearly constant between summers and the anomaly would be noise around zero.",
    "**There is a structural irony here that becomes the project's central diagnosis.** Anomalies are almost purely temporal quantities — strong between years, weak between places. Levels carry the spatial information.",
    "**Over Surrey the target varies mostly in space**, so the anomalies, which look like the more sophisticated feature, are exactly the ones with nothing to contribute. See [[orthogonal-axes]]."
  ],
  "climatebc-downscaling":[
    "**Effective resolution is roughly 375–750 m** — but the honest framing is that it is set by the **digital elevation model you feed it**, not by any property of the climate product. Give it a coarse DEM and the scale-free claim degrades accordingly.",
    "**Elevation is therefore not a convenience, it is the lever the whole method turns on.**",
    "**The DEM is Copernicus GLO-30**, fetched via Planetary Computer STAC with retry-and-backoff and a fallback to the raw AWS COG tile bucket — because a DEM failure at minute zero kills a 33-hour unattended acquisition run.",
    "**Variables fetched span annual and seasonal sets**: **CMD** (climatic moisture deficit), **Eref** (reference evaporation), **AHM** and **SHM** (annual and summer heat-moisture indices), **DD18** (degree-days above 18 °C), plus Tmax, Tmin, PPT and radiation.",
    "**Summer (`_sm`) variables are fetched first**, because they carry the water-stress hypothesis."
  ],
  "climate-vars":[
    "**These are the variables whose behaviour produces the orthogonal-axes diagnosis**, so their variance structure is worth carrying in your head.",
    "**Over Surrey, between-year sd against between-corridor sd:** CMD_sm **77.53 vs 7.63** → **10.2× more temporal than spatial**; PPT_sm **73.04 vs 11.60** → 6.3× temporal.",
    "**And the rest are all temporal too**: Tmin_sm **2.7×**, Rad_sm **2.5×**, DD18_sm **2.4×**, Eref_sm **2.3×**, Tmax_sm **2.3×**.",
    "**At the transect the leading predictors by variance lost under coarsening are Eref, Tmax and CMD**, which shed **58–68%** of their spatial variance at a 25 km cell.",
    "**The API fails silently rather than loudly.** A malformed period request returns **−9999**, or the degenerate triple **MAT = 0 / MAP = 1 / AHM = 10000**. `validate_record` rejects those before they can reach a model."
  ],
  "rate-limited-acquisition":[
    "**Four design consequences, each defensible engineering in its own right.**",
    "**A token-bucket limiter paced at 48/hour**, under the observed ceiling.",
    "**A permanent disk cache in `data/raw/climatebc/`**, so re-running is free for anything already fetched and interruption costs nothing.",
    "**Corridor-major job ordering** — all periods for corridor 1, then all for corridor 2. A partial run therefore yields a *complete* panel for the first k corridors rather than holes scattered across every corridor.",
    "**Atomic write-then-rename**, so a kill mid-write cannot leave a truncated cache entry that would be read back as valid.",
    "**`complete_panel` keeps only units that have every study year *and* the normal**, so an unbalanced panel cannot silently over-weight the well-covered corridors.",
    "**A practical note that cost real time:** the machine has to stay awake. A system sleep freezes the process and silently adds hours, which is why runs are wrapped in `caffeinate -s`."
  ],
  "bec-zone":[
    "**The 300 transect stands are sampled from 12,168 candidates**, stratified by **BEC zone × easting quintile** with **√n proportional allocation**.",
    "**Plain proportional allocation would have spent roughly 77% of the sampling budget on lowland Coastal Western Hemlock**, because that is where most of the stands are, leaving the montane band essentially unsampled — destroying the elevation gradient that was the entire reason for building a transect.",
    "**Equal allocation would have over-weighted rare zones.** The square-root rule is the standard compromise between the two."
  ],

  /* --- statistics & ML --- */
  "residual":[
    "**`residual = observed − predicted`.** Positive means the model under-predicted.",
    "**The structure of the residuals matters as much as their size.** Residuals that are large but patternless mean a noisy problem.",
    "**Residuals that are spatially clustered** — all positive in one part of the map, all negative in another — **mean the model is missing something systematic**.",
    "**They are also the signature of [[spatial-autocorrelation]]**, which is what makes naive validation dishonest for spatial problems."
  ],
  "rmse-mae":[
    "**RMSE ≥ MAE always**, and the gap between them tells you how uneven the errors are.",
    "**The headline comparisons here are RMSE differences, and they are tiny in absolute terms** because CDEI is a small-valued index: Surrey Model A **0.01393** against Model B **0.01397**; transect Model A **0.02565**, Model B **0.02472**.",
    "**Those absolute magnitudes are meaningless out of context** — CDEI has a standard deviation of about **0.0138** over Surrey.",
    "**What matters is the paired difference between two models scored on identical folds**, and whether an interval around that difference excludes zero. See [[paired-difference]].",
    "**Surrey's ΔRMSE and ΔMAE point in opposite directions** (**−0.00004** versus **+0.00018**), which is itself a sign that neither model is doing anything meaningful."
  ],
  "r-squared":[
    "**`R² = 1 − SS_res / SS_tot`**, where `SS_res` is the sum of squared residuals from the model and `SS_tot` the sum of squared deviations from the mean of the test data.",
    "**On held-out data nothing forces R² to be positive**, unlike the in-sample case in ordinary least squares.",
    "**`SS_tot` is computed on the *test fold's* mean**, so a fold whose values happen to be tightly clustered has a small denominator and can produce a badly negative R² from modest errors.",
    "**That is one reason per-fold R² varies more than per-fold RMSE.**"
  ],
  "negative-r2":[
    "**Attack surface 8 in the coach brief exists precisely because this number is easy to fumble** — and if it is fumbled the whole results section becomes indefensible.",
    "**The reading: fine-scale climate detail is not merely uninformative for stand water stress, it is anti-informative.** The forest chases spatial structure in the climate field that has no counterpart in the response, and its confident predictions are worse than a constant.",
    "**The supporting evidence is that R²_A climbs monotonically from −0.249 to −0.060** as the forest's minimum leaf size grows from 1 to 10, **while R²_B does not move**.",
    "**Constraining the learner suppresses the damage** — direct evidence that Model A's deficit is overfitting to fine-grained climate detail rather than random noise.",
    "**And the honest counterpart: Model B's +0.003 is not skill either.** Two models were compared; one of them was less bad. Neither is useful."
  ],
  "cross-validation":[
    "**The standard version splits at random, and for most machine-learning problems that is correct.**",
    "**For spatial problems it is not**, and the reason is [[spatial-autocorrelation]]. A random split scatters neighbouring locations across train and test, so the model can predict a held-out corridor by effectively looking up the corridor next door.",
    "**That is not skill, it is proximity, and it inflates the score.**",
    "**Ploton et al. (2020) is the citation** in the preprint — they show directly that random splits inflate accuracy estimates for spatial models — and it is the strongest justification for the blocked design used here.",
    "**Roberts et al. (2017) covers cross-validation for structured data more generally.**"
  ],
  "spatial-autocorrelation":[
    "**The failure mode is precise.** Under a random split, for almost every held-out corridor there is a near neighbour in the training set.",
    "**A flexible learner such as a random forest can approximate “return the value of the nearest thing I have seen,”** which scores well without having learned any relationship between predictors and response.",
    "**The score you then get is a measurement of how spatially autocorrelated your response variable is, dressed up as a measurement of your model.**",
    "**The defence is to hold out contiguous geographic blocks**, so held-out locations have no near neighbours in training.",
    "**It makes the problem harder, and the harder problem is the honest one** — it is also the one that matches how the model would actually be used, which is on corridors it has never seen."
  ],
  "blocked-cv":[
    "**Implementation: k-means clustering on projected corridor coordinates** defines the blocks, and whole blocks are held out.",
    "**Two guardrails.** The block count auto-shrinks to keep at least **8 corridors per held-out block**, because a block of two produces an unscoreable fold; and fewer than **16** corridors raises an error rather than silently producing nonsense.",
    "**Repeats re-seed the blocking itself, not just the model.** Repeating with the same partition only measures model variance; re-partitioning measures whether the result survives a different carving of the map.",
    "**The base seed is 26910**, the project's CRS."
  ],
  "grouped-folds":[
    "**The elegant part is that this falls out for free from the blocking design.** k-means runs on corridor coordinates, so each corridor gets one block assignment and all its rows inherit it — grouping is automatic rather than a second mechanism bolted on.",
    "**The obvious risk in Surrey is the seven corridors digitised as multiple polygons** — could two polygons of one corridor land in different blocks?",
    "**It was checked explicitly: zero split corridors straddled a block in any of five repeats.**",
    "**One deliberate exception:** the [[temporal-holdout]] *does* let corridors repeat across the split, because it is testing transfer through time rather than through space."
  ],
  "paired-difference":[
    "**Both models see identical `(repeat, block)` folds, identical seeds, identical hyperparameters and identical target.** The only thing that differs is the spatial resolution of the predictors.",
    "**The reported quantity is the paired ΔRMSE, positive meaning A is worse.**",
    "**Surrey: −0.00004, A better in 48% of folds** — a coin flip.",
    "**Transect at 25 km: +0.00093, A better in 40% of folds.**",
    "**Pairing is also what rescues the residualisation retest from an acknowledged leak.** The residualisation is fitted globally rather than per fold, which does leak response structure into the folds — but it leaks *identically into both arms*, and the reported quantity is the paired difference, so the comparison survives even though the absolute scores would not."
  ],
  "bootstrap-ci":[
    "**10,000 resamples of the per-fold paired differences**; the interval is the **2.5th and 97.5th** percentiles.",
    "**The alternative would be a paired t-interval**, which assumes the per-fold differences are approximately normal.",
    "**With a small number of spatially-blocked folds that assumption is not defensible**, and the bootstrap makes no such claim.",
    "**Attack surface 9 names the bootstrap specifically as something to be tested hard on** — precisely because it is a sophisticated-sounding method that is easy to name and hard to explain.",
    "**If you cannot describe resampling with replacement in your own words, naming it is a liability.**"
  ],
  "ci-excludes-zero":[
    "**Surrey: ΔRMSE −0.00004, CI [−0.00016, +0.00007]** — spans zero. No difference detectable.",
    "**Transect at 25 km: ΔRMSE +0.00093, CI [+0.00021, +0.00170]** — excludes zero. **And at 12 km: +0.00094**, also excluding zero, even though the *label* there reads INCONCLUSIVE.",
    "**Across 32 independent seed runs at both cell sizes, the interval excludes zero in 32 of 32.**",
    "**Under eight hyperparameter configurations, Model B is better on the point estimate in 8 of 8** — though the interval excludes zero in only **6 of 8**, the two exceptions being the heavily regularised settings (min leaf **5** and **10**).",
    "**The fully honest statement:** the coarse model is never worse; it is significantly better under the majority of reasonable settings including the pre-registered one; and heavy regularisation closes the gap to statistical indistinguishability."
  ],
  "random-forest":[
    "**Pre-registered settings, fixed a priori and never tuned: 400 trees, `min_samples_leaf = 3`, `max_features = sqrt`.**",
    "**The constraints are deliberate.** An unconstrained forest with leaf size **1** can memorise individual corridors, and R²_A at leaf size 1 is **−0.249**, its worst value.",
    "**Citation discipline: the preprint cites Breiman (2001) for the method and scikit-learn for the implementation.** Citing only scikit-learn — which an earlier draft did — credits the software rather than the idea, and the coach brief flags that distinction.",
    "**Gradient boosting is also available in the codebase as an alternative learner**, but the reported results use the forest."
  ],
  "permutation-importance":[
    "**This is what produced the finding that between-stand water stress is driven by local factors.**",
    "**The leading predictors, scored on held-out blocks, are leading species (bigleaf maple), stand area, aspect (eastness then northness), and broadleaf class.**",
    "**No climate variable appears anywhere in that ranking.**",
    "**Attack surface 9 names permutation importance as one of the sophisticated-sounding methods to be tested hardest on**, alongside the bootstrap and the blocking design. The in-sample versus out-of-sample distinction is the substance of it."
  ],
  "spearman":[
    "**The rho values that carry the most weight here.**",
    "**Stand-mean CDEI against the climate gradient**: CMD_sm **−0.093**, Tmax_sm **−0.139**, Eref_sm **−0.138**, elevation **+0.145** → **|ρ| ≤ 0.15, n = 300**. This near-zero result is the crux of the entire Phase 3b conclusion.",
    "**CDEI against NDVI: −0.347, n = 153** — the canopy confound.",
    "**CDEI against `dry_dist` alone: +0.99997** — the thermal term is inert between polygons.",
    "**Corridor width against CDEI: −0.038, p = 0.64** — mixed pixels checked, and they do not bite.",
    "**A near-zero rank correlation with n = 300 is a strong negative statement, not an absence of evidence**: it says the two things genuinely do not order the landscape the same way."
  ],
  "residualisation":[
    "**The retest bounds the question from both sides, with two residualisation strengths.**",
    "**Structural — the clean test.** CDEI residualised on **24 VRI attributes** (age, height, crown closure, species, land-cover class), which come from the provincial forest inventory and are therefore **independent of the imagery CDEI is built from**. They absorb **14.9%** of CDEI variance.",
    "**Result: ΔRMSE +0.00113 [+0.00049, +0.00183] at 25 km and +0.00146 [+0.00083, +0.00213] at 12 km.** Both exclude zero; both are *larger* than the unresidualised result.",
    "**Greenness — a deliberate over-correction.** Adding stand-mean NDVI absorbs **73.2%** of variance and inverts the sign — but NDVI is a **constitutive input** to `dry_dist`, not a confounder, so this removes the index rather than the confound.",
    "**Both models then fall below the mean (R²_A −0.087, R²_B −0.229) and the skill precondition fails.** It is reported as a pessimistic bound, explicitly not as the headline.",
    "**One acknowledged leak, stated openly in the script's own docstring**: the residualisation is fitted globally rather than per fold. It leaks identically into both arms and the reported quantity is the paired difference, which is why it is defensible."
  ],
  "mahalanobis-novelty":[
    "**The subtle and consequential choice: the covariance used for scaling is that of the departures (`x − x_normal`), not the spatial covariance of the normals themselves.**",
    "**Over a flat 30 km delta the climate normals barely vary between corridors**, so their covariance matrix is near-singular.",
    "**Scaling by it inflated distances by roughly an order of magnitude and, worse, ranked *unusual place* rather than *unusual climate*.** Correcting it moved the median novelty from **14.3 to 1.87** (p95 **3.21**).",
    "**A ridge scaled to `1e-6 × trace(cov)` is added before pseudo-inversion**, because ClimateBC variables remain strongly collinear even after differencing.",
    "**Novelty is then used to stratify out-of-fold error into terciles**, which locates where the model is extrapolating rather than interpolating."
  ],
  "seed-sensitivity":[
    "**At 12 km, across 12 seeds:** R²_B **−0.0027 ± 0.0010**, positive in **0 / 12**, paired ΔRMSE **+0.00094**, CI excludes zero in **12 / 12**.",
    "**At 25 km, across 20 seeds:** R²_B **+0.0033 ± 0.0005**, positive in **20 / 20**, paired ΔRMSE **+0.00093**, CI excludes zero in **20 / 20**.",
    "**The verdict label is a deterministic function of cell size, not a lucky draw** — negative in all twelve runs at 12 km, positive in all twenty at 25 km.",
    "**The paired difference excludes zero in 32 of 32 runs** across both cell sizes.",
    "**What this does not rescue: +0.003 is a stable measurement, not a meaningful amount of skill.**"
  ],
  "within-unit-demeaning":[
    "**This is what separates the honest temporal claim from the flattering one.**",
    "**Across the four summer means (n = 4)** CDEI correlates with moisture deficit at **−0.68** and precipitation at **+0.72**.",
    "**Computed within polygons (n = 612)** the same relationships hold in the same directions but are much weaker: **−0.31** and **+0.32**.",
    "**Both are reported, always with their n.** A correlation on four points establishes a **sign**, not a magnitude — which is why the deliverable README calls the temporal result a *direction check* rather than a validation.",
    "**Over the extended nine-summer record**: network-wide **+0.070**, within-polygon **+0.049**, and within the five earlier summers the relationship is *absent* at **r = −0.04, p = 0.28**."
  ],
  "temporal-holdout":[
    "**Stripping each corridor's own mean from CDEI to isolate the temporal axis appears to produce genuine skill**, with a physically sensible sign: spatial CV R² of **+0.051** against **−0.042** for the level, and the four summer means correlating with moisture deficit at **−0.677**.",
    "**It is memorisation.** Spatial CV holds out *corridors*, not *years*, so all four summers are present in training and the model can simply learn four year-means and apply them.",
    "**The forward holdout cannot be cheated that way, and it is brutal**: train on <2025, test on 2025 gives **R² = −1.673** for the anomaly target, against **−0.041** for the level.",
    "**Do not cite the +0.051.** With four summers there is no defensible temporal claim — four points is not a time series.",
    "**Corridors deliberately do repeat across this split**, unlike in the spatial folds, because the thing being tested is transfer through time."
  ],
  "circular-stats-aspect":[
    "**Aspect is stored as northness and eastness** — the cosine and sine unit-vector components. A polygon mean of raw degrees is meaningless for anything crossing 0°/360°.",
    "**It matters here because aspect turned out to be one of the leading real drivers of between-stand water stress**: a south-facing slope in the Fraser Valley receives substantially more afternoon sun than a north-facing one at the same elevation.",
    "**Eastness and northness both appear in the permutation-importance ranking.**",
    "**Two related terrain derivations in the same module**: ruggedness is the within-stand standard deviation of elevation, and slope comes from `np.gradient` with `north = −d/drow`, because raster rows increase southward."
  ],

  /* --- experimental design --- */
  "model-a-vs-b":[
    "**The hypothesis under test:** scale-free downscaled climate (~**375–750 m**) predicts corridor water stress better than coarse grid-based climate.",
    "**The falsifying result** is the coarse model performing as well or better, with a paired interval excluding zero.",
    "**Surrey, 4 km cell:** A RMSE **0.01393** (R² **−0.042**), B **0.01397** (R² **−0.051**), ΔRMSE **−0.00004**, CI **[−0.00016, +0.00007]** → **INCONCLUSIVE**.",
    "**Transect, 25 km cell:** A RMSE **0.02565** (R² **−0.138**), B **0.02472** (R² **+0.003**), ΔRMSE **+0.00093**, CI **[+0.00021, +0.00170]** → **FALSIFIED**.",
    "**25 km is chosen as a faithful stand-in** for the grid resolution of the regional climate models the hypothesis set out to beat."
  ],
  "degrade-not-substitute":[
    "**This is the central design decision of the entire project, and it is attack surface 7.**",
    "**The concession it forces is real and must be volunteered: Model B is not a real climate model.** No regional climate model was run. It is a synthetic spatial degradation of ClimateBC, standing in for one.",
    "**The defence is that the alternative is strictly worse.** A real RCM comparison would confound *which dataset* with *what resolution*, and the confound would be unresolvable with the data available.",
    "**A synthetic degradation answers a narrower question cleanly rather than a broader question uninterpretably.**",
    "**It has a second virtue.** Because the upscale averages within `(cell, year)`, the temporal signal is preserved exactly, so the two models are **identical by construction** on a purely temporal target — the guarantee that only spatial detail is being tested."
  ],
  "upscaling":[
    "**Cells are anchored to the EPSG:26910 origin at `⌊x/c⌋, ⌊y/c⌋`.** That anchoring is specified in the methods because a half-cell shift would change which units fall together and therefore change the partition — an outside reviewer raised exactly this, and §2.5 now states it.",
    "**Surrey cell sizes and resulting geometry:** 4 km → **25 cells**, 8 km → **12**, 12 km → **6**, 20 km → **4**, 30 km → **3**.",
    "**Transect:** 4 km → **101 cells**, 8 km → **40**, 12 km → **23**, 25 km → **10**.",
    "**There is a squeeze here.** Bigger cells destroy more spatial variance, which is what you want — but they also leave fewer cells, and below about **8** cells there is not enough geographic spread left to spatially block Model B.",
    "**Surrey needs ~20 km cells for meaningful contrast and has only 4 cells at that size. There is no escape inside Surrey.**"
  ],
  "contrast-gate":[
    "**`MIN_CONTRAST_FRAC = 0.30`**, measured by `upscaling_diagnostics()`.",
