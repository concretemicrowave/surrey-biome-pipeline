/* ================= TIER 1 — can I explain it? ================= */
{id:"q1-01", tier:1, prompt:"What is your hypothesis, and what result would have proved you wrong?",
 modelAnswer:
"The hypothesis was that scale-free downscaled climate data — ClimateBC, effective resolution roughly 375 to 750 metres — predicts corridor-scale water stress better than coarse grid-based climate.\n\n"+
"It would be falsified if a coarse model did as well or better, with a paired confidence interval on the difference that excludes zero. That is exactly what happened at the Fraser Valley transect at a 25 kilometre cell.",
 rubric:["Named the actual comparison: fine versus coarse climate, everything else held constant",
   "Stated a falsifying condition BEFORE stating the result",
   "Used 'interval excludes zero' rather than a bare verdict word"],
 followUps:[{q:"Why is stating the falsifying condition first important?", a:"Because a hypothesis you cannot describe a failure for is not a hypothesis. It also shows the test was designed to be able to fail."},
   {q:"Did it fail at both extents?", a:"No. Over Surrey the test was INCONCLUSIVE — it could not run. Only the transect produced a verdict."}],
 conceptIds:["model-a-vs-b","ci-excludes-zero"]},

{id:"q1-02", tier:1, prompt:"Why does a city care about this? Give the practical version.",
 modelAnswer:
"Surrey manages a Green Infrastructure Network of 144 vegetated corridors that connect habitat across the city, and its Ecosystem Management Study commits it to finding impaired corridors so a limited restoration budget goes where it matters.\n\n"+
"Finer climate data costs money. If it does not improve the prediction, that is a budget decision the City can act on immediately — and my result says resolution is the wrong lever.",
 rubric:["Named the City's own stated need, not a generic climate-change motivation",
   "Connected the research question to a spending decision",
   "Did not overclaim the deliverable's usefulness"],
 followUps:[{q:"If resolution is the wrong lever, what is the right one?", a:"Measuring stress directly from free satellite imagery, and understanding that the drivers are local — terrain aspect and stand composition."}],
 conceptIds:["gin-corridors","contrast-gate"]},

{id:"q1-03", tier:1, prompt:"Explain what CDEI is to someone who has never heard of a satellite index.",
 modelAnswer:
"Take two measurements from free satellite imagery: how green a patch of vegetation is, and how much water is in its leaves. Plot every corridor in every summer on a graph of one against the other, and you get a cloud of points with a clear lower boundary — for any given greenness, there is a driest that vegetation gets.\n\n"+
"CDEI is how far a corridor sits above that boundary, adjusted slightly for how warm it is running compared to its own normal. Close to the boundary means little water margin for how green it is. Far above means comfortable.\n\n"+
"It is a relative index, not a measurement of soil moisture.",
 rubric:["Explained the feature space without jargon",
   "Made clear it is a DISTANCE, and relative",
   "Volunteered that it does not measure soil moisture"],
 followUps:[{q:"Why 'adjusted for warmth'?", a:"Transpiration cools, so a canopy running hot relative to its own normal is plausibly water-limited. In practice the thermal term contributes almost nothing between polygons — ρ = +0.99997 with dry_dist alone."},
   {q:"Why relative and not absolute?", a:"Because it is calibrated against the observed panel, not against any ground truth. There is no field measurement behind it at either extent."}],
 neverSay:["that CDEI measures soil moisture"],
 conceptIds:["cdei","dry-edge","rlst"]},

{id:"q1-04", tier:1, prompt:"Why did you build Model B by blurring Model A instead of using a real coarse climate product?",
 modelAnswer:
"Because two different climate products differ in many ways at once — source stations, interpolation method, reference period, bias correction. If one won, I could not say whether it won because of its resolution or because of everything else about it.\n\n"+
"Deriving the coarse model by averaging the fine one into cells holds all of that constant. Resolution becomes the only variable.\n\n"+
"The cost is that Model B is not a real climate model, and I say so. I did not run a regional climate model.",
 rubric:["Named the confound explicitly: dataset versus resolution",
   "Conceded that Model B is synthetic, unprompted",
   "Argued the narrower clean question beats the broader uninterpretable one"],
 followUps:[{q:"So your result says nothing about real regional climate models?", a:"It says the fine-scale spatial detail in ClimateBC does not help. Whether a specific RCM would behave the same is not something this design can tell you."},
   {q:"Is there a second benefit to the degradation design?", a:"Yes. The upscale averages within (cell, year), so the temporal signal is preserved exactly and the two models are identical by construction on a purely temporal target. Only spatial detail is being tested."}],
 conceptIds:["degrade-not-substitute","upscaling"]},

{id:"q1-05", tier:1, prompt:"What is spatially-blocked cross-validation, and why not just split randomly?",
 modelAnswer:
"Things near each other tend to be alike — shared soil, weather, species, management. If you split at random, almost every held-out corridor has a neighbour in the training set, so the model can score well by effectively looking up the corridor next door. That is proximity, not skill.\n\n"+
"Blocked CV holds out whole geographic clusters, so held-out corridors have no near neighbours in training. It produces much lower scores, and those are the true ones.",
 rubric:["Named spatial autocorrelation as the mechanism",
   "Explained WHY a random split inflates, not just that it does",
   "Noted the honest scores are lower"],
 followUps:[{q:"Is there a citation for that?", a:"Ploton et al. 2020 show directly that random splits inflate accuracy estimates for spatial models. Roberts et al. 2017 covers CV for structured data more broadly."},
   {q:"Isn't that just making your problem artificially hard?", a:"The handicap is the point — the intended use is prediction on corridors never seen before, so validation that permits neighbour lookup measures the wrong thing."}],
 conceptIds:["blocked-cv","spatial-autocorrelation"]},

{id:"q1-06", tier:1, surface:1, prompt:"How do you know your corridor stress map is actually measuring water stress?",
 modelAnswer:
"I do not, between corridors, and that is the headline limitation.\n\n"+
"I checked it against Sentinel-1 radar — a completely different sensor, active microwave rather than passive optical. The radar's vegetation-condition indices showed no relationship to my ranking in any of the four summers. The only radar signal that did correlate turned out to be tracking canopy density.\n\n"+
"So the map may substantially be a vegetation-density map. I found that myself, and I demoted the deliverable to exploratory and labelled every figure accordingly.",
 rubric:["Said 'I do not know' about the between-corridor axis, without being pushed",
   "Explained why radar is a legitimate independent check (different physics)",
   "Stated the consequence: demoted to exploratory"],
 followUps:[{q:"Did anything survive?", a:"The temporal behaviour — the index moves in the physically correct direction with independent moisture data. But that is a direction check on four summers, not a validation, and extending it failed."},
   {q:"Why not just remove the map from the paper?", a:"An outside reviewer argued exactly that, in three separate rounds. It is a judgment call I have kept, with unusually prominent warnings — but it is a fair criticism and I do not dismiss it."}],
 neverSay:["that the corridor stress ranking is validated"],
 conceptIds:["canopy-confound","rvi-crossratio"]},

{id:"q1-07", tier:1, prompt:"Why couldn't you answer the question over Surrey?",
 modelAnswer:
"Because the climate barely varies across a flat 30 kilometre municipality. Coarsening it removed only about 12% of its spatial detail, so Model A and Model B stayed correlated at around 0.998 — they were nearly the same model, and finding no difference between two nearly identical models is arithmetic, not evidence.\n\n"+
"Underneath that is a deeper mismatch: over Surrey the climate varies mostly between years, while water stress varies mostly between corridors. The predictor and the target vary along different directions, so a resolution hypothesis has nothing to bite on.",
 rubric:["Gave the contrast-gate reason (only 12% removed)",
   "Gave the orthogonality reason as the underlying cause",
   "Called it INCONCLUSIVE rather than a null result"],
 followUps:[{q:"Would more corridors have helped?", a:"No. The variance structure is a property of the ClimateBC field over Surrey, not of the sample. That was written as a prediction on 114 corridors and confirmed when the remaining 39 changed nothing structural."},
   {q:"So what did Surrey give you?", a:"The methodological contribution — that a resolution hypothesis can be untestable in a way that looks exactly like a null result, and that this is measurable in advance."}],
 neverSay:["that Surrey showed fine climate data does not help"],
 conceptIds:["orthogonal-axes","contrast-gate","inconclusive-vs-not-supported"]},

{id:"q1-08", tier:1, prompt:"What actually drives water stress, if not the climate gradient?",
 modelAnswer:
"Local terrain and forest composition. Under the same blocked cross-validation, a model using slope, aspect and ruggedness together with stand attributes — species, age, height, crown closure, area — is the only family that crosses into positive skill, and it is positive in 80% of folds.\n\n"+
"Adding climate on top of it makes it worse. The leading individual predictors are leading species, stand area and aspect. No climate variable appears.\n\n"+
"The signal is weak in absolute terms. It is a directional result, not a predictive model.",
 rubric:["Named terrain and stand structure specifically",
   "Noted that adding climate makes it worse",
   "Volunteered that the absolute skill is weak"],
 followUps:[{q:"Why does aspect matter physically?", a:"A south-facing slope in the Fraser Valley receives substantially more afternoon sun than a north-facing one at the same elevation, so it dries harder."},
   {q:"What is not in your feature set?", a:"Soil depth, rooting depth, groundwater, irrigation and management. Most between-stand variance remains unexplained by anything I measured."}],
 conceptIds:["circularity-exclusion","permutation-importance"]},

{id:"q1-09", tier:1, prompt:"You found a bug in your own earlier work. Tell me about it.",
 modelAnswer:
"Phase 2 reported that NDVI saturated above 0.9 in 87% of corridors, and I treated it as a finding about dense urban canopy.\n\n"+
"It was a bug. Sentinel-2 stores reflectance on a 1000 DN pedestal, because atmospheric correction can produce slightly negative values over dark water and the format cannot hold negatives. You subtract that pedestal once to recover the real value — and the provider's metadata claimed it had not yet been subtracted when for some scenes it already had. Subtracting again drove red, the smallest band over forest, below zero; clipping pinned it at zero; and NDVI with red at zero reduces to NIR over NIR, which is exactly 1.0 by arithmetic.\n\n"+
"The tell was that 69% of pixels sat at exactly 1.000. A physical process does not pile up on a bound to five decimal places. I retracted the claim, and the offset is now measured from each scene's dark pixels rather than trusted.",
 rubric:["Described the mechanism, not just that there was an error",
   "Named the forensic tell (exactly 1.000)",
   "Stated the systemic fix, not just the patch"],
 followUps:[{q:"How do you measure the offset now?", a:"The 1st percentile of valid cloud-masked red in raw DN — dark targets like the Fraser River and Boundary Bay — against an 800 DN threshold. Scenes already corrected read 44 to 178; uncorrected ones read near 1000."},
   {q:"Did that change your conclusions?", a:"It changed the input values, not the rationale for the index. The saturation claim is withdrawn and must not be cited."}],
 conceptIds:["boa-offset","ndvi-saturation-artifact"]},

{id:"q1-10", tier:1, prompt:"What is the contribution here that outlives the specific result?",
 modelAnswer:
"That a resolution hypothesis can be untestable in a way that looks exactly like a null result — and that you can measure this in advance, before you run any model.\n\n"+
"The procedure is: coarsen your predictors, measure what fraction of their spatial variance you destroyed, and if it is small, stop. Your fine and coarse models are the same model, and any null between them is arithmetic.\n\n"+
"That generalises to any comparison of climate resolutions, in any region, for any response variable. It matters more than my falsification, which is one valley, one product, one learner.",
 rubric:["Stated the procedure generally, not as a Surrey fact",
   "Explained why a small contrast makes a null meaningless",
   "Bounded the falsification's generality unprompted"],
 followUps:[{q:"Is that novel?", a:"I have not found it stated as a precondition elsewhere, but I would not claim priority. Klinges et al. 2024 is the closest analogue in spirit — proximity beats resolution."}],
 conceptIds:["contrast-gate","inconclusive-vs-not-supported"]},

{id:"q1-11", tier:1, prompt:"Why are there two different units — 144 corridors and 153 polygons?",
 modelAnswer:
"Seven of the City's corridors are digitised as two to four separate pieces, so 153 polygons carry 144 corridor identifiers.\n\n"+
"I keep both deliberately. The polygon is the modelling unit — it has its own pixels, its own data-completeness fraction, and it is what cross-validation holds out. The corridor is the reporting unit — it is what the City manages and budgets for. Corridor values are area-weighted means of their polygons.",
 rubric:["Explained why the two numbers differ",
   "Assigned each unit to its job",
   "Mentioned area weighting"],
 followUps:[{q:"Doesn't splitting a corridor across folds leak information?", a:"It would. I checked: zero split corridors straddled a block in any of five repeats, so the published results stand."},
   {q:"There was an identifier error here too, wasn't there?", a:"Yes. Everything before 29 July 2026 used the ArcGIS row number rather than the City's corridor id, so 'corridor 73' named the wrong thing. Settled by cross-tabulating against Appendix J: 95.8–99.3% agreement on id, 33.8% on objectid."}],
 conceptIds:["modelling-vs-reporting-unit","gin-id-vs-objectid"]},

{id:"q1-12", tier:1, prompt:"Why did you move the study to a mountain transect?",
 modelAnswer:
"Because Surrey could not create the contrast the experiment needed, and that was structural rather than a sample-size problem — a flat 30 kilometre delta does not contain a spatial climate gradient to resolve.\n\n"+
"The Fraser Valley transect climbs from 4 to 1,920 metres over 100 kilometres. That is a real spatial climate gradient. Surrey stays the application site; the transect is where the method question can actually be asked.",
 rubric:["Framed the move as a design fix, not as shopping for a result",
   "Gave the elevation range",
   "Kept the application/method distinction clear"],
 followUps:[{q:"Isn't moving the study area until you get a verdict a bit convenient?", a:"The criterion for moving was declared on the predictor field, which never sees the response. And the transect falsified my own hypothesis, which is not what a convenient move produces."},
   {q:"Did the transect clear both preconditions?", a:"Only one. Contrast passed at 48.4%. The skill gate still failed for Model A — but now for a diagnosable reason rather than a structural one."}],
 conceptIds:["elevation-transect","contrast-gate"]},

/* ================= TIER 2 — do I know my own data? ================= */
{id:"q2-01", tier:2, prompt:"What is the paired difference at 25 km, and why does the interval matter more than the label?",
 modelAnswer:
"Paired ΔRMSE is +0.00093 with a 95% confidence interval of [+0.00021, +0.00170]. Positive means Model A — the fine one — is worse.\n\n"+
"The interval matters more because the verdict label depends on a skill gate set at exactly zero, and my own results land on opposite sides of it at two defensible cell sizes: FALSIFIED at 25 km, INCONCLUSIVE at 12 km. The label flips. The paired interval does not — it excludes zero in 32 of 32 runs across both cell sizes.",
 rubric:["Gave both the point estimate and the interval",
   "Stated which direction positive means",
   "Contrasted label fragility against interval robustness, with 32/32"],
 followUps:[{q:"So is the hypothesis falsified or not?", a:"At 25 km with the pre-registered settings, yes. The claim I actually defend is the paired one: the coarse model is never worse and is significantly better under most reasonable settings."},
   {q:"What weakens even that?", a:"Hyperparameter sensitivity. Model B wins on the point estimate in 8 of 8 configurations, but the interval excludes zero in only 6 of 8 — heavy regularisation closes the gap."}],
 conceptIds:["ci-excludes-zero","skill-gate"]},

{id:"q2-02", tier:2, prompt:"Give me the Surrey numbers, and tell me what they mean.",
 modelAnswer:
"Model A: RMSE 0.01393, R² −0.042. Model B at a 4 kilometre cell: RMSE 0.01397, R² −0.051. Paired ΔRMSE −0.00004, confidence interval [−0.00016, +0.00007].\n\n"+
"What they mean: both models are worse than predicting the mean, and the interval spans zero so there is no detectable difference between them. It is not evidence that resolution does not help — it is evidence the test could not run. The verdict is INCONCLUSIVE.",
 rubric:["Both RMSEs and both R² values",
   "Interval spans zero, stated explicitly",
   "INCONCLUSIVE distinguished from a null result"],
 followUps:[{q:"Why is the R² negative?", a:"On held-out data nothing forces it positive. Negative means worse than always predicting the mean."},
   {q:"ΔRMSE and ΔMAE point in opposite directions here. Does that bother you?", a:"It confirms the reading. ΔMAE is +0.00018 favouring B while ΔRMSE is −0.00004 favouring A. Two summaries of the same residuals disagreeing on sign is what a genuine null looks like."}],
 conceptIds:["model-a-vs-b","inconclusive-vs-not-supported"]},

{id:"q2-03", tier:2, prompt:"How much spatial variance does the coarsening remove, at each extent, and what is the threshold?",
 modelAnswer:
"Surrey at 4 kilometres: 12.3%. The transect at 25 kilometres: 48.4%, with the leading predictors — Eref, Tmax and CMD — losing 58 to 68%.\n\n"+
"The gate is 30%. Below it no verdict is issued, because the fine and coarse models are too similar for a difference between them to mean anything. Over Surrey they stayed correlated at a median of 0.998.",
 rubric:["Both percentages",
   "The 30% threshold",
   "Explained what failing the gate implies"],
 followUps:[{q:"Could Surrey have reached 30% with bigger cells?", a:"It reaches 39.6% at 20 km — but that leaves only 4 cells across the whole study area, too few to spatially block Model B. There is no escape inside Surrey."},
   {q:"What is the general form of this rule?", a:"Measure the fraction of predictor spatial variance the coarsening destroys before comparing climate resolutions."}],
 conceptIds:["contrast-gate","upscaling"]},

{id:"q2-04", tier:2, surface:1, prompt:"Quantify the canopy-density confound at both extents.",
 modelAnswer:
"Over Surrey, CDEI against NDVI is ρ = −0.347 across 153 polygons — greener polygons read as more stressed. At the transect the same relationship is ρ = −0.314 across 300 stands, essentially the same magnitude.\n\n"+
"The independent radar evidence: VH backscatter tracks NDVI at about +0.55, and VH is the only radar quantity that correlates with my ranking. The vegetation-condition radar indices are flat null, |ρ| ≤ 0.084 in all four summers.",
 rubric:["Both correlations with their sample sizes",
   "Noted the two extents give nearly the same value",
   "Gave the radar evidence, including the flat-null indices"],
 followUps:[{q:"Is the confound about stand type or about greenness?", a:"Greenness. Crown closure correlates at only +0.180, height and age near zero, and land-cover class explains just 2.7% of between-stand CDEI variance."},
   {q:"Does the confound sink your central A-versus-B finding?", a:"No — that was tested. Residualising CDEI on 24 independent VRI attributes strengthens the result rather than weakening it: ΔRMSE rises to +0.00113 at 25 km, interval still excluding zero."}],
 conceptIds:["canopy-confound","residualisation"]},

{id:"q2-05", tier:2, surface:2, prompt:"What happened when you extended the record to nine summers?",
 modelAnswer:
"The four-summer relationship did not reproduce. Network-wide correlation moved from −0.68 to +0.070, and within polygons to +0.049, across 1,377 polygon-summers.\n\n"+
"I diagnosed the cause and it is the frozen dry edge. Between the two halves of the record NDVI differs by +0.014 and SWCI by −0.005, neither statistically significant — yet the dry-edge geometry converts that into a 0.51 standard deviation shift in the index at p = 1e-17. The geometry predicts 0.0065 and I observed 0.0077.\n\n"+
"So CDEI drifts with the panel's own greenness, and over a long record that drift is comparable to the whole climate signal.",
 rubric:["Gave the before and after correlations with n",
   "Named the frozen dry edge as the mechanism",
   "Gave the non-significant input shifts against the significant index shift",
   "Did not claim the extension confirmed anything"],
 followUps:[{q:"What did you rule out?", a:"The frozen RLST baseline, the thermal term entirely, a code-version difference in the imagery — 2022/2023 rasters rebuilt with current code are bit-identical at r = 1.00000 — and any significant shift in the input bands. By test, not by argument."},
   {q:"Is it fully explained?", a:"No. Within the five earlier summers the moisture correlation is absent rather than displaced — r = −0.04, p = 0.28. Two dry summers, 2018 and 2021, read as unstressed and I do not know why."}],
 neverSay:["that the nine-summer extension confirmed anything — it is a diagnostic, not a result"],
 conceptIds:["cdei-drift","frozen-reference"]},

{id:"q2-06", tier:2, prompt:"How strong is the temporal validation, exactly?",
 modelAnswer:
"Weaker than it first looks, and I report it with its n every time.\n\n"+
"Across the four summer means the correlation with climatic moisture deficit is −0.68 and with precipitation +0.72. But n = 4 — that establishes a sign, not a magnitude.\n\n"+
"Computed within polygons, with each polygon's own mean removed, on n = 612, the same relationships hold in the same directions but are much weaker: −0.31 and +0.32.\n\n"+
"So it is a direction check, not a validation. And the extension to nine summers did not reproduce it.",
 rubric:["Both the n = 4 and the n = 612 figures",
   "Explained why n = 4 gives a sign and not a magnitude",
   "Called it a direction check rather than a validation"],
 followUps:[{q:"Why is the within-polygon version the more honest one?", a:"Because it asks whether a given polygon reads drier in the summers when that polygon is drier, rather than whether dry places differ from wet places. It removes all permanent between-polygon differences."}],
 conceptIds:["within-unit-demeaning","cdei-drift"]},

{id:"q2-07", tier:2, prompt:"What is your seed sensitivity result, and what does it not rescue?",
 modelAnswer:
"Re-running the whole experiment across independent seeds, re-seeding both the k-means blocking and the forest: at 12 kilometres, 12 seeds give R²_B of −0.0027 ± 0.0010, above zero in 0 of 12. At 25 kilometres, 20 seeds give +0.0033 ± 0.0005, above zero in 20 of 20.\n\n"+
"So the verdict label is a deterministic function of cell size, not a lucky partition. And the paired difference excludes zero in 32 of 32 runs.\n\n"+
"What it does not rescue: +0.003 is a stable measurement of essentially no skill. Stability is not magnitude.",
 rubric:["Both seed counts and both R²_B means",
   "0/12 and 20/20 stated",
   "Volunteered that stable is not the same as meaningful"],
 followUps:[{q:"Why re-seed the blocking and not just the model?", a:"Re-running with the same partition only measures model variance. Re-partitioning tests whether the result survives a different carving of the map."}],
 conceptIds:["seed-sensitivity","ci-excludes-zero"]},

{id:"q2-08", tier:2, prompt:"Give me the hyperparameter sensitivity result in full.",
 modelAnswer:
"Eight forest configurations at 25 kilometres. Model B is better on the point estimate in all eight, and R²_B never leaves [+0.001, +0.004]. But the paired interval excludes zero in only six of eight — the exceptions are minimum leaf size 5 and 10, the heavily regularised settings.\n\n"+
"The pattern is informative: R²_A climbs monotonically from −0.249 to −0.060 as leaf size grows from 1 to 10, while R²_B does not move. Model A's deficit is substantially overfitting to fine-grained climate detail, and constraining the learner suppresses it.\n\n"+
"So the defensible statement is that the coarse model is never worse and is significantly better under most reasonable settings including the pre-registered one, with the qualification that heavy regularisation closes the gap to statistical indistinguishability.",
 rubric:["8 of 8 on point estimate, 6 of 8 on significance",
   "Named which two configurations fail",
   "Gave the monotonic R²_A pattern and its interpretation",
   "Ended on the weaker, defensible statement"],
 followUps:[{q:"Doesn't 6 of 8 undermine your headline?", a:"It weakens it, and the findings document says so explicitly. The claim does not rest on the forest comparison alone though — it is independently supported by the rank correlations at |ρ| ≤ 0.15 and by the explanatory analysis, where adding climate makes the model worse."}],
 conceptIds:["ci-excludes-zero","negative-r2","random-forest"]},

{id:"q2-09", tier:2, prompt:"How much better is your explanatory model, and what does that tell you?",
 modelAnswer:
"Terrain plus stand structure reaches CV R² of +0.029, positive in 80% of folds, against climate's −0.138 at 40%. Adding climate on top drops it to +0.020.\n\n"+
"That tells me the direction — water stress at this scale is governed by local terrain aspect and stand composition, not by the macroclimate gradient — and the fact that climate makes it worse is independent confirmation that the climate gradient is noise for this target.\n\n"+
"But +0.03 is weak in absolute terms. It is a directional result, not a usable predictive model, and most between-stand variance is unexplained by anything I measured.",
 rubric:["The R² values for each family",
   "Noted adding climate makes it worse",
   "Volunteered the weakness of the absolute skill"],
 followUps:[{q:"Why aren't NDVI and SWCI in the predictor set? They'd help.", a:"CDEI is built from them. Predicting an index from its own inputs is arithmetic, not discovery."},
   {q:"Is there a worry about that explanation?", a:"Yes, and it is flagged. Leading species and broadleaf class ranking highest is consistent with CDEI partly encoding canopy type rather than water stress per se."}],
 conceptIds:["circularity-exclusion","permutation-importance"]},

{id:"q2-10", tier:2, prompt:"Give me the sizes of everything: units, rows, summers, resolutions.",
 modelAnswer:
"Surrey: 144 GIN corridors served as 153 polygons, four summers 2022 to 2025, 612 rows. The extended record is nine summers, 2017 to 2025, 1,377 polygon-summers.\n\n"+
"Transect: 300 VRI forest stands sampled from 12,168, four summers, 1,200 rows, spanning 4 to 1,920 metres over 100 kilometres.\n\n"+
"Resolutions: ClimateBC roughly 375 to 750 metres; Sentinel-2 optical 10 metres with the shortwave bands at 20; Landsat thermal 30 metres, resampled from about 100. Coarse cells are 4 kilometres over Surrey and 25 kilometres at the transect.",

   "Distinguished 144 corridors from 153 polygons",

{id:"q2-11", tier:2, prompt:"What is the orthogonality diagnosis, in numbers?",
 modelAnswer:
"Over Surrey, predictors vary far more between years than between corridors: CMD_sm has a between-year sd of 77.53 against a between-corridor sd of 7.63, a factor of 10.2. Every summer variable is 2.3 to 6.3 times more temporal than spatial.\n\n"+
"The targets do the opposite: NDVI is 9.4 times more spatial, CDEI 4.1 times.\n\n"+
"At the transect it inverts. CDEI varies 122 times more between stands than between years — sd 0.0241 against 0.0022 — so there is a strong spatial signal. The climate gradient simply does not align with it: |ρ| ≤ 0.15 against CMD, Tmax, Eref and elevation, n = 300.",
 rubric:["The CMD_sm ratio for Surrey",
   "A target ratio showing the opposite direction",
   "The 122× inversion at the transect",
   "The |ρ| ≤ 0.15 non-alignment"],
 followUps:[{q:"What is the citation for that idea?", a:"Perret, Evans & Sax 2024 — a species' spatial climate response does not predict its temporal response. It is the space-for-time failure at the centre of this."}],
 conceptIds:["orthogonal-axes","climate-vars"]},

{id:"q2-12", tier:2, prompt:"How does the residualisation retest work, and what were the numbers?",
 modelAnswer:
"I regressed CDEI on 24 VRI stand attributes — age, height, crown closure, species, land-cover class — which come from the provincial forest inventory and are independent of the imagery CDEI is built from. They absorb 14.9% of its variance. I then re-ran the whole paired A-versus-B test on the residuals.\n\n"+
"The result strengthens rather than weakens: ΔRMSE +0.00113 with interval [+0.00049, +0.00183] at 25 kilometres, and +0.00146 [+0.00083, +0.00213] at 12 kilometres. Both exclude zero, and both are larger than the unresidualised +0.00093.\n\n"+
"I also ran a deliberate over-correction including stand NDVI, at 73.2% of variance. It inverts the sign — but NDVI is a constitutive input to the index, not a confounder, so that removes the index rather than the confound, and both models then fall below the mean.",
 rubric:["Explained why VRI attributes are independent of the imagery",
   "Gave both residualised intervals",
   "Noted the result got stronger, not weaker",
   "Volunteered the over-correction bound and why it does not count"],
 followUps:[{q:"There's a leak in that design, isn't there?", a:"Yes, and it is stated openly in the script. The residualisation is fitted globally rather than per fold, so it leaks response structure into the folds — but identically into both arms, and the reported quantity is the paired difference."}],
 conceptIds:["residualisation","canopy-confound"]},

{id:"q2-13", tier:2, prompt:"What does the number 12.3% mean, and why is 0.998 the more alarming figure?",
 modelAnswer:
"12.3% is the median share of the climate predictors' spatial variance destroyed by Surrey's 4 kilometre coarsening — against a 30% gate.\n\n"+
"0.998 is the more alarming figure because it is the direct statement: that is the median correlation between the Model A and Model B predictor fields after coarsening. Two models built on inputs correlated at 0.998 are not two models. Whatever difference you measure between them is arithmetic.",
 rubric:["Correctly identified what 12.3% is a share of",
   "Explained why 0.998 is the sharper statement",
   "Connected it to why the null is uninformative"],
 followUps:[{q:"Why report the variance fraction at all, then?", a:"Because it is comparable across cell sizes and extents, and it is what makes the gate a usable general procedure rather than a Surrey observation."}],
 conceptIds:["contrast-gate","upscaling"]},

/* ================= TIER 3 — adversarial, by attack surface ================= */
{id:"q3-01", tier:3, surface:1, prompt:"So your map is a vegetation-density map. You have dressed up a picture of where the trees are thickest and called it drought.",
 modelAnswer:
"It might be, and I cannot rule that out for the between-corridor axis.\n\n"+
"CDEI correlates with NDVI at −0.347 over 153 polygons — greener reads as more stressed. I tested it with Sentinel-1 radar, different physics entirely, and the vegetation-condition indices returned nothing in any of four summers. The only radar signal that lines up with my ranking is VH backscatter, which itself tracks NDVI at about +0.55.\n\n"+
"That is my own finding with an independent sensor, and my response was to demote the deliverable to exploratory and label it on every figure. I do not claim the ranking is a validated statement of which corridors are physically driest.",
 rubric:["Conceded it might be true rather than deflecting",
   "Gave ρ = −0.347 and the radar evidence",
   "Emphasised that this was self-found with an independent instrument",
   "Stated the consequence taken"],
 followUps:[{q:"Then why publish the map at all?", a:"Because the temporal signal is usable and the map is the artefact that makes it actionable for the City. It is a judgment call, and an outside reviewer argued in three separate rounds that it should be removed. I keep it with unusually prominent warnings, and I do not dismiss that criticism."},
   {q:"Doesn't the same confound sink your central result?", a:"That is the sharper version and it was tested. Residualising CDEI on 24 independent VRI attributes strengthens the A-versus-B result — ΔRMSE rises from +0.00093 to +0.00113, interval still excluding zero. The confound is real for the ranking and does not carry the central finding."},
   {q:"How do you know residualising on VRI is enough?", a:"I do not know it is enough — I know it bounds the question from one side. I also ran an over-correction on stand NDVI which inverts the sign, and I report that as a pessimistic bound rather than burying it, while noting NDVI is a constitutive input to the index rather than a confounder."}],
 neverSay:["that the corridor stress ranking is validated","that the confound has been eliminated"],
 conceptIds:["canopy-confound","residualisation"]},

{id:"q3-02", tier:3, surface:2, prompt:"You said your index tracks drought over time. Then you added five more summers and it stopped working. Why should I believe any of your temporal claims?",
 modelAnswer:
"You should not believe them as validation, and the paper no longer says you should — the Abstract and Conclusion were corrected because they previously implied the temporal use was deliverable.\n\n"+
"What happened: the relationship on four summer means was −0.68 against moisture deficit. Over nine summers it went to +0.070. I diagnosed the cause and it is mine, not the sensor's — the dry edge is fitted once and frozen, so slow greening of the panel moves the index independently of moisture. Two non-significant input shifts, NDVI +0.014 and SWCI −0.005, become a 0.51 standard deviation index shift at p = 1e-17 through the geometry.\n\n"+
"So the honest status is: the four-summer direction check was real as a direction, the extension did not confirm it, and the index has a known drift I can explain but have not yet fixed.",
 rubric:["Did not defend the original claim",
   "Named the frozen dry edge as the mechanism, own fault not sensor",
   "Gave the non-significant-in / significant-out numbers",
   "Stated the paper was corrected"],
 followUps:[{q:"What is happening in 2018 and 2021?", a:"I don't know yet. Both are dry summers reading as unstressed, and within the five earlier summers the correlation is absent rather than displaced — r = −0.04, p = 0.28. The drift explains the shift between halves; it does not explain that."},
   {q:"That's not an answer. Guess.", a:"I would rather not. I ruled out four candidate mechanisms by test — the frozen thermal baseline, the thermal term entirely, a code-version difference in the imagery, and any significant shift in the input bands. Beyond that I would be inventing, and an invented mechanism is worse than an open question."},
   {q:"Can it be fixed?", a:"There is an untested fix: refit the dry edge per period, or normalise against a reference that does not move with canopy growth, then re-extend. It needs no new data. I have not done it, so I will not claim it works."}],
 neverSay:["that the nine-summer extension confirmed anything","that the drift problem is resolved"],
 conceptIds:["cdei-drift","frozen-reference","within-unit-demeaning"]},

{id:"q3-03", tier:3, surface:3, prompt:"Your entire central conclusion rests on a response variable at the transect that you never validated against anything at all.",
 modelAnswer:
"That is correct, and it is the deepest unresolved weakness in the project.\n\n"+
"The Surrey index was checked against radar. The transect index was checked against nothing — validate_sar.py is Surrey-only. And my own explanatory analysis already suspects a vegetation-type artifact there, because leading species and broadleaf class rank highest among the drivers, which is consistent with CDEI partly encoding canopy type rather than water stress.\n\n"+
"What I can say is that the sharp form of the objection was tested: residualising on 24 independent VRI attributes strengthens rather than weakens the A-versus-B result. That bounds the damage. It does not substitute for a validation, and no ground observation validates CDEI at either extent.",
 rubric:["Conceded fully and named it the deepest weakness, unprompted",
   "Explained that validate_sar is Surrey-only",
   "Volunteered the vegetation-type suspicion from their own analysis",
   "Distinguished bounding the damage from validating"],
 followUps:[{q:"So your paper's main claim is built on an unmeasured quantity?", a:"It is built on an index whose construction is fully specified and whose confounds are measured, but which has no external referent. That is a real limitation and it is stated in Limitations items 1 and 2."},
   {q:"What would fix it?", a:"A one-season field check — the paper proposes it in §4.5. Sap-flow or soil-moisture instrumentation on a subset of stands would give the external referent that does not currently exist."},
   {q:"Why didn't you do that?", a:"Cost, access and time. That is a real constraint, not a justification, and it is why the claim is scoped the way it is."}],
 conceptIds:["cdei","canopy-confound","circularity-exclusion"]},

{id:"q3-04", tier:3, surface:4, prompt:"Your verdict is FALSIFIED because a number cleared zero by three thousandths. Move to a different cell size and the same evidence says INCONCLUSIVE. That is not a result, it is a coin landing on its edge.",
 modelAnswer:
"On the label, I agree with you, and I say so before being pushed there.\n\n"+
"The skill gate is R² greater than exactly zero. At 25 kilometres Model B is +0.0035 and the label is FALSIFIED; at 12 kilometres it is −0.0027 and the label is INCONCLUSIVE. Zero is a convenience, not a principled boundary.\n\n"+
"But the paired difference does not flip. It is +0.00093 at 25 kilometres and +0.00094 at 12, both intervals excluding zero, in 32 of 32 seed runs across both cell sizes. The robust quantity and the fragile quantity are different quantities, and my conclusion rests on the robust one.\n\n"+
"I addressed it by removing the verdict labels from the evidence tables entirely — they now report whether the interval excludes zero.",
 rubric:["Agreed with the criticism of the label without defending zero",
   "Separated the fragile label from the robust interval",
   "Gave 32/32",
   "Named the concrete fix made to the tables"],
 followUps:[{q:"Then why keep a verdict word at all?", a:"Because the decision rule in the code produced one, and deleting it after seeing which way it fell would be worse than reporting it. It is not a pre-registered rule — the forest settings were fixed a priori, the gate was not — so the word is reported and discussed as a threshold artifact rather than used as evidence."},
   {q:"Isn't 'the interval excludes zero' also arbitrary at 95%?", a:"It is a convention, yes. But the difference is that the interval reports the size and uncertainty of the effect, so a reader can apply their own threshold. A categorical label discards that information."},
   {q:"And +0.003 of skill? Is that a model anyone should use?", a:"No. It is a reliable measurement of no useful skill. My conclusion is about the comparison, not about Model B being usable."}],
 conceptIds:["skill-gate","ci-excludes-zero","seed-sensitivity"]},

{id:"q3-05", tier:3, surface:5, prompt:"You ran the experiment, got a null, and then invented a criterion that reclassified your null as 'inconclusive'. That is rationalisation with extra steps.",
 modelAnswer:
"The ordering is exactly as you describe, and it is disclosed in the paper rather than hidden. Three things distinguish it from rationalisation, and I would want to be judged on whether they hold.\n\n"+
"First, a gate is an inclusion criterion, not a hypothesis. HARKing means inventing a hypothesis to fit a result you already have. This declares when a test is capable of answering anything at all.\n\n"+
"Second, the diagnostic never sees the response variable. It is computed entirely on the predictor field, so there is no channel through which it could be tuned toward a desired outcome.\n\n"+
"Third, and this is the one that matters most: the same gate, unchanged, was applied to the transect — where it permitted a verdict that falsified my own hypothesis. A criterion that lets your own hypothesis be destroyed is not functioning as a rationalisation.",
 rubric:["Conceded the ordering plainly",
   "Distinguished an inclusion criterion from a hypothesis",
   "Noted the diagnostic never sees the response",
   "Gave the transect argument — the gate permitted their own falsification"],
 followUps:[{q:"You could have written a gate that happened to spare you and happened to convict you later. That's luck, not design.", a:"It would be luck if the threshold had been chosen after seeing the transect result. It was not — Surrey's 12.3% and the 30% threshold were fixed before the transect data existed. But you are right that a pre-registration would have settled this and I do not have one."},
   {q:"So would you pre-register next time?", a:"Yes, and specifically the gate rather than the hypothesis. The hypothesis was easy to state; the conditions under which the test is informative were the thing I did not think through in advance."}],
 neverSay:["that the gate was pre-registered"],
 conceptIds:["verdict-rule","contrast-gate"]},

{id:"q3-06", tier:3, surface:6, prompt:"One valley. One product. One learner. Four summers. Why is this anything more than an anecdote?",
 modelAnswer:
"On generality you are largely right, and I would not claim this is a general property of corridor water stress. Limitations items 8 and 9 state exactly that: one downscaling product, one learner, one transect, one region.\n\n"+
"What I would defend is the methodological contribution rather than the falsification. The contrast gate — measure the fraction of predictor spatial variance the coarsening destroys before comparing climate resolutions — is a procedure, not an observation. It transfers to any region, any product and any response variable, and it does not depend on my result being right.\n\n"+
"The falsification is one data point consistent with Klinges et al. 2024, who find proximity beats resolution. One data point.",
 rubric:["Conceded generality without argument",
   "Named the specific limitations items",
   "Redirected to the transferable procedure",
   "Called the falsification one data point"],
 followUps:[{q:"How would you test generality?", a:"Repeat the same design on a second transect in different terrain, with a second downscaling product and a second learner. The code is extent-agnostic — Phase 3b changed only the study extent — so that is a feasible next step rather than a wish."},
   {q:"Would a different learner change the answer?", a:"Possibly. The hyperparameter sweep already shows the significance depends on how hard the learner is allowed to chase fine detail, so a very different model family is a live risk to the result. I have not tested it."}],
 conceptIds:["contrast-gate","random-forest","elevation-transect"]},

{id:"q3-07", tier:3, surface:7, prompt:"You claim coarse climate beats fine climate, but you never ran a coarse climate model. You blurred your own data and compared it to itself.",
 modelAnswer:
"That is accurate, and I state it before anyone asks. Model B is a synthetic spatial degradation of ClimateBC. No regional climate model was run.\n\n"+
"The reason is that the alternative design is worse. If I had compared ClimateBC against a real 25 kilometre RCM and the RCM won, I could not say whether it won because of its resolution or because it is a different model built from different stations with different interpolation and different bias correction. The comparison would be uninterpretable.\n\n"+
"Blurring holds everything else constant, so resolution is the only variable. It answers a narrower question cleanly instead of a broader question ambiguously. And there is a second benefit — because the upscale averages within cell and year, the temporal signal is untouched and the two models are identical by construction on a purely temporal target.",
 rubric:["Conceded the design limit unprompted",
   "Named the specific confound: which dataset versus what resolution",
   "Argued narrow-and-clean over broad-and-ambiguous",
   "Gave the within-(cell,year) property"],
 followUps:[{q:"So your finding might not apply to any real coarse product?", a:"Correct. It applies to the spatial information content of ClimateBC. Whether a particular RCM carries more or different usable spatial signal is a separate empirical question my design cannot answer."},
   {q:"Isn't a blur strictly less informative than the fine field? So of course the fine one should win.", a:"That is the intuition the hypothesis encodes, and it is exactly what failed. Blurring removes information, but if the removed information is noise with respect to the target then removing it helps — which is what R²_A of −0.138 against R²_B of +0.003 shows."}],
 conceptIds:["degrade-not-substitute","upscaling"]},

{id:"q3-08", tier:3, surface:8, prompt:"Your best model has an R-squared of positive nought point nought nought three, and your other one is negative. Neither model works. What exactly have you demonstrated?",
 modelAnswer:
"That neither model predicts stand water stress usefully — I agree, and I would not dress that up.\n\n"+
"What I have demonstrated is about the comparison rather than about either model. Model A is at −0.138, which means worse than predicting the mean: the fine-scale climate detail is not merely uninformative, it is anti-informative, and the learner chases spatial structure in the climate field that has no counterpart in the response.\n\n"+
"The evidence that this is overfitting rather than noise is that R²_A climbs monotonically from −0.249 to −0.060 as I constrain the forest, while R²_B does not move. So the claim is: adding fine climate detail makes things worse, reliably. That is a negative result about resolution, not a working model.",
 rubric:["Agreed that neither model works",
   "Explained negative R² correctly as worse than the mean",
   "Used 'anti-informative' and justified it",
   "Gave the monotonic regularisation evidence"],
 followUps:[{q:"Then your conclusion is about a comparison between two failures.", a:"Yes, and that is the honest framing. It is informative because the two failures differ systematically and in a direction opposite to the hypothesis — but it is not a claim that either is usable."},
   {q:"Why is your skill gate satisfied at all, then?", a:"Barely, and that is attack surface 4. R²_B clears zero by three thousandths at 25 km. I weight the paired intervals over the label for exactly that reason."},
   {q:"Is there any target you can predict?", a:"Not with climate. Terrain plus stand structure reaches +0.029 — positive in 80% of folds, but still weak. Most between-stand variance is unexplained by anything I measured."},
   {q:"Then why not go and build a model that works, instead of comparing two that do not?", a:"Because the assumption I am testing sits upstream of any model — it drives what data a city buys before anyone knows whether a model will work. And a model tuned for accuracy would reach for elevation and stand structure, which are exactly the predictors that would let Model A win for reasons unrelated to climate resolution. I did chase accuracy, separately, in the explanatory analysis."}],
 conceptIds:["negative-r2","r-squared","skill-gate","assumption-not-accuracy"]},

{id:"q3-09", tier:3, surface:9, prompt:"You used AI to write your code and draft your paper. How much of this is actually yours?",
 modelAnswer:
"The use is disclosed in the paper: Claude scaffolded code and drafted technical prose which I revised, and Gemini was used as an adversarial reviewer. Youth Science Canada's guidelines permit that on this route.\n\n"+
"But disclosure protects my integrity, not my understanding, and it is not the answer to your question. The answer is that I should be able to explain any method here in my own words, including why each choice was made and what the alternative was — and if I cannot, the disclosure does not save me. Ask me about the bootstrap, or the blocking design, or the permutation importance, and judge from that.\n\n"+
"The decisions are mine: what to test, when the test was not valid, what to retract, and what not to claim.",
 rubric:["Stated the disclosure plainly, without defensiveness",
   "Separated integrity from understanding",
   "Invited testing on the sophisticated-sounding parts",
   "Claimed the judgment calls specifically"],
 followUps:[{q:"Fine. Explain the bootstrap without using the word bootstrap.", a:"I have a dozen numbers, one per fold, and I want to know whether their average is real or an accident of these particular folds. So I draw a new set of the same size from them, allowing repeats, and take that average. Ten thousand times. The middle 95% of those averages is my interval — and it assumes nothing about the numbers being normally distributed, which matters because a dozen values is nowhere near enough to assume that."},
   {q:"And permutation importance?", a:"Shuffle one predictor's values so it carries no information, and see how much worse the model gets. No drop means the model was not using it. The important part is measuring the drop on a held-out spatial block rather than on the training data, so it reports what helps on stands the model has never seen."},
   {q:"Who decided to retract the NDVI saturation claim?", a:"I did, after the offset probe disagreed with the provider metadata. The claim was mine, the retraction was mine."}],
 conceptIds:["bootstrap-ci","permutation-importance","blocked-cv"]},

{id:"q3-10", tier:3, surface:1, prompt:"You keep saying you found the confound yourself. Do you want credit for finding a problem you created?",
 modelAnswer:
"No — and that is a fair correction. Finding it is the minimum standard, not an achievement.\n\n"+
"What is worth judging is what happened afterwards: the deliverable was relabelled exploratory on every figure, the limitation was moved to the front of the README, and the sharper version of the objection was tested rather than argued away.\n\n"+
"Stating a problem is not the same as bounding what it damages. That is the standard I would want applied.",
 rubric:["Did not accept credit for self-diagnosis",
   "Redirected to what was done about it",
   "Articulated the stating-versus-bounding distinction"],
 followUps:[{q:"So what does the confound damage, precisely?", a:"The between-corridor ranking, fully. The central A-versus-B finding, not measurably — that was tested by residualisation and got stronger. The temporal signal, unclear, because the drift problem is a separate open issue."}],
 conceptIds:["canopy-confound"]},

{id:"q3-11", tier:3, surface:4, prompt:"Walk me through why I should not simply discard your headline and keep only the limitations section.",
 modelAnswer:
"Because the limitations do not reach the paired result.\n\n"+
"Take them one at a time. The canopy confound damages the ranking; residualisation shows it does not carry the A-versus-B difference. The drift problem damages the temporal claim; the A-versus-B test is cross-sectional within summers and does not depend on it. The threshold artifact damages the verdict word; the interval is what the conclusion rests on and it excludes zero in 32 of 32. Generality bounds how far the finding travels; it does not make it wrong within its extent.\n\n"+
"What survives is narrow: at one transect, with one product and one learner, fine climate resolution did not help and at 25 kilometres it hurt, and neither model was useful. That is a small claim, and I think it is a true one.",
 rubric:["Took the limitations individually rather than in bulk",
   "Showed which claim each one actually reaches",
   "Stated the surviving claim in its narrowest form"],
 followUps:[{q:"Which limitation would you most like to be wrong about?", a:"The transect validation gap. Everything else is bounded; that one is genuinely open and it sits under the central result."}],
 conceptIds:["ci-excludes-zero","canopy-confound","cdei-drift"]},

{id:"q3-12", tier:3, surface:2, prompt:"If your index drifts with canopy greenness, and greenness is also your confound, isn't the whole index just measuring vegetation with extra steps?",
 modelAnswer:
"That is the sharpest version of the criticism and the two issues are related, though not identical.\n\n"+
"The drift is temporal: a frozen line against a slowly greening panel, so the index moves over years for non-water reasons. The confound is cross-sectional: greener polygons read as more stressed at any one time, ρ = −0.347.\n\n"+
"Both run through NDVI, so your instinct is right that they share a channel. What I can say against 'it is only vegetation' is that residualising on 24 independent stand attributes does not destroy the A-versus-B result, and that land-cover class alone explains only 2.7% of between-stand variance.\n\n"+
"What I cannot say is that the index is cleanly separated from greenness. It is not, and NDVI is a constitutive input to it by construction.",
 rubric:["Distinguished the temporal drift from the cross-sectional confound",
   "Conceded the shared NDVI channel",
   "Gave the residualisation and 2.7% evidence",
   "Conceded the index is not cleanly separated from greenness"],
 followUps:[{q:"Then what is the index for?", a:"As it stands, a within-polygon temporal signal whose long-record behaviour is a known open problem. That is a much smaller claim than the project started with, and it is where the evidence leaves it."}],
 conceptIds:["cdei-drift","canopy-confound","dry-edge"]},

{id:"q3-13", tier:3, surface:3, prompt:"Your two extents use different analysis units, different sizes, different vegetation. On what basis do you compare them at all?",
 modelAnswer:
"On the basis that I do not compare their results — I compare whether each extent could support the test.\n\n"+
"You are right that they differ: 39.7 metres effective width for Surrey corridors against 94.8 metres for VRI stands, urban corridors against managed forest. That is Limitations item 10, and it is why I do not claim the Surrey CDEI and the transect CDEI are the same measurement of the same thing.\n\n"+
"What transfers is the design and the diagnostic. Same code, same variables, same folds, same seeds — only the extent changed. The contrast gate is computed on the predictor field at each extent independently, and that is what the two are compared on: 12.3% against 48.4%.",
 rubric:["Refused the framing of comparing results across extents",
   "Gave the effective-width numbers and named Limitations item 10",
   "Explained that only the extent changed in the code",
   "Located the comparison in the diagnostic, not the outcome"],
 followUps:[{q:"But you apply the transect conclusion back to Surrey.", a:"I apply the methodological conclusion — climate resolution is the wrong lever — not the effect size. And I am relying on the transect being the harder case: if fine climate cannot beat coarse where a 1,900 metre gradient exists, it is unlikely to over a flat delta."}],
 conceptIds:["elevation-transect","mixed-pixels","contrast-gate"]},

{id:"q3-14", tier:3, surface:6, prompt:"Give me the strongest argument against your own conclusion. Not a limitation — an argument that you are wrong.",
 modelAnswer:
"The strongest one is the hyperparameter result read against me.\n\n"+
"Model A's deficit shrinks monotonically as I constrain the forest — from −0.249 to −0.060. Extrapolate that and a sufficiently regularised or simply better-suited learner might close the gap entirely, at which point 'fine climate is anti-informative' collapses into 'my learner overfit it.' The paired interval already fails to exclude zero in two of eight configurations, both of them the heavily regularised ones.\n\n"+
"If that is what is happening, my result is a statement about random forests and fine-grained inputs, not about climate resolution.\n\n"+
"What I would offer against it is that the rank correlations do not involve a learner at all — |ρ| ≤ 0.15 between stand-mean CDEI and every gradient variable, n = 300 — and the explanatory analysis independently finds that adding climate makes a terrain-and-structure model worse. But I do not think the objection is answered, only weakened.",
 rubric:["Produced a genuine argument, not a restated limitation",
   "Followed the monotonic trend to its uncomfortable conclusion",
   "Cited the 6-of-8 result against themselves",
   "Offered learner-free evidence, and did not claim it settles the matter"],
 followUps:[{q:"What experiment would settle it?", a:"Re-running the whole design with two or three structurally different learners — a linear model, a gradient booster, a Gaussian process. If the direction holds across model families it is about the data; if it does not, the objection is right."},
   {q:"Why haven't you?", a:"Time, and it was not in the pre-registered plan. It is the single most valuable next analysis and it needs no new data."}],
 conceptIds:["negative-r2","random-forest","spearman"]},

/* ================= ADMISSIONS TRACK ================= */
{id:"qa-01", track:"admissions", tier:1, prompt:"Tell me about your project in two minutes, for someone outside the field.",
 modelAnswer:
"Surrey has a network of green corridors that connect habitat across the city, and it needs to know which ones are drying out so it can spend a restoration budget well.\n\n"+
"There is a widely held assumption that to answer a local environmental question you need high-resolution climate data rather than cheap coarse data. I tested that assumption directly: I built two prediction models that were identical in every way except the spatial resolution of their climate inputs, and compared them honestly.\n\n"+
"The assumption failed. Where there was a real climate gradient to resolve, the coarse model was significantly better, because water stress at this scale is governed by local terrain and forest composition rather than by the macroclimate gradient.\n\n"+
"So I pivoted. Since climate resolution was the wrong lever, I built a way to measure stress directly from free satellite imagery and gave the City a map and a ranking — then tested that tool against an independent radar satellite and found it was partly confounded with canopy density, which I reported rather than buried.",
 rubric:["Led with the human problem, not the method",
   "Explained the controlled comparison in plain language",
   "Included the pivot and the self-criticism",
   "Under two minutes"],
 followUps:[{q:"What is the one sentence version?", a:"I tested whether high-resolution climate data helps predict which of Surrey's green corridors are drying out, found it does not and that the drivers are local, and built a free-satellite monitor instead — then reported honestly what it can and cannot yet do."}],
 conceptIds:["model-a-vs-b","canopy-confound"]},

{id:"qa-02", track:"admissions", tier:1, prompt:"Your hypothesis was wrong. How do you feel about that?",
 modelAnswer:
"It was the most useful thing that happened.\n\n"+
"I started out expecting fine-resolution climate data to win, and I designed the test so that it could lose. When it lost, the interesting question changed from 'how much does resolution help' to 'why did I expect it to' — and the answer turned out to be a hidden premise I had not noticed: that meaningful climate variation exists between corridors to resolve at all.\n\n"+
"That premise is false at municipal scale, and noticing it produced the part of the project I actually think is worth something — a procedure for telling in advance whether a resolution comparison is even capable of answering anything.\n\n"+
"A confirmed hypothesis would have given me a result. A falsified one gave me a method.",
 rubric:["Did not perform disappointment or false enthusiasm",
   "Identified the hidden premise as the real discovery",
   "Distinguished getting a result from getting a method"],
 followUps:[{q:"Were you tempted to keep looking until something worked?", a:"Yes, and I did once — the within-corridor anomaly gave R² of +0.051 with the right sign, and I liked it. Then the forward temporal holdout gave −1.673 and I had to kill it. That was harder than the main falsification."}],
 conceptIds:["inconclusive-vs-not-supported","temporal-holdout"]},

{id:"qa-03", track:"admissions", tier:1, prompt:"What did you find hardest?",
 modelAnswer:
"Distinguishing a result I wanted from a result I had.\n\n"+
"The concrete instance: stripping each corridor's own mean out of the index appeared to give real predictive skill, with a physically sensible sign — R² of +0.051 where everything else was negative. It would have rescued the project's temporal claim.\n\n"+
"It was memorisation. Spatial cross-validation holds out corridors, not years, so all four summers were in training and the model could just learn four annual averages. The forward holdout, which cannot be gamed that way, returned −1.673.\n\n"+
"Writing the test that killed my own best number was harder than any of the engineering.",
 rubric:["Named a specific instance rather than a general difficulty",
   "Explained the mechanism of the self-deception",
   "Owned that the discipline was effortful"],
 followUps:[{q:"How do you guard against that generally?", a:"Design the test that can kill the result before you look at the result. The forward holdout existed before I found the +0.051; that is the only reason I ran it."}],
 conceptIds:["temporal-holdout","grouped-folds"]},

{id:"qa-04", track:"admissions", tier:1, prompt:"What would you do differently if you started again?",
 modelAnswer:
"Three things.\n\n"+
"I would pre-register the preconditions rather than the hypothesis. The hypothesis was easy to state; what I had not thought through was under what conditions the test would be informative, and I ended up writing that criterion after Surrey returned a null. It is defensible and disclosed, but pre-registration would have removed the question entirely.\n\n"+
"I would not freeze the dry edge without first testing what a frozen reference does over a long record. That decision looked conservative and turned out to be the source of the project's most serious open problem.\n\n"+
"And I would plan a ground-truth check from the beginning instead of hoping an independent satellite would serve. Radar told me something valuable, but it told me about the confound rather than validating the index.",
 rubric:["Three concrete changes, each tied to a real failure",
   "Pre-registering the preconditions, not the hypothesis",
   "Did not use the question to re-praise the project"],
 followUps:[{q:"Which of those would have changed your conclusion?", a:"None of them, I think. They would have changed how much of it I could defend."}],
 conceptIds:["verdict-rule","frozen-reference","cdei"]},

{id:"qa-05", track:"admissions", tier:1, prompt:"What part of this did you find genuinely interesting, rather than just necessary?",
 modelAnswer:
"The moment the variance table explained everything at once.\n\n"+
"I had a pile of unrelated-looking symptoms: no model had skill on any target, coarsening barely changed the predictors, and a temporal result appeared and then evaporated under a stricter test. Then I computed between-year against between-corridor variation for the predictors and the targets and it collapsed into one sentence — the climate varies in time, the water stress varies in space, and cross-validation was asking a question along the axis where the climate is constant.\n\n"+
"Three separate failures turning out to be one structural fact was the most satisfying thing in the project. It is also the only part I would call a genuine idea rather than careful execution.",
 rubric:["Named a specific moment rather than a topic",
   "Explained why the unification was satisfying",
   "Distinguished an idea from execution honestly"],
 followUps:[{q:"Is that idea original to you?", a:"The diagnosis for my data was. The underlying principle — spatial response and temporal response are different things — is in Perret et al. 2024, which I found afterwards and now cite."}],
 conceptIds:["orthogonal-axes"]},

{id:"qa-06", track:"admissions", tier:1, prompt:"You used AI heavily. Convince me you learned something.",
 modelAnswer:
"The fair test is whether I can explain the choices rather than the outputs, so ask me about any of them.\n\n"+
"The things I would point to are the decisions no tool made for me. Choosing to build the coarse model by degrading the fine one rather than substituting a different product, because otherwise dataset and resolution are confounded. Noticing that 69% of pixels sitting at exactly 1.000 was arithmetic rather than ecology, and retracting a claim I had already written up. Refusing to cite a result I liked once a stricter test destroyed it.\n\n"+
"Those are judgments about what counts as evidence, and they are the part of the work I would defend as mine.",
 rubric:["Offered to be tested rather than asserting understanding",
   "Cited specific judgment calls, not general effort",
   "Included a retraction as evidence of learning"],

{era:"p1", date:"Phase 1", kind:"decision", key:true,
 title:"Take the question from the City, not from the literature",
 what:"The City of Surrey manages a **Green Infrastructure Network**: a set of vegetated corridors delineated in its Ecosystem Management Study and tabulated, corridor by corridor with the City's own recommendation text, in an appendix that this pipeline later parses directly. The City has a stated need to find impaired corridors and spend a limited restoration budget where it matters.\n\nSo the question was set as the City would ask it — **which corridors are drying out?** — rather than as a modelling exercise looking for a dataset.",
 why:"An applied question has an audience that can tell you when the answer is useless. A methods question invented in the abstract does not.",
 changed:"Fixed the analysis unit as the corridor polygon and the study area as Surrey, before any data was touched. Both constraints later turned out to be what made the hypothesis untestable here — see the Phase 3 verdict.",
 concepts:["gin-corridors","appendix-j","crs-26910"]},

{era:"p1", date:"Phase 1", kind:"decision",
 title:"Choose a response variable the literature supports, not the easiest one",
 what:"Plain greenness was the obvious target and was rejected on grounds taken from the literature: shortwave-infrared reflectance responds to leaf water content while a canopy is still green, so it leads greenness as an early-warning signal. The chosen index combines a greenness band ratio, a shortwave-infrared water ratio and land-surface temperature into a single distance in feature space.\n\nIt was drafted under the name TVWSI, after Joshi et al. (2021). It was **renamed CDEI** once it became clear the construction here differs from theirs; the dataframe column is still `tvwsi`, because renaming the field would invalidate every cached panel.",
 why:"Greenness lags. A canopy that has already browned is past the point where a restoration budget can be spent usefully.",
 changed:"Committed the project to acquiring three sensor products rather than one — Sentinel-2 optical, Sentinel-2 SWIR, and Landsat thermal — and to the dry-edge geometry that later turned out to be the source of the index's drift problem.",
 concepts:["ndvi","swci","lst","dry-edge","cdei"]},

{era:"p1", date:"Phase 1", kind:"decision",
 title:"Write down the open risk before it can be argued away",
 what:"Phase 1 closed with one question flagged as unresolved: Surrey's corridors are long and narrow, some only 10 m wide, and a Sentinel-2 pixel is 10–20 m across. If a corridor is mostly edge pixels shared with a road, nothing downstream is measuring vegetation.\n\nThis was recorded as the phase's open question rather than assumed away, and Phase 2 was designed to answer it first.",

{era:"p3", date:"2026-07-21", kind:"build",

{era:"p3", date:"2026-07-21", kind:"correction", key:true,

{era:"p3", date:"2026-07-21", kind:"decision",
 title:"Three execution decisions taken before any data arrives",
 what:"**One point per corridor**, placed with a representative point rather than a centroid — a centroid can fall outside a crescent-shaped polygon, and these are crescent-shaped. Multiple points would capture within-corridor elevation variation, but at 50 calls/hour they multiply a 16-hour job by their count for a second-order refinement.\n\n**Summers 2022–2025, seasonal variables.** 2022 is the first summer entirely after the Sentinel-2 processing baseline change; 2025 is the most recent complete one.\n\n**Coarse cell 4 km, with 12 km as the sensitivity variant.** 4 km over a 30 km extent gives ~25 cells at a median of 5 corridors each.",

{era:"p3", date:"2026-07-21", kind:"correction", key:true,
 title:"The saturation finding is withdrawn — it was a software artifact",
 what:"Sentinel-2 products on processing baseline 04.00 and later carry a −1000 DN reflectance offset. The acquisition code subtracted it unconditionally. The products actually being read had **already had it removed at the source**, so subtracting again drove red reflectance below zero, where a `clip(min=0)` guard pinned it at exactly zero — and a ratio with zero in the denominator term returns exactly 1.000.\n\nThat happened to 69% of pixels. The saturation was the clip, not the vegetation.\n\nA second trap sat behind the first: the vendor's own metadata flag saying whether the offset had been applied is **not reliable**. Scenes marked `False` carry the same digital numbers as scenes marked `True`. Believing the flag corrupts a subset of scenes rather than all of them, which is harder to see.",
 why:"The fix had to be a measurement, not a declaration: every Surrey scene contains genuinely dark targets — the Fraser River, Boundary Bay, deep shadow — whose true red reflectance is near zero, so the 1st percentile of valid red sits near 0 DN when no offset is present and near +1000 DN when one is.",
 changed:"The claim was retracted everywhere it had propagated, and the response variable lost its empirical justification — it now rests on the Phase 1 literature grounding alone, which was always the stronger argument. A real ecological signal was underneath: corrected greenness tracks the City's own ecological-value classification in the expected order, a gradient the artifact had flattened.",
 evidence:["above NDVI 0.9: 87% → 0.7% (1 of 153)","corrected range 0.244–0.908, median 0.768","clean scenes measure 44–178 DN; one hazy scene 502; threshold set at 800 DN","City classification, corrected: High 0.770 > Moderate 0.732 > Low 0.666 — spread 0.104, twice the artifact's 0.05"],
 artifacts:["src/pipeline/acquire_raster.py","docs/ndvi_saturation_correction_notebooklm_note.md"],
 concepts:["boa-offset","ndvi-saturation-artifact","reflectance","ndvi"]},

{era:"p3", date:"2026-07-21", kind:"decision", key:true,
 title:"The experiment plan is hardened with four engineering corrections",
 what:"The plan was drafted with Gemini against the knowledge notebook, then four corrections were applied to it before execution:\n\n- **Real spatially-blocked cross-validation, not random splits.** A random 70/30 split leaks spatial autocorrelation and inflates every score.\n- **Model B is the same variables upscaled**, never a different coarse product — substituting a product would confound dataset with resolution and test nothing.\n- **Climate-only predictors for the comparison.** The response variable is built from satellite bands, so a satellite-derived predictor would be predicting itself.\n- **Group folds by corridor.** With multi-year rows a corridor must never appear in both training and test.",
 why:"Each correction closes a route by which the experiment could return a good-looking number that means nothing. Three of the four are about what **not** to let in.",
 changed:"These four constraints are the reason the eventual negative result is worth anything. They were also written down before the result was known, which is why they can be pointed at now.",
 artifacts:["PHASE3_PLAN.md","src/pipeline/experiment.py"],
 concepts:["blocked-cv","grouped-folds","degrade-not-substitute","leakage-discipline","model-a-vs-b"]},
