<title>AP Physics 1 — Learning Centre</title>

<!--
  A study centre for AP Physics 1: Algebra-Based, built for a May 2027 exam.

  Same engine as the other centres: no framework, no build step, no CDN, no
  network. It opens from file:// and keeps every byte of progress in
  localStorage under its own key.

  WHERE THE CONTENT COMES FROM. Everything taught here traces to the College
  Board Course and Exam Description — the current edition, incorporating the
  clarifications implemented for Fall 2026, which is the one governing a May
  2027 exam. A single extract of that document was made once and every writer
  worked from that one copy, so the centre cannot disagree with itself about
  what the syllabus says. Every concept carries the CED topic code it came
  from, and selfCheck() refuses a concept that does not.

  WHY content.js IS A SEPARATE FILE. The Surrey centre keeps its content
  literals inline, because a person wrote them one at a time. This centre's
  concepts, cards, questions and question banks were drafted unit by unit and
  merged, so they live in a generated file and this one stays hand-written.
  Both are ordinary classic scripts — nothing here is a build step, and the
  page still opens from a file with no server.

  This centre is NOT affiliated with, endorsed by, or produced by the College
  Board. AP is their trademark.
-->

<link rel="stylesheet" href="../shared/centre.css" />
<style>
/* Centre-local styling only. Anything shared with the other centres belongs in
   ../shared/centre.css; anything that is furniture for this course's own views
   belongs here, so a change for physics cannot reach the English centre. */

/* The unit group with no colour of its own in the shared palette. */
.p-slate{background:#e6e8ec;color:#2f3542}
.p-slate .dot{background:#7b8494}

/* ---- formula sheet ---- */
.eqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.eqcard{border:1px solid var(--card-line);border-radius:var(--radius);background:#fff;padding:14px 16px}
.eqcard.notgiven{border-color:var(--pill-red-dot);background:#fffaf9}
.eqhead{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.eqname{font-weight:600;font-size:14px;flex:1;min-width:0}
.eqtex{font-size:18px;padding:10px 0;text-align:center;overflow-x:auto}
.eqvars{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-soft);
        border-top:1px solid var(--line);padding-top:8px}
.eqv b{font-weight:500;color:var(--ink)}
.eqwhen{font-size:13px;line-height:1.55;margin-top:10px}
.eqnote{font-size:12.5px;line-height:1.55;margin-top:8px;color:var(--ink-soft)}

/* ---- units ---- */
.ubar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:4px;min-width:80px}
.ubar i{display:block;height:100%;background:var(--pill-green-dot)}

/* ---- exam simulator ---- */
.examtop{display:flex;gap:12px;align-items:center;flex-wrap:wrap;
         border-bottom:1px solid var(--line);padding-bottom:12px}
.clock{margin-left:auto;font-variant-numeric:tabular-nums;font-size:22px;font-weight:700;
       letter-spacing:-.02em}
.clock.low{color:var(--pill-red-ink)}
.qnav{display:flex;flex-wrap:wrap;gap:4px;margin-top:14px}
.qn{width:28px;height:26px;border:1px solid var(--line-strong);border-radius:5px;background:#fff;
    font-size:11px;color:var(--ink-soft);padding:0;cursor:pointer}
.qn.done{background:var(--rail);color:var(--ink);font-weight:600}
.qn.flag{border-color:var(--pill-orange-dot)}
.qn.now{background:var(--ink);color:#fff;border-color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;

     font-size:14.5px;line-height:1.55;cursor:pointer;transition:border-color .12s,background .12s}

.opt.on{border-color:var(--ink);background:var(--rail)}
.optl{font-weight:700;color:var(--ink-faint);flex:0 0 auto}
.opt.on .optl{color:var(--ink)}
.optt{flex:1;min-width:0}
.frparts{margin:14px 0 0;padding-left:20px;font-size:14.5px;line-height:1.7}
.frparts li{margin:0 0 8px}
.guide{margin-top:12px}
.gpart{border:1px solid var(--card-line);border-radius:var(--radius);background:#fff;
       padding:12px 16px;margin-bottom:10px}
.gplabel{font-weight:600;font-size:13px;color:var(--ink-soft);margin-bottom:4px}

</head>

</div>

<script src="content.js"></script>

   gist:"Deriving, calculating, estimating, comparing and predicting. The bulk of the multiple-choice section."},
  {code:"Practice 3", name:"Scientific Questioning and Argumentation",

/* ---- how this site teaches -----------------------------------------------
   The learning science is the same wherever it is applied, so this is the
   Surrey centre's method essay with its examples changed to this course. The
   evidence is cited because the gates are annoying and an annoying gate with
   no reason behind it gets routed around. */
var METHOD = [
  {
    name:"Guess before you read",
    where:"Every concept page opens with one question and a blank box.",
    why:"Reading an explanation you have not tried to produce is the cheapest possible encounter "+
      "with it. Everything makes sense, nothing sticks, and what you take away is mostly the "+
      "feeling of having understood. Attempting first — and failing — changes what the prose is: "+
      "it arrives as the resolution to a question you are actually holding.",
    evidence:"Kornell, Hays & Bjork (2009); Richland, Kornell & Kao (2009). A failed retrieval "+
      "attempt before study beats spending the same time studying. The errors are not a cost paid "+
      "for the benefit — they appear to be part of the mechanism.",
    note:"Write the wrong thing rather than nothing. A blank is a weaker pretest than a bad guess."
  },
  {
    name:"Commit to a confidence, then look",
    where:"Flashcards ask how sure you are, and that button is what reveals the answer.",
    why:"Grading yourself after seeing the answer is the one place this app could quietly lie to "+
      "itself. Recognising a correct answer is easy and feels almost exactly like having known it. "+
      "Taking the claim before the answer is on screen makes it a prediction, which can be scored.",
    evidence:"The delayed-judgement-of-learning literature: confidence judgements made while the "+
      "material is still on screen track fluency rather than memory, and are systematically "+
      "inflated. Judgements made without that crutch are far better calibrated.",
    note:"In physics the inflation is specific and predictable: following a worked solution feels "+
      "identical to being able to produce one. It is not."
  },
  {
    name:"Spacing, and coming back to what you got wrong",
    where:"Cards return on a schedule that lengthens when you are right and collapses when you "+
      "are not. Three correct recalls on three separate days is the criterion.",
    why:"Massed practice produces fast, confident, short-lived learning. Spaced practice feels "+
      "worse while you do it and is what is still there in May. The schedule is built to make the "+
      "uncomfortable option the default one.",
    evidence:"Rawson & Dunlosky's criterion work on successive relearning; Cepeda et al. on the "+
      "spacing effect across hundreds of studies.",
    note:"The due count in the sidebar is the only number on this site worth chasing daily."
  },
  {
    name:"Worked examples that show their reasoning",
    where:"Every concept carries a worked problem where each step says why that step.",
    why:"A solution that prints only its moves teaches you to copy moves, which works until the "+
      "numbers change. The decision — energy rather than kinematics, this system boundary, this "+
      "axis — is the part that transfers, and it is exactly the part a clean solution hides.",
    evidence:"The worked-example effect (Sweller and colleagues) holds most strongly when the "+
      "example is elaborated rather than bare, and fades as expertise grows — which is why the "+
      "examples here explain themselves rather than being minimal.",
    note:"Cover the solution, try the problem, then compare your route to the one given. Two "+
      "correct routes are common in this subject and the comparison is the lesson."
  },
  {
    name:"An exam in the exam's own shape",
    where:"The simulator runs 42 questions in 85 minutes, then four free-response questions in 95.",
    why:"Pacing is a skill and it is the one most easily practised and most often left "+
      "unpractised. Two minutes a question is not a fact you learn, it is a rhythm you acquire. "+
      "The free-response section is then scored point by point against a guideline, because a "+
      "holistic self-grade is a guess dressed as a mark.",
    evidence:"The testing effect: retrieval under conditions resembling the criterion task "+
      "transfers better than restudy, and the resemblance matters.",
    note:"Section II is handwritten in the real exam. Work it on paper here too — typing a "+
      "derivation you would have written by hand is practising a different task."
  }
];

/* The question-bank presets. `n` is how many questions a run serves; `tier`
   filters to one difficulty band and `weakest` reorders by what the scheduler
   says you are worst at. Keys must match CENTRE.mock.order. */
var PRESETS = {
  explain: {label:"Explain it", emo:"💬", n:10, tier:1,
    blurb:"Tier 1. No numbers. Can you say what the idea is, out loud, to someone who has not met it?"},

    blurb:"Tier 2. The quantitative ones — can you actually get the number, with units, under time?"},
  traps:   {label:"The traps", emo:"⚠️", n:10, tier:3,
    blurb:"Tier 3. The sign error, the normal force that is not mg, the two conservation laws that are not the same law."},
  weakest: {label:"Your weakest", emo:"🎯", n:12, weakest:true,
    blurb:"Questions tagged to the concepts your own card record says you are shakiest on."}
};

var SOURCES = [
  {label:"AP Physics 1: Algebra-Based Course and Exam Description",
   what:"The syllabus, and the only source of truth for this centre. Every unit, topic code, "+
        "learning objective, essential knowledge statement, exam weighting, the exam format and "+
        "the provided equation sheet. Version V.1, stated effective Fall 2024, incorporating the "+
        "clarifications implemented for Fall 2026 — the edition governing a May 2027 exam.",
   url:"https://apcentral.collegeboard.org/media/pdf/ap-physics-1-course-and-exam-description.pdf",
   fetched:"2026-08-05"},
  {label:"AP Central — how AP Exams are administered, by course",

   url:"https://apcentral.collegeboard.org/",

   url:null,
   fetched:"2026-08-05"}
];

/* ===========================================================================
   THE CENTRE
   =========================================================================== */
var CENTRE = {

    {href:"#/exam", pill:"p-pink", eyebrow:"Under the clock",

     body:"42 questions in 85 minutes, then four free-response questions in 95, scored " +

    {href:"#/method", pill:"p-purple", eyebrow:"Read once",
     title:"Why this site keeps getting in your way",
     body:"The gates, the guessing and the spacing are all deliberate. Worth ten minutes " +

  ],

  aboutNote:
    "<strong>What this site is.</strong> A study centre for AP Physics 1, built from the College " +
    "Board Course and Exam Description for the year in effect for a <strong>May 2027</strong> " +

    "Every claim on this site traces to the Course and Exam Description. Nothing was invented for " +

  sourcesNote:
    "<strong>The honest note.</strong> " +
    "This is a study aid assembled from one reading of the CED, so it inherits any error in that " +
